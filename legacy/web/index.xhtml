<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components">
    <h:head>
        <title>.: CCPM :.</title>
        <link rel="stylesheet" href="css/cssCCPM.css" type="text/css"/>
        <link rel="shortcut icon" href="images/favicon.png"/>
        <link rel="stylesheet" type="text/css" href="css/style.css" />
        
       
    </h:head>
    <h:body>
        
       
        <f:loadBundle basename="org.ccpm.bienes.ui.labelsCCPM" var="msg"/>        
        <div id="top" class="banner-top" title=" ">

            <div align="right">
                <h:form id="loginForm"> 
                    <table cellspacing="5">
                        <tr>
                            <td>
                                <ace:textEntry id="user" placeholder="#{msg.ussT}" value="#{webManagedBean.nombreUsuario}" required="true">
                                </ace:textEntry>
                            </td>
                            <td>
                                <ace:textEntry id="pass" placeholder="#{msg.passT}" value="#{webManagedBean.claveAcceso}" required="true" secret="true">
                                </ace:textEntry>
                            </td>
                            <td>
                                <h:commandButton id="login" value="#{msg.login}" action="#{webManagedBean.login}"/>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <ace:message id="userMsg" for="user" initEffect="slide" changeEffect="shake"/>
                            </td>
                            <td>
                                <ace:message id="passMsg" for="pass" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>                        
                    </table>
                </h:form>
            </div>

        </div>
     <div id="wowslider-container1">
	<div class="">
		<img src="images/yaguarete.JPEG" alt="8" title="8" id="wows1_0"/>
		
	</div>
	
	</div>			
        
        
        <div id="footer" class="footer-top" title=" ">
            <ui:include src="footer.xhtml"/>
        </div>  
        
    </h:body>
    
</html>
