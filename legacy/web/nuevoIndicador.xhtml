<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevaIndicador" title=" ">
                <ace:panel id="nuevaIndicador" header="#{msg.newIndicador}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                          
                         
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Metas" />
                            </td>
                            <td align="left">
                                <ace:simpleSelectOneMenu id="sltMetas" value="#{indicadorManagedBean.idMeta}" label="Metas"  required="true" style="width: 430px">
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{indicadorManagedBean.selectItemsMetas}" /> 
                                    <ace:ajax render="@this sltMetas sltMetasMsg" event="blur"/> 
                                </ace:simpleSelectOneMenu>
                            </td>
                            <td align="left">
                                <ace:message id="sltMetasMsg" for="sltMetas" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Leyenda" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="leyenda" label="leyenda" value="#{indicadorManagedBean.leyenda}" required="true" size="53">
                                                                    
                                </ace:textEntry>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripción" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="descripcion" label="#{msg.name}" value="#{indicadorManagedBean.descripcion}" required="true" size="53">
                                                                  
                                </ace:textEntry>
                            </td>
                        </tr>   
                       
                        
                     </table>
                    
                    <h:outputText value="Tamaño de Serie"   />
                    <ace:textEntry id="serieSize" value="#{indicadorManagedBean.serieSize}">
                            <ace:ajax event="valueChange" render="@this serieSizeOutput panelSerie panelValores"/>
                        </ace:textEntry>
                    <ace:panel id="panelSerie" header="SERIE">
                        <h:panelGrid  columns="5">
                            <c:forEach var="i" begin="0" end="#{indicadorManagedBean.serieSize-1}">  
                                <ace:textEntry id="serieSizeOutput" value="#{indicadorManagedBean.serie[i]}"/>
                            </c:forEach>
                        </h:panelGrid>
                    </ace:panel>
                     <ace:panel header="VARIABLE">
                        <h:panelGrid columns="3">
                                <ace:textEntry value="#{indicadorManagedBean.variableIndicador[0]}"/>
                                <ace:textEntry value="#{indicadorManagedBean.variableIndicador[1]}"/>
                                <ace:textEntry value="#{indicadorManagedBean.variableIndicador[2]}"/>
                        </h:panelGrid>
                    </ace:panel>
                    <ace:panel id="panelValores" header="VALORES">
                        <h:panelGrid columns="3">
                            <c:forEach var="i" begin="0" end="#{indicadorManagedBean.serieSize*3-1}">
                                <h:inputText value="#{indicadorManagedBean.valores[i]}"/>
                            </c:forEach>
                        </h:panelGrid>
                    </ace:panel>
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <ace:pushButton id="save" value="#{msg.save}" action="#{indicadorManagedBean.crear()}"/>
                        <ace:pushButton id="saveCreate" value="#{msg.saveCreate}" action="#{indicadorManagedBean.crearOtro()}"/>
                        <ace:pushButton id="cancel" value="#{msg.cancel}" action="indicadorConf" immediate="true" actionListener="#{indicadorManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
