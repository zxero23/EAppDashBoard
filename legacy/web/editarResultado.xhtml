<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarResultado" title=" ">
                <ace:panel id="editarResultado" header="#{msg.editResultado}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="anio" label="#{msg.name}" value="#{resultadoManagedBean.anio}" required="true" size="55">
                                    <ace:ajax render="@this anio anioMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="anioMsg" for="anio" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Trimestre" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="cuatrimestre" label="Trimestre" value="#{resultadoManagedBean.cuatrimestre}" required="true" size="55">
                                    <ace:ajax render="@this cuatrimestre cuatrimestreMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="cuatrimestreMsg" for="cuatrimestre" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                       
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Porcentaje " />
                            </td>
                            <td align="left">
                                <ace:textEntry id="porcentaje" label="porcentaje" value="#{resultadoManagedBean.porcentaje}" required="true" size="55">
                                    <ace:ajax render="@this porcentaje porcentajeMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="porcentajeMsg" for="porcentaje" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{resultadoManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <ace:pushButton id="save" value="#{msg.saveEdit}" action="#{resultadoManagedBean.guardarEdicion}"/>                        
                        <ace:pushButton id="cancel" value="#{msg.cancel}" action="resultadoConf" immediate="true" actionListener="#{resultadoManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
