<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevaResultado" title=" ">
                <ace:panel id="nuevaResultado" header="#{msg.newResultado}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                          
                         
                        
                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Año" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="anio" label="anio" value="#{resultadoManagedBean.anio}" required="true" size="53">
                                                                    
                                </ace:textEntry>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Cuatrimestre" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="cuatrimestre" label="#{msg.name}" value="#{resultadoManagedBean.cuatrimestre}" required="true" size="53">
                                                                  
                                </ace:textEntry>
                            </td>
                        </tr>   
                       
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Total" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="porcentaje" label="#{msg.name}" value="#{resultadoManagedBean.porcentaje}" required="true" size="53">
                                                                  
                                </ace:textEntry>
                            </td>
                        </tr>
                        
                     </table>
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <ace:pushButton id="save" value="#{msg.save}" action="#{resultadoManagedBean.crear()}"/>
                        <ace:pushButton id="saveCreate" value="#{msg.saveCreate}" action="#{resultadoManagedBean.crearOtro()}"/>
                        <ace:pushButton id="cancel" value="#{msg.cancel}" action="resultadoConf" immediate="true" actionListener="#{resultadoManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
