<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formDetalleVariables" title=" ">
                <ace:panel id="detalleVariables" header="#{msg.detailsVariable}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.id}"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{variablesManagedBean.variable.id}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.findley}:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{variablesManagedBean.variable.leyenda}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Descripcion:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{variablesManagedBean.variable.descripcion}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Indicador:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{variablesManagedBean.variable.indicador.leyenda}"/>
                            </td>                            
                        </tr>
                       
                        
                     </table>   
                    
                    <div align="center">                        
                        <ace:linkButton action="variablesConf" value="- Volver -"/>
                    </div>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
