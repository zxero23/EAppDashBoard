<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarOperaciones" title=" ">
                <ace:panel id="editarOperaciones" header="#{msg.editVariable}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="leyenda" label="(*) Leyenda:" value="#{variablesManagedBean.leyenda}" required="true" size="55">
                                    <ace:ajax render="@this leyenda leyendaMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="leyendaMsg" for="leyenda" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripcion:" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="descripcion" label="Formula" value="#{variablesManagedBean.descripcion}" required="true" size="55">
                                    <ace:ajax render="@this descripcion descripcionMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="descripcionMsg" for="descripcion" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Indicador" />
                            </td>
                            <td align="left">
                                <ace:selectMenu id="sltIndicador" value="#{variablesManagedBean.idIndicador}" label="indicador"  required="true" width="400">
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{variablesManagedBean.selectItems}" /> 
                                    <ace:ajax render="@this sltIndicador sltIndicadorMsg" event="blur"/> 
                                </ace:selectMenu>
                            </td>
                            <td align="left">
                                <ace:message id="sltIndicadorMsg" for="sltIndicador" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{variablesManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <ace:pushButton id="save" value="#{msg.saveEdit}" action="#{variablesManagedBean.guardarEdicion}"/>                        
                        <ace:pushButton id="cancel" value="#{msg.cancel}" action="variablesConf" immediate="true" actionListener="#{variablesManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
