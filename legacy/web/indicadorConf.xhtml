<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formIndicador" title=" ">
                <ace:panel id="IndicadorPanelActualizar" header="#{msg.confIndicador}">
                      <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <ace:linkButton action="indicadorConf" actionListener="#{indicadorManagedBean.actualizar}" value="#{msg.confIndicador}"/>
                            |
                        </h:panelGroup>

                          <h:panelGroup rendered="#{indicadorManagedBean.alta}" >
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <ace:linkButton action="nuevoIndicador" value="Nuevo Indicador"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <ace:panel id="indicadorPanelBusqueda" header="#{msg.busqueda}" toggleable="true" toggleSpeed="200" collapsed="true" class="panel-buttons">
                        <h:panelGrid  columns="3">
                            <ace:textEntry id="nombre" value="#{indicadorManagedBean.leyendaBuscar}" label="#{msg.findley}" labelPosition="left"/>
                            <ace:pushButton id="find" value="${msg.find}" actionListener="#{indicadorManagedBean.aplicarFiltro()}"/>
                            <ace:pushButton id="actualizar" value="#{msg.actualizar}" actionListener="#{indicadorManagedBean.actualizar}"/>
                        </h:panelGrid>                     
                    </ace:panel>

                    <ace:dataTable id="IndicadorDataTable" value="#{indicadorManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                        <ace:column id="id" headerText="#{msg.idT}" style="width: 7%">
                            <center>
                                <h:outputText id="cellId" value="#{item.id}"/>
                            </center>
                        </ace:column>

                        <ace:column id="leyenda" headerText="#{msg.findley}">
                            <center>
                                <h:outputText id="cellLeyenda" value="#{item.leyenda}"/>
                            </center>
                        </ace:column>
                        
                        <ace:column id="descripcion" headerText="Descripción">
                            <center>
                                <h:outputText id="cellDescripcion" value="#{item.descripcion}"/>
                            </center>
                        </ace:column>
                        
                        <ace:column id="formula" headerText="Fórmula">
                            <center>
                                <h:outputText id="cellFormula" value="#{item.formula}"/>
                            </center>
                        </ace:column>
                        
                        <ace:column id="meta" headerText="Meta">
                            <center>
                                <h:outputText id="cellMeta" value="#{item.metas.leyenda}"/>
                            </center>
                        </ace:column>
                        
                        <ace:column id="ORG" headerText="Organismo">
                            <center>
                                <h:outputText id="cellORG" value="#{item.metas.objetivos.organismo.leyenda}"/>
                            </center>
                        </ace:column>
                       
                        
                        


                                              
                        

                        <ace:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <center>
                                <h:panelGrid  columns="3"> 

                                    <ace:pushButton id="detalle" action="detalleIndicador" actionListener="#{indicadorManagedBean.verDetalle}" rendered="#{indicadorManagedBean.detalle}">
                                        <img src="images/symbolZoomInWhite.png" />
                                        <f:param name="id" value="#{item.id}"/>
                                    </ace:pushButton>

                                    <ace:pushButton id="editar" action="editarIndicador" actionListener="#{indicadorManagedBean.prepararParaEditar()}" rendered="#{indicadorManagedBean.modificacion}">
                                        <img src="images/symbolEditWhite.png" />
                                        <f:param name="id" value="#{item.id}"/>
                                    </ace:pushButton>

                                    <ace:pushButton id="eliminar"  rendered="#{indicadorManagedBean.baja}" p:onclick="ice.ace.instance('#{confirmDialogIndicador.clientId}').show();return false;">
                                        <img src="images/symbolDeleteWhite.png" /> 
                                    </ace:pushButton>
                                    <ace:confirmationDialog id="confirmDialogIndicador" binding="#{confirmDialogIndicador}"
                                                            message="${msg.msgDelete}"
                                                            header="${msg.confirm}"
                                                            modal="true"
                                                            width="300"
                                                            height="155"
                                                            position="center">
                                        <h:panelGrid columns="2" class="panel-confirm-buttons">
                                            <ace:pushButton id="yes" value="${msg.acep}" p:onclick="ice.ace.instance('#{confirmDialogIndicador.clientId}').hide();" actionListener="#{indicadorManagedBean.guardarBorrado()}">
                                                <f:param name="id" value="#{item.id}" />
                                                <f:ajax execute="@this" render="@all"/>
                                            </ace:pushButton>
                                            <ace:pushButton id="no" value="${msg.cancel}" p:onclick="ice.ace.instance('#{confirmDialogIndicador.clientId}').hide();">
                                                <f:ajax execute="@this" render="@all"/>
                                            </ace:pushButton>
                                        </h:panelGrid>
                                    </ace:confirmationDialog>

                                </h:panelGrid>
                            </center>
                        </ace:column> 
                        
                        
                            
                        
                        
                    </ace:dataTable>
                </ace:panel>
               
                
                </h:form>
            
            
           
            
        </ui:define>
    </ui:composition>
</html>
