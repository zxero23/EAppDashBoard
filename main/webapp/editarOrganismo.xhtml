<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="#{msg.editOrganismo}"/>
        <ui:param name="miBean" value="#{organismoManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="organismoConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.organismoPadre}:" />
                </td>
                <td align="left"><p:selectOneMenu
                        id="organismoPadre"
                        value="#{organismoManagedBean.idOrganismoPadre}"
                        style="width: 560px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{organismoManagedBean.selectItems}" />
                        <f:ajax render="@this organismoPadreError" event="valueChange"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="organismoPadreError" for="organismoPadre" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.nombre}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombreOrganismo"
                        value="#{organismoManagedBean.nombre}"
                        label="#{msg.nombre}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this nombreOrganismoError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreOrganismoError" for="nombreOrganismo" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.cod}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="codOrganismo"
                        value="#{organismoManagedBean.codOrganigrama}"
                        label="#{msg.codOrganismo}"
                        type="number"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this codOrganismoError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="codOrganismoError" for="codOrganismo" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.descripcion}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="descripcion"
                        value="#{organismoManagedBean.descripcion}"
                        label="#{msg.descripcion}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this descripcionError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="descripcionError" for="descripcion" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.implementa}:" />
                </td>
                <td align="left">
                    <p:selectBooleanCheckbox id="implementa" value="#{organismoManagedBean.implementa}">
                    <f:ajax />
                </p:selectBooleanCheckbox>
                </td>
                <td align="left">
                    <p:message id="implementaError" for="implementa" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.fechaImplementacion}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="fecImp"
                        value="#{organismoManagedBean.fechaImple}"
                        styleClass="muyancho">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                    </p:inputText>
                </td>
            </tr>
            <h:inputHidden value="#{organismoManagedBean.id}"/>
        </ui:define>
    </ui:composition>
</html>
