<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="./layoutDetalle.xhtml">
        <ui:param name="tituloVentana" value="#{msg.detailsInstLegal}"/>
        <ui:param name="actionVolver" value="instrumentoLegalConf"/>
        <ui:param name="miBean" value="#{expedienteManagedBean}"/>
        <ui:param name="actionListenerRefresh" value="limpiarInstrumentoLegal"/>
        <ui:define name="elDetalle">
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.expediente}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{expedienteManagedBean.expediente.nroExp}"/>           
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.id}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{expedienteManagedBean.id}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.num}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{expedienteManagedBean.numero}"/>           
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.descripcion}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{expedienteManagedBean.descripcion}"/>           
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.fojas}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{expedienteManagedBean.fojasInst}"/>           
                </td>
            </tr>            
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.tipo}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{expedienteManagedBean.tipoInstrumento}"/> 
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.archivoAdjunto}:"/>
                </td>

                <td align="left">
                    <h:panelGroup rendered="#{expedienteManagedBean.archivo!=null}">
                        <p:graphicImage resource="#{expedienteManagedBean.prepararAdjunto(expedienteManagedBean.archivo)}" 
                                             type="button"
                                             rendered="#{expedienteManagedBean.archivo!=null}"
                                             label="#{msg.descargar}"
                                             attachment="true"
                                             fileName="#{expedienteManagedBean.renombrar(expedienteManagedBean.archivo)}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{expedienteManagedBean.archivo==null}">
                        <h:outputText value="NO"/>
                    </h:panelGroup>                                
                </td>                            
            </tr>

        </ui:define>
    </ui:composition>
</html>
