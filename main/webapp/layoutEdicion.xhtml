<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu" enctype="multipart/form-data">
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{tituloVentana}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">
                            
                            
                            <ui:insert name="derechaPrimero"/>
                            <p:commandLink action="#{actionVolver.toString}" actionListener="#{miBean[actionListenerRefresh]}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true" ajax="false"/>
                        </div>                       
                    </div>
                </div>
                <div id="accionesGen" style="clear: both">
                    <table border="0" cellspacing="5">
                        <ui:insert name="laEdicion"/>
                    </table>               
                </div>
                <div style="margin-bottom: 15px;margin-top: 15px;">
                    <ui:insert name="masInfo"/>
                </div>
                <div align="left">
                    <h:panelGrid columns="2">
                        <p:commandButton value="#{msg.saveEdit}" action="#{miBean[actionListenerEditar]}" style="margin-left:5px;" ajax="false"/>
                        <p:commandButton value="#{msg.cancel}" actionListener="#{miBean[actionListenerRefresh]}" action="#{actionVolver.toString}" immediate="true" ajax="false"/>
                    </h:panelGrid>                     
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
