<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutDetalle.xhtml">
        <ui:param name="tituloVentana" value="#{msg.detailsUsuario}"/>
        <ui:param name="actionVolver" value="usuarioConf"/>
        <ui:param name="miBean" value="#{usuarioManagedBean}"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:define name="elDetalle">
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.id}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.id}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.apellido}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.apellido}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.nombre}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.nombre}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="DNI:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.dni}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.correo}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.email}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.usuario}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.nombreUsuario}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.mesa}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.mesa.nombre}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.fechaAlta}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.fechaAlta}">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                    </h:outputLabel>        
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.fechaModif}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.fechaModificacion}">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                    </h:outputLabel>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.ultimoLogin}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.ultimoLogin}">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                    </h:outputLabel>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.habilitado}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuarioAux.estado?'S�':'NO'}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.confGrupo}:" />
                </td>
                <td align="left">
                    <p:dataTable id="list" value="#{usuarioManagedBean.usuarioAux.grupos}" var="item" style="width: 100%">
                        <p:column headerText="#{msg.nombre}">
                            <div align="left">
                                <h:outputText value="#{item.nombre}"/>
                            </div>
                        </p:column>   
                    </p:dataTable>
                </td>
            </tr>
            <ui:fragment rendered="#{usuarioManagedBean.asignarMesasDisponibles}" >
                <tr>
                    <td align="right">
                        <h:outputLabel value="#{msg.mesasDisponibles}:" />
                    </td>
                    <td align="left">
                        <p:dataTable id="disponibles" value="#{usuarioManagedBean.usuarioAux.mesasDisponibles}" var="item" style="width: 100%">
                            <p:column headerText="#{msg.nombre}">
                                <div align="left">
                                    <h:outputText value="#{item.nombre}"/>
                                </div>
                            </p:column>   
                        </p:dataTable>
                    </td>
                </tr>
            </ui:fragment>
        </ui:define>
    </ui:composition>
</html>
