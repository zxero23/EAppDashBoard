<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="jakarta.faces.passthrough">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="#{actionRefresh}_formu">
                <div id="titulo" class="principal page-title">
                    <h1>
                        <h:outputLabel value="#{tituloVentana}"/>
                    </h1>
                </div>                
                
                <h:panelGrid columns="6" class="panel-buttons page-top-actions">
                    <span class="pi pi-refresh" aria-hidden="true"/>
                    <p:commandLink  action="#{actionRefresh.toString}" actionListener="#{miBean[actionListenerRefresh]}" value="#{tituloVentana}"/>
                    |
                    <h:panelGroup rendered="#{renderedAlta}">
                        <span class="pi pi-plus" aria-hidden="true"/>
                        <p:commandLink action="#{actionAlta.toString}" value="#{valueAlta}" />
                    </h:panelGroup>
                    <ui:insert name="accionesGeneral"/>
                </h:panelGrid>               
                <h:panelGroup id="panelbusqueda" layout="block" styleClass="panelbusqueda">
                <p:panel id="expPanelBusqueda" toggleable="true" toggleSpeed="500" collapsed="true" styleClass="panel-buttons panel-busqueda">
                    <f:facet name="header">
                        <h:outputText value="#{msg.busqueda}"/>
                    </f:facet>
                    <ui:insert name="busqueda"/>
                    <div class="panel-busqueda-botones">
                        <p:commandButton id="btnBuscar" value="#{msg.find}" actionListener="#{miBean[actionListenerBuscar]}" update="@form" process="@form"/>
                        <p:defaultCommand target="btnBuscar"/>
                        <p:commandButton value="#{msg.actualizar}" actionListener="#{miBean[actionListenerActualizar]}" update="@form" process="@form"/>
                    </div>
                </p:panel>
                </h:panelGroup>
                <h:panelGroup>
                <p:dataTable id="#{actionRefresh}_tablita"
                               value="#{miBean[tablaValue]}"
                               var="item"
                               rows="10"
                               style="width:100%; margin-top: 10px;"
                               paginator="true"
                               paginatorPosition="bottom"
                               rowsPerPageTemplate="10,20,50,100">
                    <p:column id="ident" headerText="#{msg.id}" style="width: 5%">
                        <center>
                            <h:outputText id="identValor" value="#{item.id}"/>
                        </center>
                    </p:column>
                    <p:column id="nombre" headerText="#{msg.nombre}">
                        <h:outputText id="nombreValor" value="#{item.nombre}"/>
                    </p:column>

                    <ui:insert name="otrasColumnas"/>


                    <p:column id="acciones" headerText="#{msg.action}" style="width: 15%">

                        <h:panelGroup layout="block" styleClass="acciones-tabla">
                            <p:commandButton id="detalle"
                                            action="#{actionDetalle.toString}"
                                            actionListener="#{miBean[actionListenerDetalle]()}"
                                            rendered="#{renderedDetalle}"
                                            immediate="true"
                                            icon="pi pi-search"
                                            value=""
                                            title="#{msg.detalle}">
                                <f:param name="id" value="#{item.id}" />
                            </p:commandButton>
                            <p:commandButton action="#{actionEditar.toString}" actionListener="#{miBean[actionListenerEditar]}" rendered="#{renderedEditar}"
                                            icon="pi pi-pencil"
                                            value="">
                                <f:param name="id" value="#{item.id}" />
                            </p:commandButton>
                            <p:commandButton id="borrarDialogbtn"
                                            p:onclick="PF('borrarDialog').show();return false;"
                                            rendered="#{renderedBorrar}"
                                            icon="pi pi-trash"
                                            value="">
                                <f:param name="id" value="#{item.id}" />
                            </p:commandButton>
                            <p:dialog id="borrarDialog"
                                                    widgetVar="borrarDialog"
                                                    binding="#{borrarDialog}"
                                                    header="#{msg.confirm}"
                                                    draggable="false">
                                <p:outputLabel value="#{msg.msgDelete}"/>
                                <h:panelGrid id="#{actionRefresh}_grilla" columns="2" styleClass="panel-confirm-buttons">
                                    <p:commandButton id="#{actionRefresh}_yes"
                                                    value="#{msg.acep}"
                                                    p:onclick="PF('borrarDialog').hide();"
                                                    actionListener="#{miBean[actionListenerBorrar]}">
                                        <f:param id="#{actionRefresh}_ipar"  name="id" value="#{item.id}" />
                                        <f:ajax execute="@this" render="@all"/>
                                    </p:commandButton>
                                    <p:commandButton id="#{actionRefresh}_no"
                                                    value="#{msg.cancel}"
                                                    p:onclick="PF('borrarDialog').hide();">
                                        <f:ajax execute="@this" render="@all"/>
                                    </p:commandButton>
                                </h:panelGrid>
                            </p:dialog>
                        </h:panelGroup>
                    </p:column>
                </p:dataTable>
                    </h:panelGroup>
                <ui:include src="includes/ajaxStatus.xhtml"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
