<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html">
    <ui:composition template="./layoutDetalle.xhtml">
        <ui:param name="tituloVentana" value="#{msg.detailsTipoAsunto}"/>
        <ui:param name="actionVolver" value="tipoAsuntoConf"/>
        <ui:param name="miBean" value="#{tipoAsuntoManagedBean}"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:define name="elDetalle">
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.id}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{tipoAsuntoManagedBean.id}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.nombre}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{tipoAsuntoManagedBean.nombre}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.descripcion}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{tipoAsuntoManagedBean.descripcion}"/>
                </td>
            </tr>                      
        </ui:define>
    </ui:composition>
</html>
