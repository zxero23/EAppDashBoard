<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>.: SE :.</title>
        <link rel="stylesheet" href="css/cssCCPM.css" type="text/css"/>
        <link rel="shortcut icon" href="images/favicon.png"/>
    </h:head>
    <h:body>
        <div id="top" class="banner-top" title=" " align="right">
            <div>
                <span class="pi pi-sign-out" style="color: #00aaee" aria-hidden="true"/>
                <p:commandLink value="#{msg.salir}" action="index" actionListener="#{webManagedBean.logout}" style="margin-right:0.5%; color: #08446c;"/>
            </div>
        </div>
        <div id="conten-top-index">
            <h:form id="formConfiguracion" styleClass="form" title=" ">
                <div id="titulo" class="principal">
                    <h3>
                        <p:graphicImage value="#{webManagedBean.images}" style="margin-right: 5px;"/>
                        <h:outputLabel value="#{webManagedBean.title}"/>
                    </h3>
                </div>
                <div id="msj">
                    <h:panelGrid columns="2" cellspacing="4">
                        <h:outputLabel value="#{webManagedBean.msgSuccessError}" styleClass="espacioInferior"/>
                        <ui:insert name="imprimir"/>
                    </h:panelGrid>
                </div>
                <br/>
                <div align="center">
                    <p:commandLink action="#{webManagedBean.logout}" value="- #{msg.salir} -" style="color: #08446c;"/>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>
        </div>                    
        <div id="footer" class="footer-top" title=" ">
            <ui:include src="footer.xhtml"/>
        </div>
    </h:body>    
</html>
