<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:composition>
        <h:form title=" " id="logForm">
            <div>
                <span class="pi pi-briefcase" style="color: #FF372B" aria-hidden="true"/>
                <h:outputText value="  #{webManagedBean.organismo.nombre}"/>
            </div>
            <div>
                <span class="pi pi-folder-open" style="color: #FF372B" aria-hidden="true"/>
                <c:if test="#{empty webManagedBean.usuario.mesasDisponibles}" >
                    <h:outputText value="#{webManagedBean.mesa.nombre}"/>
                </c:if>
                <c:if test="#{not empty webManagedBean.usuario.mesasDisponibles}" >

                    <p:commandButton id="btnMesa" value="#{webManagedBean.mesa.nombre}" styleClass="menuBannerSelect" />
                    <p:menu id="menuButton" popup="true" trigger="btnMesa">
                        <c:forEach items="#{webManagedBean.mesasDisponibles}" var="item">
                            <p:menuitem value="#{item.nombre}" outcome="administracion" actionListener="#{webManagedBean.updateMesaUsuario(item.id)}"/>
                        </c:forEach>
                    </p:menu>
                </c:if>

            </div>
            <div>
                <span class="pi pi-user" style="color: #FF372B" aria-hidden="true"/>
                <h:outputText value="  #{webManagedBean.usuario.apellido} #{webManagedBean.usuario.nombre}" style="margin-right:0.5%" />
                <span class="pi pi-cog" style="color: #FF372B" aria-hidden="true"/>
                <p:commandLink action="configuracionConf" actionListener="#{webManagedBean.pass()}" immediate="true" value="#{msg.usuarioContrasenia}" style="margin-right:0.5%; color: #08446c;"/>
                <span class="pi pi-sign-out" style="color: #FF372B" aria-hidden="true"/>
                <p:commandLink value="#{msg.salir}" action="index" actionListener="#{webManagedBean.logout()}" style="margin-right:0.5%; color: #08446c;"/>
            </div>
            <p:blockUI block="logForm" />
        </h:form> 
    </ui:composition>
</html>
