<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">                
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{msg.reenviarExpteNum} #{expedienteManagedBean.expediente.nroExp}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">                                                        
                            <p:commandLink action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>                
                <div id="contenido" style="clear: both">   
                    <table border="0" cellspacing="5">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.fechaCreacion}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.fechaCreacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.cuerpo}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.cuerpo}"/>           
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.fojas}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.fojas}"/>           
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.estado}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.estadoExpediente.nombre}"/>           
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.iniciador}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.arreglarIniciador(expediente.iniciador.nombre)}"/>           
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.tipoAsunto}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.tipoAsunto.nombre}"/>           
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.asunto}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.asunto}"
                                               style="width: 200px;"/>           
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.ordenPago}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.ordenPago}"/>
                            </td>
                        </tr>
                        <h:panelGroup rendered="#{expedienteManagedBean.perteneceContaduria}">
                            <tr>
                                <td align="right">
                                    <h:outputLabel value="#{msg.pedidoFondo}:" />
                                </td>
                                <td align="left">
                                    <h:outputLabel value="#{expedienteManagedBean.expediente.pedidoFondo}"/>
                                </td>
                            </tr>
                            <tr>
                                <td align="right">
                                    <h:outputLabel value="#{msg.ordenEntrega}:" />
                                </td>
                                <td align="left">
                                    <h:outputLabel value="#{expedienteManagedBean.expediente.ordenEntrega}"/>
                                </td>
                            </tr>
                            <tr>
                                <td align="right">
                                    <h:outputLabel value="#{msg.expteSuperior}:" />
                                </td>
                                <td align="left">
                                    <h:outputLabel value="#{expedienteManagedBean.expediente.expMadre}"/>
                                </td>
                            </tr>
                        </h:panelGroup>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.observacion}:" />
                            </td>
                            <td align="left">
                                <p:inputTextarea
                                    value="#{expedienteManagedBean.observacion}"
                                    styleClass="muyancho"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.destino}:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu
                                    id="mesa"
                                    value="#{expedienteManagedBean.idMesa}"
                                    required="true" 
                                    style="width: 560px !important;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{expedienteManagedBean.selectItemsDestino}" />
                                    <f:ajax render="@this mesaError" event="valueChange"/>
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="mesaError" for="mesa" initEffect="slide" changeEffect="fade"></p:message>
                            </td>
                        </tr>
                    </table>               
                </div>
                <div align="left">
                    <h:panelGrid columns="2">
                        <p:commandButton value="#{msg.reenviar}" action="#{expedienteManagedBean.reenviarExpediente()}" style="margin-left:5px;" ajax="false"/>
                        <p:commandButton value="#{msg.cancel}" action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" immediate="true" ajax="false"/>
                    </h:panelGrid>                    
                </div>
                <p:ajaxStatus id="submitMonitorPage"/> 
            </h:form>
        </ui:define>
    </ui:composition>
</html>
