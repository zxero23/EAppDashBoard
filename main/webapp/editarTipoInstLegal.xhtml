<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="#{msg.editTipoInstLegal}"/>
        <ui:param name="miBean" value="#{tipoInstrumentoLegalManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="tipoInstrumentoLegalConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.nombre}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombreTipoInstrumentoLegal"
                        value="#{tipoInstrumentoLegalManagedBean.nombre}"
                        label="#{msg.nombre}"
                        required="true" >
                        <f:ajax render="@this nombreTipoInstrumentoLegalError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreTipoInstrumentoLegalError" for="nombreTipoInstrumentoLegal" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.descripcion}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="descripcionTipoInstrumentoLegal"
                        value="#{tipoInstrumentoLegalManagedBean.descripcion}"
                        label="#{msg.descripcion}"
                        required="true" >
                        <f:ajax render="@this descripcionTipoInstrumentoLegalError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="descripcionTipoInstrumentoLegalError" for="descripcionTipoInstrumentoLegal" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>   
            <h:inputHidden value="#{tipoInstrumentoLegalManagedBean.id}"/>
        </ui:define>
    </ui:composition>
</html>
