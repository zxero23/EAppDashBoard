<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html">
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formlistadoExpedienteEnviado" styleClass="form" title=" ">
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{msg.reporteExptesEnviados}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">                                                        
                            <p:commandLink action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>
                <div style="clear: both">
                    <h:panelGrid columns="3">
                        <h:outputLabel value="#{msg.fechaEnvio}:" style="text-align: right"/>
                        <p:inputText id="fecha"
                                       value="#{expedienteManagedBean.fechaCreacion}"
                                       style="width: 350px !important;">
                            <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                            <f:ajax render="@this fechaError" event="valueChange"/>
                        </p:inputText>
                        <p:message id="fechaError" for="fecha" initEffect="slide" changeEffect="fade"></p:message>
                        <h:outputLabel value="#{msg.desdeHorario}:" rendered="#{!expedienteManagedBean.perteneceSaludPublica}" style="text-align: right"/>
                        <p:inputText id="hora"
                                       value="#{expedienteManagedBean.horaEnvio}"
                                       rendered="#{!expedienteManagedBean.perteneceSaludPublica}"
                                       style="width: 350px !important;">
                            <f:convertDateTime pattern="HH:mm" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                            <f:ajax render="@this horaError" event="valueChange"/>
                        </p:inputText>
                        <p:message  id="horaError" for="hora" initEffect="slide" changeEffect="fade" rendered="#{!expedienteManagedBean.perteneceSaludPublica}"></p:message>
                        <h:outputLabel value="#{msg.destino}:" style="text-align: right"/>
                        <p:selectOneMenu
                            id="destino"
                            value="#{expedienteManagedBean.idMesa}"
                            style="width: 360px !important;">
                            <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                            <f:selectItems value="#{expedienteManagedBean.selectItemsDestino}" />
                            <f:ajax render="@this destinoError" event="valueChange"/>
                        </p:selectOneMenu>
                        <p:message id="destinoError" for="destino" initEffect="slide" changeEffect="fade"></p:message>
                        <h:outputLabel value="#{msg.usuario}:" style="text-align: right"/>
                        <p:selectOneMenu
                            id="usuarios"
                            value="#{expedienteManagedBean.idUsuario}"
                            style="width: 360px !important;">
                            <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.todos}"/>
                            <f:selectItems value="#{expedienteManagedBean.selectItemsUsuarios}" />
                            <f:ajax render="@this usuariosError" event="valueChange"/>
                        </p:selectOneMenu>  
                        <p:message id="usuariosError" for="usuarios" initEffect="slide" changeEffect="fade"></p:message>
                    </h:panelGrid>

                </div>
                <div align="left">                    
                    <h:panelGrid columns="2">
                        <p:commandButton value="#{msg.generarReporte}" action="#{expedienteManagedBean.verificarReporte()}" style="margin-right:5px;" ajax="false"/>
                        <p:commandButton value="#{msg.cancel}" action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" immediate="true" ajax="false"/>
                    </h:panelGrid>                    
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>   
        </ui:define>
    </ui:composition>
</html>
