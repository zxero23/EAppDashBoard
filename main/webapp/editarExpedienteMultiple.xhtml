<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">                
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{msg.editarMultiple}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">                                                                          
                            <p:commandLink action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>

                <div style="clear: both">
                    <p:dataTable id="tablita"
                                   value="#{expedienteManagedBean.expedientesAux}"
                                   var="item"                                   >

                        <p:column style="width: 100px;"
                                    headerText="#{msg.num}">
                            <center>
                                <h:outputText value="#{item.nroExp}"/>
                            </center>                            
                        </p:column> 
                        <p:column headerText="#{msg.asunto}">
                            <h:outputText value="#{item.asunto}"/>                                                          
                        </p:column>
                        <p:column style="width: 40px;" headerText="#{msg.fojas}">
                            <center>
                                <h:outputText value="#{item.fojas}"/>
                            </center>                                                                                      
                        </p:column>
                        <p:column headerText="#{msg.ordenPago}" rendered="#{expedienteManagedBean.perteneceContaduria}">
                            <center>
                                <h:outputText value="#{item.ordenPago != null ? item.ordenPago : '-'}"/>
                            </center>
                        </p:column>
                        <p:column headerText="#{msg.pedidoFondo}" rendered="#{expedienteManagedBean.perteneceContaduria}">
                            <center>
                                <h:outputText value="#{item.pedidoFondo!=null ? item.pedidoFondo.toString().concat('/').concat(item.pedidoFondoAnio.toString()) : '-'}" />
                            </center>
                        </p:column>
                        <p:column headerText="#{msg.ordenEntrega}" rendered="#{expedienteManagedBean.perteneceContaduria}">
                            <center>
                                <h:outputText value="#{item.ordenEntrega!=null ? item.ordenEntrega.toString().concat('/').concat(item.ordenEntregaAnio.toString()) : '-'}"/>                                                           
                            </center>
                        </p:column>
                    </p:dataTable>                                                           
                </div>
                <div>
                    <table>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.observacion}:" />
                            </td>
                            <td align="left">
                                <p:inputTextarea value="#{expedienteManagedBean.observacion}"
                                                   style="width: 550px;"/>                                                    
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.destino}:"/>
                            </td>
                            <td align="left">
                                <p:selectOneMenu
                                    id="mesaDestino"
                                    value="#{expedienteManagedBean.idMesa}"
                                    label="#{msg.destino}"
                                    required="true" 
                                    style="width: 560px;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{expedienteManagedBean.selectItemsDestino}" />
                                    <f:ajax render="@this mesaDestinoError" event="valueChange"/>
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="mesaDestinoError" for="mesaDestino" initEffect="slide" changeEffect="fade"></p:message>
                            </td>
                        </tr>
                    </table>
                </div>
                <div align="left">
                    <h:panelGrid columns="2">
                        <p:commandButton value="#{msg.enviar}" action="#{expedienteManagedBean.guardarEdicionMultiple()}" style="margin-left:5px;"/>
                        <p:commandButton value="#{msg.cancel}" action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" immediate="true"/>
                    </h:panelGrid>                     
                </div>
                <p:ajaxStatus id="submitMonitorPage"/> 
            </h:form>
        </ui:define>
    </ui:composition>
</html>
