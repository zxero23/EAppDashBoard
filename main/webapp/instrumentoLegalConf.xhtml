<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="jakarta.faces.passthrough">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">
                <div>
                    <div id="titulo" class="principal">
                        <h1>
                            <i class="pi pi-paperclip" style="margin-right: 8px; vertical-align: middle; color: #08446c;" aria-hidden="true"/>
                            <h:outputLabel value="#{msg.confInstLegal} del Expediente #{expedienteManagedBean.expediente.nroExp}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">
                            <p:commandLink action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>
                <div id="accionesGen">
                    <h:panelGrid columns="6" class="panel-buttons">
                        <span class="pi pi-refresh" aria-hidden="true"/>
                        <p:commandLink  action="instrumentoLegalConf" actionListener="#{expedienteManagedBean.actualizarInstrumentoLegal()}" value="#{msg.confInstLegal}"/>
                        |
                        <h:panelGroup rendered="#{expedienteManagedBean.altaInstrumentoLegal}">
                            <span class="pi pi-plus" aria-hidden="true"/>
                            <p:commandLink action="nuevoInstrumentoLegal" value="#{msg.newInstLegal}" />
                        </h:panelGroup>
                    </h:panelGrid>               
                </div>

                <h:panelGroup id="panelbusqueda" layout="block" styleClass="panelbusqueda">
                    <p:panel id="expPanelBusqueda" toggleable="true" toggleSpeed="500" collapsed="true" styleClass="panel-buttons">
                        <f:facet name="header">
                            <h:outputText value="#{msg.busqueda}"/>
                        </f:facet>
                        <h:panelGrid columns="2" cellspacing="4">
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.descripcion}:"/>
                                <p:inputText id="descripcionInstrumentoBuscar" value="#{expedienteManagedBean.descripcionInstrumentoBuscar}"/>
                            </h:panelGroup>
                        </h:panelGrid>
                        <div class="panel-busqueda-botones">
                            <p:commandButton id="btnBuscar" value="#{msg.find}" actionListener="#{expedienteManagedBean.aplicarFiltroInstrumentoLegal()}" update="@form" process="@form"/>
                            <p:defaultCommand target="btnBuscar"/>
                            <p:commandButton value="#{msg.actualizar}" actionListener="#{expedienteManagedBean.actualizarInstrumentoLegal()}" update="@form" process="@form"/>
                        </div>
                    </p:panel>
                </h:panelGroup>
                <div id="laTabla">
                    <p:dataTable id="list"
                                   value="#{expedienteManagedBean.listInstrumentoLegal}"
                                   var="item"
                                   rows="10"
                                   style="margin-top: 10px;"
                                   paginator="true"
                                   paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
                                   rowsPerPageTemplate="10,20,30,50,100"
                                   paginatorPosition="bottom">
                        <p:column headerText="#{msg.id}">                    
                            <center>
                                <h:outputText value="#{item.id}"/> 
                            </center>                                                     
                        </p:column> 
                        <p:column headerText="#{msg.num}">                    
                            <center>
                                <h:outputText value="#{item.numero}"/> 
                            </center>                                                     
                        </p:column> 
                        <p:column headerText="#{msg.descripcion}">                                          
                            <h:outputText value="#{item.descripcion}"/>                                                   
                        </p:column>

                        <p:column headerText="#{msg.tipo}">                                            
                            <h:outputText value="#{item.tipoInstrumentoLegal.nombre}"/>                                                 
                        </p:column>

                        <p:column headerText="#{msg.agregadoPor}">
                            <h:outputText value="#{item.usuarioCreacion.mesa.nombre}"/>
                        </p:column>

                        <p:column headerText="#{msg.fojas}">
                            <center>
                                <h:outputText value="#{item.fojas}"/>
                            </center>                            
                        </p:column>
                        <p:column headerText="#{msg.archivoAdjunto}">                        
                            <center>
                                <h:panelGroup rendered="#{item.archivo!=null}">
                                    <p:graphicImage resource="#{expedienteManagedBean.prepararAdjunto(item.archivo)}" 
                                                         type="button"
                                                         rendered="#{item.archivo!=null}"
                                                         label="#{msg.descargar}"
                                                         attachment="true"
                                                         fileName="#{expedienteManagedBean.renombrar(item.archivo)}"/>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{item.archivo==null || item.archivo==''}">
                                    <h:outputText value="NO"/>
                                </h:panelGroup>

                            </center>                            
                        </p:column>
                        <p:column id="acciones" headerText="#{msg.action}" style="width: 15%">
                            <h:panelGroup layout="block" styleClass="acciones-tabla">
                                    <p:commandButton id="btnDetalle" action="detalleInstrumentoLegal" actionListener="#{expedienteManagedBean.verDetalleInstrumentoLegal()}" rendered="#{expedienteManagedBean.detalleInstrumentoLegal}" ajax="false"
                                        icon="pi pi-search" value="" title="#{msg.detalle}">
                                        <f:param name="id" value="#{item.id}" />
                                    </p:commandButton>
                                    <p:commandButton action="editarInstrumentoLegal" actionListener="#{expedienteManagedBean.prepararParaEditarInstrumentoLegal()}" rendered="#{expedienteManagedBean.editarInstrumentoLegal}" ajax="false"
                                        icon="pi pi-pencil" value="" title="#{msg.editar}">
                                        <f:param name="id" value="#{item.id}" />
                                    </p:commandButton>
                                    <p:commandButton id="borrarDialogbtn"
                                                    p:onclick="PF('borrarDialog').show();return false;"
                                                    rendered="#{expedienteManagedBean.bajaInstrumentoLegal}"
                                                    icon="pi pi-trash" value="" title="#{msg.eliminar}">
                                        <f:param name="id" value="#{item.id}" />
                                    </p:commandButton>
                                    <p:dialog id="borrarDialog"
                                                            widgetVar="borrarDialog"
                                                            binding="#{borrarDialog}"
                                                            headerText="#{msg.confirm}"
                                                            draggable="false">
                                        <p:outputLabel value="#{msg.msgDelete}"/>
                                        <h:panelGrid columns="2" styleClass="panel-confirm-buttons">
                                            <p:commandButton value="#{msg.acep}"
                                                            p:onclick="PF('borrarDialog').hide();"
                                                            actionListener="#{expedienteManagedBean.guardarBorradoInstrumentoLegal()}">
                                                <f:param name="id" value="#{item.id}" />
                                                <f:ajax execute="@this" render="@all"/>
                                            </p:commandButton>
                                            <p:commandButton value="#{msg.cancel}"
                                                            p:onclick="PF('borrarDialog').hide();">
                                                <f:ajax execute="@this" render="@all"/>
                                            </p:commandButton>
                                        </h:panelGrid>
                                    </p:dialog>
                            </h:panelGroup>
                        </p:column>
                    </p:dataTable>
                </div>
                <div align="center">
                    <p:commandLink action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>            
        </ui:define>
    </ui:composition>
</html>
