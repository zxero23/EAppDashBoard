<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>.: SISTEMA DE GESTION DE EXPEDIENTES :.</title>
        <link rel="shortcut icon" href="images/favicon.png" />
        <link rel="stylesheet" href="css/cssCCPM.css" type="text/css"/>

    </h:head>
    <h:body styleClass="login-body">
        <div id="top" class="banner-top-login" title=" " />
        <div id="content" class="content jumbotron bg-img" title=" " style="flex:1;">
            <div class="login-wrapper">
                <div class="login-card">
                    <h:form id="formConfiguracion" styleClass="form" title=" ">
                        <div id="titulo" class="principal">
                            <h3>Error de Inicio de Sesión</h3>
                        </div>
                        <p style="color:#666; font-size: 13px; text-align: center; margin-bottom: 20px;">
                            Ha ingresado incorrectamente los datos. Si no recuerda su usuario o contraseña contacte a la persona administradora del sistema.
                        </p>
                        
                        <div class="login-fields">
                            <div class="field">
                                <p:inputText id="actual"
                                           value="#{webManagedBean.nombreUsuario}"
                                           placeholder="#{msg.usuario}"
                                           required="true">
                                    <f:ajax render="@this actualError" event="valueChange"/>
                                </p:inputText>
                                <p:message id="actualError" for="actual" />
                            </div>
                            
                            <div class="field">
                                <p:password id="nueva"
                                           value="#{webManagedBean.claveAcceso}"
                                           placeholder="#{msg.contrasenia}"
                                           required="true"
                                           toggleMask="true">
                                    <f:ajax render="nuevaError" event="valueChange"/>
                                </p:password>
                                <p:message id="nuevaError" for="nueva" />
                            </div>

                            <p:commandButton value="Iniciar Sesión" action="#{webManagedBean.login}" ajax="false" styleClass="btn-login-full"/>
                        </div>
                        <p:ajaxStatus id="submitMonitorPage"/> 
                    </h:form>
                </div>
            </div>
        </div>

        <div id="footer" class="footer-top" title=" ">
            <ui:include src="footer.xhtml"/>
        </div>

    </h:body>
</html>
