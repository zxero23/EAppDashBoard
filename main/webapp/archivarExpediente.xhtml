<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html">
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formArchivarExpediente" styleClass="form" title=" ">                              
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{msg.archivarExpte} #{expedienteManagedBean.expediente.nroExp}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">                                                        
                            <p:commandLink action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>
                <div style="clear: both"/>


                <h:inputHidden value="#{expedienteManagedBean.codOrganismo}"/>
                <h:inputHidden value="#{expedienteManagedBean.nroCorrel}"/>
                <h:inputHidden value="#{expedienteManagedBean.annio}"/>
                <table border="0" cellspacing="5" class="panel-buttons">
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.num}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel 
                                value="#{expedienteManagedBean.expediente.nroExp}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.fechaCreacion}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel 
                                value="#{expedienteManagedBean.fechaCreacion}">
                                <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                            </h:outputLabel>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.cuerpo}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel 
                                value="#{expedienteManagedBean.expediente.cuerpo}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.fojas}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel
                                value="#{expedienteManagedBean.expediente.fojas}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.iniciador}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel
                                value="#{expedienteManagedBean.expediente.iniciador.nombre}"/>

                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.origen}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel 
                                value="#{expedienteManagedBean.expediente.mesaOrigen.nombre}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.tipoAsunto}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel 
                                value="#{expedienteManagedBean.expediente.tipoAsunto.nombre}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.asunto}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel
                                value="#{expedienteManagedBean.expediente.asunto}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.ordenPago}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{expedienteManagedBean.expediente.ordenPago}"/>
                        </td>
                    </tr>
                    <h:panelGroup rendered="#{expedienteManagedBean.perteneceContaduria}">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.pedidoFondo}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.pedidoFondo}"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.ordenEntrega}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.ordenEntrega}"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.expteSuperior}:" />
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{expedienteManagedBean.expediente.expMadre}"/>
                            </td>
                        </tr>
                    </h:panelGroup>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.observacion}:" />
                        </td>
                        <td align="left">
                            <p:inputTextarea id="olblObs" 
                                               value="#{expedienteManagedBean.observacion}"
                                               styleClass="muyancho"
                                               style="height:50px;"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.motivo}:" />
                        </td>
                        <td align="left">
                            <p:selectOneMenu id="sloMotivoArchivo"
                                                     value="#{expedienteManagedBean.motivoArchivo}"
                                                     style="width:560px !important;">
                                <f:selectItem  itemValue="#{msg.archivo}"  itemLabel="#{msg.archivo}"/>
                                <f:selectItem  itemValue="#{msg.espera}"  itemLabel="#{msg.espera}"/>                
                            </p:selectOneMenu>
                        </td>
                    </tr>
                </table>
                <h:panelGrid columns="2">
                    <p:commandButton value="#{msg.archivar}" action="#{expedienteManagedBean.archivarExpediente()}"  style="margin-right:0.5%;"/>
                    <p:commandButton value="#{msg.cancel}" action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" immediate="true"  style="margin-left:5px;"/>
                </h:panelGrid>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>   
        </ui:define>
    </ui:composition>
</html>
