<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="Editar Persona Jur�dica"/>
        <ui:param name="miBean" value="#{usuarioExternoManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="usuarioExternoConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.tipo}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="tipoIniciador"
                        value="#{usuarioExternoManagedBean.idTipoIniciador}"
                        label="#{msg.tipo}"
                        required="true" 
                        style="width: 560px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{usuarioExternoManagedBean.selectTipoIniciador}" />
                        <f:ajax render="@form" />
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="tipoIniciadorError" for="tipoIniciador" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.empresaOrganismo}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombreUsuario"
                        value="#{usuarioExternoManagedBean.nombre}"
                        label="#{msg.nombre}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this nombreUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreUsuarioError" for="nombreUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.cuitCuil}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="documentoUsuario"
                        value="#{usuarioExternoManagedBean.documento}"
                        label="#{msg.cuitCuil}"
                        required="true" 
                        type="number"
                        styleClass="muyancho"
                        validator="#{usuarioExternoManagedBean.validarDocumento}">
                        <f:ajax render="@this documentoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="documentoUsuarioError" for="documentoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <h:panelGroup id="matriculaFragment" rendered="#{usuarioExternoManagedBean.idTipoIniciador==3 or usuarioExternoManagedBean.idTipoIniciador==9}" >
                <tr>
                    <td align="right">
                        <h:outputLabel value="(*) #{msg.matriculaProvincial}:" />
                    </td>
                    <td align="left">
                        <p:inputText
                            id="matriculaProvincial"
                            value="#{usuarioExternoManagedBean.matriculaProvincial}"
                            label="#{msg.matriculaProvincial}"
                            required="true" 
                            validator="#{usuarioExternoManagedBean.validarMatriculaProvincial}"
                            type="number"
                            styleClass="muyancho" >
                            <f:ajax render="@this matriculaProvincialError" event="valueChange"/>
                        </p:inputText>
                    </td>
                    <td align="left">
                        <p:message id="matriculaProvincialError" for="matriculaProvincial" initEffect="slide" changeEffect="fade"></p:message>
                    </td>
                </tr>
                 <tr>
                    <td align="right">
                        <h:outputLabel value="(*) #{msg.matriculaNacional}:" />
                    </td>
                    <td align="left">
                        <p:inputText
                            id="matriculaNacional"
                            value="#{usuarioExternoManagedBean.matriculaNacional}"
                            label="#{msg.matriculaNacional}"
                            validator="#{usuarioExternoManagedBean.validarMatriculaNacional}"
                            required="true" 
                            type="number"
                            styleClass="muyancho" >
                            <f:ajax render="@this matriculaNacionalError" event="valueChange"/>
                        </p:inputText>
                    </td>
                    <td align="left">
                        <p:message id="matriculaNacionalError" for="matriculaNacional" initEffect="slide" changeEffect="fade"></p:message>
                    </td>
                </tr>
            </h:panelGroup>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.correo}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="correoUsuario"
                        value="#{usuarioExternoManagedBean.email}"
                        label="#{msg.correo}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this correoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="correoUsuarioError" for="correoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.usuario}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="usuarioUsuario"
                        value="#{usuarioExternoManagedBean.uss}"
                        label="#{msg.usuario}"
                        required="true"
                        validator="#{usuarioExternoManagedBean.coincidenciaNombre}"
                        styleClass="muyancho">
                        <f:ajax render="@this usuarioUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="usuarioUsuarioError" for="usuarioUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.contrasenia}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="passUsuario"
                        value="#{usuarioExternoManagedBean.pass}"
                        label="#{msg.contrasenia}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this passUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="passUsuarioError" for="passUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <h:inputHidden value="#{usuarioExternoManagedBean.id}"/>
        </ui:define>
        <ui:define name="masInfo">
            <h:outputLabel value="Recuerde que puede ingresar el CUIT/CUIL y o la matr�cula provincial o nacional (para cooperativas)." style="background: #FFEBE8; color: #DD3C10; border: 1px solid #DD3C10; font-size: 0.9em; margin-bottom: 15px; margin-top: 15px;"/>  <br/>           
            <h:outputLabel value="No crear organismos de la administraci�n p�blica, consultar con la persona encargada del sistema." style="background: #FFEBE8; color: #DD3C10; border: 1px solid #DD3C10; font-size: 0.9em"/><br/>            
            <h:outputLabel value="No crear juzgados provinciales, consultar con la persona encargada del sistema." style="background: #FFEBE8; color: #DD3C10; border: 1px solid #DD3C10; font-size: 0.9em"/><br/>     
            <h:outputLabel value="No crear municipalidades, consultar con la persona encargada del sistema." style="background: #FFEBE8; color: #DD3C10; border: 1px solid #DD3C10; font-size: 0.9em; margin-bottom: 15px;"/><br/>                   
        </ui:define>
    </ui:composition>
</html>
