<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">                
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{msg.ingresarExpte}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">                                                                          
                            <p:commandLink action="#{expedienteManagedBean.ingresarExt(1)}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>

                <div style="clear: both">
                    <h:panelGrid columns="4" cellpadding="2">
                        <h:panelGroup>
                            <h:outputLabel value="#{msg.codOrganismo}:"/>
                            <p:inputText id="cod" 
                                       value="#{expedienteManagedBean.codOrganismoIng}"
                                       type="number"
                                       required="true" >
                                <f:ajax render="@this codError" event="valueChange"/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:outputLabel value="#{msg.correlativo}:"/>
                            <p:inputText id="correl" 
                                       value="#{expedienteManagedBean.nroCorrelIng}"
                                       type="number"
                                       validator="#{expedienteManagedBean.validadorCorrelativo}"
                                       required="true" >
                                <f:ajax render="@this correlError" event="valueChange"/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:outputLabel value="#{msg.anio}:"/>
                            <p:inputText id="anio" 
                                       value="#{expedienteManagedBean.annioIng}"
                                       required="true"
                                       type="number"
                                       valueChangeListener="#{expedienteManagedBean.cargarFojas}"
                                       validator="#{expedienteManagedBean.validadorAnio}">                                       
                                <f:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:outputLabel value="#{msg.fojas}:"/>
                            <p:inputText id="fojas" 
                                       value="#{expedienteManagedBean.fojasIng}"
                                       type="number"
                                       required="true" >
                                <f:ajax/>
                            </p:inputText>
                        </h:panelGroup>
                    </h:panelGrid>               
                </div>
                <div>
                    <h:panelGrid columns="1" cellspacing="8">
                        <p:message id="codError" for="cod" initEffect="slide" changeEffect="fade"></p:message>
                        <p:message id="correlError" for="correl" initEffect="slide" changeEffect="fade"></p:message>
                        <p:message id="anioError" for="anio" initEffect="slide" changeEffect="fade"></p:message>
                        <p:message id="fojasError" for="fojas" initEffect="slide" changeEffect="fade"></p:message>
                    </h:panelGrid>            
                </div>
                <div align="left">
                    <h:panelGrid columns="2" cellpadding="2">
                        <p:commandButton value="#{msg.ingresar}" action="#{expedienteManagedBean.ingresarExpediente}" ajax="false"/>
                        <p:commandButton value="#{msg.cancel}" action="#{expedienteManagedBean.ingresarExt(1)}" immediate="true" ajax="false"/>
                    </h:panelGrid>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
