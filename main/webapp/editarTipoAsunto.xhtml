<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="#{msg.editTipoAsunto}"/>
        <ui:param name="miBean" value="#{tipoAsuntoManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="tipoAsuntoConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.nombre}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombreTipoAsunto"
                        value="#{tipoAsuntoManagedBean.nombre}"
                        label="#{msg.nombre}"
                        required="true" >
                        <f:ajax render="@this nombreTipoAsuntoError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreTipoAsuntoError" for="nombreTipoAsunto" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.descripcion}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="descripcionTipoAsunto"
                        value="#{tipoAsuntoManagedBean.descripcion}"
                        label="#{msg.descripcion}"
                        required="true" >
                        <f:ajax render="@this descripcionTipoAsuntoError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="descripcionTipoAsuntoError" for="descripcionTipoAsunto" initEffect="slide" changeEffect="fade"></p:message>
                    <h:inputHidden value="#{tipoAsuntoManagedBean.id}"/>
                </td>
            </tr>
        </ui:define>
    </ui:composition>
</html>
