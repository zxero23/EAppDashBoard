<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="jakarta.faces.passthrough">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">
                <div id="titulo" class="principal">
                    <h1>
                        <i class="pi pi-search" style="margin-right: 8px; vertical-align: middle; color: #08446c;" aria-hidden="true"/>
                        <h:outputLabel value="#{msg.confBusquedaExpte}"/>
                    </h1>
                </div>
                <h:panelGroup id="panelbusqueda" layout="block" styleClass="panelbusqueda">
                <p:panel id="expPanelBusqueda" toggleable="true" toggleSpeed="500" collapsed="true" styleClass="panel-busqueda">
                    <f:facet name="header">
                        <h:outputText value="#{msg.busqueda}"/>
                    </f:facet>

                    <h:panelGrid columns="1" styleClass="busq-grid">
                        <!-- Fila 1: Datos del Expediente (3 columnas) -->
                        <h:panelGrid columns="3" styleClass="busq-row busq-row-3">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="codOrganismo" value="#{msg.codOrganismo}:" styleClass="busq-label"/>
                                <p:inputText id="codOrganismo" value="#{busquedaManagedBean.codOrganismo}" styleClass="busq-control"/>
                            </h:panelGroup>

                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="nroCorrel" value="#{msg.correlativo}:" styleClass="busq-label"/>
                                <p:inputText id="nroCorrel" value="#{busquedaManagedBean.nroCorrel}" styleClass="busq-control"/>
                            </h:panelGroup>

                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="anio" value="#{msg.anio}:" styleClass="busq-label"/>
                                <p:inputText id="anio" value="#{busquedaManagedBean.anio}" styleClass="busq-control"/>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 2: Fechas (2 columnas) -->
                        <h:panelGrid columns="2" styleClass="busq-row busq-row-2">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="fechaDesde" value="#{msg.fechaDesde}:" styleClass="busq-label"/>
                                <p:datePicker id="fechaDesde"
                                               value="#{busquedaManagedBean.fechaDesde}"
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false" renderAsPopup="true"
                                               showButtonPanel="false"
                                               styleClass="busq-control">
                                    <f:ajax />
                                </p:datePicker>
                            </h:panelGroup>

                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="fechaHasta" value="#{msg.fechaHasta}:" styleClass="busq-label"/>
                                <p:datePicker id="fechaHasta"
                                               value="#{busquedaManagedBean.fechaHasta}"
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false"
                                               renderAsPopup="true"
                                               showButtonPanel="false"
                                               styleClass="busq-control">
                                    <f:ajax />
                                </p:datePicker>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 3: Tipo Iniciador -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="tipoIniciador" value="#{msg.tipoIniciador}:" styleClass="busq-label"/>
                                <p:selectOneMenu id="tipoIniciador"
                                    value="#{busquedaManagedBean.idTipoIniciador}"
                                    styleClass="busq-control busq-select"
                                    style="width: 200px;">
                                    <f:selectItem itemLabel="#{msg.elegir}" noSelectionOption="true" itemValue="#{null}"/>
                                    <f:selectItems value="#{busquedaManagedBean.selectItemsTipoIniciador}" />
                                    <p:ajax process="@this"
                                            listener="#{busquedaManagedBean.cargarIniciadoresSeleccionados}"
                                            update="iniciadorContainer" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 4: Iniciador -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="iniciador" value="#{msg.iniciador}:" styleClass="busq-label"/>
                                <h:panelGroup id="iniciadorContainer">
                                    <p:selectOneMenu id="iniciador"
                                        value="#{busquedaManagedBean.idIniciador}"
                                        disabled="#{busquedaManagedBean.deshabilitarIniciador}"
                                        filter="true" filterMatchMode="contains"
                                        styleClass="busq-control busq-select"
                                        style="width: 200px;"
                                        placeholder="Nombre o código del iniciador">
                                        <f:selectItem itemLabel="#{msg.elegir}" noSelectionOption="true" itemValue="#{null}"/>
                                        <f:selectItems value="#{busquedaManagedBean.selectItemsIniciador}" />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 5: Mesa Origen -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="mesaOrigen" value="#{msg.origen}:" styleClass="busq-label"/>
                                <p:selectOneMenu id="mesaOrigen"
                                    value="#{busquedaManagedBean.idMesaOrigen}"
                                    styleClass="busq-control busq-select"
                                    style="width: 200px;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{busquedaManagedBean.selectItemsMesa}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 6: Mesa Destino -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="mesaDestino" value="#{msg.destino}:" styleClass="busq-label"/>
                                <p:selectOneMenu id="mesaDestino"
                                    value="#{busquedaManagedBean.idMesaDestino}"
                                    styleClass="busq-control busq-select"
                                    style="width: 200px;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{busquedaManagedBean.selectItemsMesa}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 7: Check Historial -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:panelGrid columns="2" styleClass="busq-slash">
                                    <h:outputText value="Consultar mesa origen/destino en historiales:" styleClass="busq-label"/>
                                    <p:selectBooleanCheckbox id="checkBox" value="#{busquedaManagedBean.consultarHistorial}">
                                        <f:ajax execute="@this" render="@this" />
                                    </p:selectBooleanCheckbox>
                                </h:panelGrid>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 8: Tipo Asunto -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="tipoAsunto" value="#{msg.tipoAsunto}:" styleClass="busq-label"/>
                                <p:selectOneMenu id="tipoAsunto"
                                    value="#{busquedaManagedBean.idTipoAsunto}"
                                    styleClass="busq-control busq-select"
                                    style="width: 200px;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{busquedaManagedBean.selectItemsTipoAsunto}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 9: Asunto -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="asunto" value="#{msg.asunto}:" styleClass="busq-label"/>
                                <p:inputText id="asunto" value="#{busquedaManagedBean.asunto}" styleClass="busq-control" style="width: 200px;"/>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 10: Orden Pago -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="ordenPagoBsq" value="#{msg.ordenPago}:" styleClass="busq-label"/>
                                <p:inputText id="ordenPagoBsq" value="#{busquedaManagedBean.ordenPagoBsq}" styleClass="busq-control" style="width: 200px;"/>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 11: Campos Contaduría -->
                        <h:panelGrid columns="1" styleClass="busq-row" rendered="#{busquedaManagedBean.perteneceContaduria}">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="pedidoFondoBsq" value="#{msg.pedidoFondo}:" styleClass="busq-label"/>
                                <h:panelGrid columns="3" styleClass="busq-slash">
                                    <p:inputText id="pedidoFondoBsq" value="#{busquedaManagedBean.pedidoFondoBsq}" styleClass="busq-control"/>
                                    <h:outputText value="/" styleClass="busq-slash-sep"/>
                                    <p:inputText id="pedidoFondoAnioBsq" value="#{busquedaManagedBean.pedidoFondoAnioBsq}" styleClass="busq-control"/>
                                </h:panelGrid>
                            </h:panelGroup>

                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="ordenEntregaBsq" value="#{msg.ordenEntrega}:" styleClass="busq-label"/>
                                <h:panelGrid columns="3" styleClass="busq-slash">
                                    <p:inputText id="ordenEntregaBsq" value="#{busquedaManagedBean.ordenEntregaBsq}" styleClass="busq-control"/>
                                    <h:outputText value="/" styleClass="busq-slash-sep"/>
                                    <p:inputText id="ordenEntregaAnioBsq" value="#{busquedaManagedBean.ordenEntregaAnioBsq}" styleClass="busq-control"/>
                                </h:panelGrid>
                            </h:panelGroup>

                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="expMadreBsq" value="#{msg.expteSuperior}:" styleClass="busq-label"/>
                                <p:inputText id="expMadreBsq" value="#{busquedaManagedBean.expMadreBsq}" styleClass="busq-control" style="width: 200px;"/>
                            </h:panelGroup>
                        </h:panelGrid>

                        <!-- Fila 12: Observación -->
                        <h:panelGrid columns="1" styleClass="busq-row">
                            <h:panelGroup styleClass="busq-item">
                                <h:outputLabel for="observacionBsq" value="#{msg.observacion}:" styleClass="busq-label"/>
                                <p:inputTextarea id="observacionBsq" value="#{busquedaManagedBean.observacionBsq}" styleClass="busq-control" style="width: 200px;"/>
                            </h:panelGroup>
                        </h:panelGrid>
                    </h:panelGrid>

                    <div class="panel-busqueda-botones">
                        <p:commandButton id="btnBuscar" value="#{msg.find}" actionListener="#{busquedaManagedBean.aplicarFiltro}" update="tablita panelbusqueda" process="@form"/>
                        <p:defaultCommand target="btnBuscar"/>
                        <p:commandButton value="#{msg.actualizar}" actionListener="#{busquedaManagedBean.actualizar}" update="tablita panelbusqueda" process="@form"/>
                    </div>
                </p:panel>
                </h:panelGroup>
                <div style="display:inline-block;width:100%;"> 
                    <div style="float:right; width:50%; text-align:right">
                        <p:commandButton value="Imprimir Tabla" style="margin-right: 10px">
                            <p:dataExporter target="tablita" type="pdf" fileName="resultados"/>
                        </p:commandButton>
                    </div>                        
                </div>                
                <div>
                    <p:dataTable
                        id="tablita" value="#{busquedaManagedBean.expedientes}" var="item" page="#{busquedaManagedBean.page}" 
                        lazy="true"
                        rows="10"
                        paginator="true"
                        paginatorAlwaysVisible="true"
                        paginatorPosition="bottom"
                        paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
                        rowsPerPageTemplate="10,20,30,50,100"
                        emptyMessage="#{msg.emptyMessage}"
                        currentPageReportTemplate="#{msg.pageReportTemplate}"
                        rowIndexVar="row" >
                        <p:column style="width: 90px;"
                                    headerText="#{msg.fechaCreacion}">
                            <center>
                                <h:outputText value="#{item.fechaCreacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputText>    
                            </center>                            
                        </p:column> 
                        <p:column style="width: 81px;"
                                    headerText="#{msg.num}">
                            <center>
                                <h:outputText value="#{item.nroExp}"/>
                            </center>                            
                        </p:column> 
                        <p:column style="width: 180px;"
                                    headerText="#{msg.iniciador}">                    
                            <h:outputText value="#{busquedaManagedBean.arreglarIniciador(item.iniciador)}"/>                                                          
                        </p:column>
                        <p:column headerText="#{msg.asunto}">
                            <h:outputText value="#{item.asunto}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.origen}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaOrigen)}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.destino}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaDestino)}"/>                                                          
                        </p:column> 
                        <p:column style="width: 32px;" headerText="#{msg.fojas}">
                            <center>
                                <h:outputText value="#{item.fojas}"/>
                            </center>                                                                                      
                        </p:column> 
                        <p:column id="acciones" headerText="#{msg.action}" style="width: 10%">
                            <!-- p:column exportable="false" -->
                            <h:panelGroup layout="block" styleClass="acciones-tabla">
                                <p:commandButton id="detalle"
                                                action="detalleExpedienteAvanzada"
                                                rendered="true"
                                                immediate="true"
                                                ajax="false"
                                                icon="pi pi-eye"
                                                value=""
                                                title="#{msg.detalle}"
                                                ariaLabel="#{msg.detalle}"
                                                styleClass="ui-button-flat ui-button-info ui-button-sm">
                                    <f:setPropertyActionListener target="#{busquedaManagedBean.expediente}" value="#{item}" />
                                </p:commandButton>
                                <p:commandButton id="borrarDialogbtn" rendered="#{busquedaManagedBean.baja}"
                                                p:onclick="PF('borrarDialog').show();return false;"
                                                icon="pi pi-trash"
                                                value=""
                                                title="#{msg.eliminar}">
                                </p:commandButton>
                                <p:dialog id="borrarDialog"
                                                        widgetVar="borrarDialog"
                                                        binding="#{borrarDialog}"
                                                        headerText="#{msg.confirm}"
                                                        draggable="false">
                                    <p:outputLabel value="#{msg.msgDelete}"/>
                                    <h:panelGrid id="panelGridBusquedaAvanzada" columns="2" styleClass="panel-confirm-buttons">
                                        <p:commandButton id="yes"
                                                        value="#{msg.acep}"
                                                        p:onclick="PF('borrarDialog').hide();"
                                                        action="#{busquedaManagedBean.borrarExpediente()}">
                                            <f:setPropertyActionListener target="#{busquedaManagedBean.expediente}" value="#{item}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no"
                                                        value="#{msg.cancel}"
                                                        p:onclick="PF('borrarDialog').hide();">
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </p:dialog>
                            </h:panelGroup>

                        </p:column>
                    </p:dataTable>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/> 
            </h:form>
        </ui:define>
    </ui:composition>
</html>
