<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html">
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formArchivarExpediente" styleClass="form" title=" ">
                <table border="0" cellspacing="5" style="width:100%;">
                    <tr>
                        <td align="left">
                            <div id="titulo" class="principal">
                                <h1>
                                    <h:outputLabel value="#{msg.archivarNota}"/>
                                </h1>
                            </div>
                        </td>

                        <td align="right">
                            <div align="right">
                                <p:commandLink action="notaConf" actionListener="#{notaManagedBean.limpiar()}" value="#{msg.volver}"/>
                            </div>
                        </td>
                    </tr>
                </table>

                <table border="0" cellspacing="5" class="panel-buttons">
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.id}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{notaManagedBean.id}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.num}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{notaManagedBean.nroNota}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.fechaCreacion}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{notaManagedBean.fechaCreacion}">
                                <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                            </h:outputLabel>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.referencia}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{notaManagedBean.referencia}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.fojas}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{notaManagedBean.fojas}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.iniciador}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{expedienteManagedBean.arreglarIniciador(notaManagedBean.nota.iniciador.nombre)}"/>
                        </td>
                    </tr>                    
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.tipoAsunto}:" />
                        </td>
                        <td align="left">
                            <h:outputLabel value="#{notaManagedBean.nota.tipoAsunto.nombre}"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.observacion}:" />
                        </td>
                        <td align="left">
                            <p:inputTextarea id="olblObs" 
                                               value="#{notaManagedBean.observacion}"
                                               styleClass="muyancho"
                                               style="height:50px;"/>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <h:outputLabel value="#{msg.motivo}:" />
                        </td>
                        <td align="left">
                            <p:selectOneMenu id="sloMotivoArchivo"
                                                     value="#{notaManagedBean.motivoArchivo}"
                                                     style="width:560px !important;">
                                <f:selectItem  itemValue="#{msg.archivo}"  itemLabel="#{msg.archivo}"/>
                                <f:selectItem  itemValue="#{msg.espera}"  itemLabel="#{msg.espera}"/>                
                            </p:selectOneMenu>
                        </td>
                    </tr>
                </table>
                <h:panelGrid columns="2">
                    <p:commandButton value="#{msg.archivar}" action="#{notaManagedBean.archivarNota()}"  style="margin-right:0.5%;"/>
                    <p:commandButton value="#{msg.cancel}" action="notaConf" actionListener="#{expedienteManagedBean.limpiar()}" immediate="true"  style="margin-left:5px;"/>
                </h:panelGrid>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>   
        </ui:define>
    </ui:composition>
</html>
