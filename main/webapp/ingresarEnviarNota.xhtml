<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{msg.ingresarEnviarNota}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">                                                                          
                            <p:commandLink action="notaConf" actionListener="#{notaManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>

                <div style="clear: both">
                    <table border="0" cellspacing="5" cellpadding="5" >
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.destino}:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu
                                    id="mesaDestino"
                                    value="#{notaManagedBean.idMesa}"
                                    label="#{msg.destino}"
                                    required="true" 
                                    style="width: 560px !important;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{notaManagedBean.selectItemsDestino}" />
                                    <f:ajax render="@this mesaDestinoError" event="valueChange"/>
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="mesaDestinoError" for="mesaDestino" initEffect="slide" changeEffect="fade"/>
                            </td>
                        </tr>
                    </table>
                    <table border="0" cellspacing="5" cellpadding="5" >
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.id}:" />
                            </td>
                            <td align="left">
                                <p:inputText id="cod" 
                                               value="#{notaManagedBean.id}"
                                               validator="#{notaManagedBean.validarId}"
                                               label="#{msg.id}"
                                                >
                                    <f:ajax render="@this codError" event="valueChange" />
                                    <f:ajax render="@this codError" />
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:commandButton id="btnAgregarNota" actionListener="#{notaManagedBean.agregarNotas()}" label="Agregar Nota"  >
                                    <f:ajax execute="@this" render="@this tableNotas cod"/>
                                    <i class="pi pi-plus" aria-hidden="true"></i>
                                </p:commandButton>
                                <p:defaultCommand target="btnAgregarNota"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">

                            </td>
                            <td align="left" rowspan="2">
                                <p:message id="codError" initEffect="highlight"
                                             for="cod"
                                             changeEffect="puff" />
                            </td>
                            <td align="left">

                            </td>
                        </tr>
                    </table>

                    <p:dataTable id="tableNotas" value="#{notaManagedBean.notasSeleccionadas}"
                                   var="item"
                                   rows="10"
                                   style="width:100%; margin-top: 10px;"
                                   paginator="true"
                                   paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
                                   rowsPerPageTemplate="10,20,30,50,100"
                                   paginatorPosition="bottom">
                        <p:column style="width: 50px;"
                                    headerText="#{msg.id}">
                            <center>
                                <h:outputText value="#{item.id}"/>                                        
                            </center>                            
                        </p:column>
                        <p:column headerText="#{msg.num}">
                            <center>
                                <h:outputText value="#{item.nroNota}"/>
                            </center>                            
                        </p:column>
                        <p:column style="width: 90px;"
                                    headerText="#{msg.fechaCreacion}">
                            <center>
                                <h:outputText value="#{item.fechaCreacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputText>    
                            </center>                            
                        </p:column> 
                        <p:column style="width: 180px;"
                                    headerText="#{msg.iniciador}">                    
                            <h:outputText value="#{expedienteManagedBean.arreglarIniciador(item.iniciador.nombre)}"/>                                                          
                        </p:column>
                        <p:column headerText="#{msg.referencia}">
                            <h:outputText value="#{item.referencia}"/>                                                          
                        </p:column>

                        <p:column style="width: 90px;" 
                                    headerText="#{msg.estado}">
                            <center>
                                <h:outputText value="#{item.estadoNota.nombre}" />   
                            </center>                            
                        </p:column> 
                        <p:column style="width: 180px;" headerText="#{msg.origen}" rendered="#{notaManagedBean.flagBandeja == 2 || notaManagedBean.flagBandeja == 3 || notaManagedBean.flagBandeja == 5 || notaManagedBean.flagBandeja == 6}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaOrigen)}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.destino}" rendered="#{notaManagedBean.flagBandeja == 1 || notaManagedBean.flagBandeja == 4 || notaManagedBean.flagBandeja == 6}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaDestino)}"/>                                                          
                        </p:column>
                    </p:dataTable>
                    
                </div>
                <div align="left">
                    <h:panelGrid columns="2" cellpadding="2">
                        <p:commandButton id="ingresar" 
                                        value="#{msg.ingresarEnviarNota}"
                                        action="ingresarEnviarNotaPosta">                            
                        </p:commandButton>
                        <p:commandButton value="#{msg.cancel}" action="notaConf" actionListener="#{notaManagedBean.limpiar()}" immediate="true"/>
                    </h:panelGrid>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/> 
            </h:form>           
        </ui:define>
    </ui:composition>
</html>
