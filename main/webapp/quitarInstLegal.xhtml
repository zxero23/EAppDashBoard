<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html">
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formAgregarInstLegal" styleClass="form" title=" ">
                <div>
                    <div id="titulo" class="principal" style="float:left">
                        <h1>
                            <h:outputLabel value="#{msg.quitInstLegal} - #{msg.expediente} #{expedienteManagedBean.expediente.nroExp}"/>
                        </h1>
                    </div>
                    <div style="float:right">
                        <div style="text-align: right">                                                        
                            <p:commandLink action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" value="#{msg.volver}" style="margin-left: 10px;" immediate="true"/>
                        </div>                       
                    </div>
                </div>
                <div style="clear: both"/>

                <h:outputLabel value="#{msg.confInstLegal}" />
                <h:selectManyListbox id="slctInstLegal" value="#{expedienteManagedBean.idItems}" size="10">
                    <f:selectItems value="#{expedienteManagedBean.selectItemsInstLegalAgregados}" />
                </h:selectManyListbox>

                <h:inputHidden value="#{expedienteManagedBean.codOrganismo}"/>
                <h:inputHidden value="#{expedienteManagedBean.nroCorrel}"/>
                <h:inputHidden value="#{expedienteManagedBean.annio}"/>

                <br/>
                <h:panelGrid columns="2">
                    <p:commandButton value="#{msg.quit}" action="#{expedienteManagedBean.quitarInstLegal()}" style="margin-right:5px;"/>
                    <p:commandButton value="#{msg.cancel}" action="expedienteConf" actionListener="#{expedienteManagedBean.limpiar()}" immediate="true"/>
                </h:panelGrid>
                <p:blockUI block="formAgregarInstLegal" /> 
            </h:form>   
        </ui:define>
    </ui:composition>
</html>
