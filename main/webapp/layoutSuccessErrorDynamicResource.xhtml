<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form id="successError" title=" ">
                <div id="titulo" class="principal">
                    <h3>
                        <p:graphicImage value="#{imagen}" style="margin-right: 5px;"/>
                        <h:outputLabel value="#{tituloVentana}"/>
                    </h3>
                </div>
                <div id="msj">
                    <h:panelGrid columns="2" cellspacing="4">
                        <h:outputLabel value="#{mensaje}" styleClass="espacioInferior"/>
                        <h:panelGroup rendered="#{recurso != null and nombreReporte != null}">
                            <p:commandButton value="#{etiqueta}" icon="pi pi-download" ajax="false">
                                <p:fileDownload value="#{miBean.reporteStreamedContent}"/>
                            </p:commandButton>
                        </h:panelGroup>
                    </h:panelGrid>
                </div>
                <br/>
                <div align="center">
                    <p:commandLink action="#{actionVolver.toString}" actionListener="#{miBean[actionListenerRefresh]}" value="- #{msg.volver} -" style="color: #08446c;"/>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>                    
        </ui:define>
    </ui:composition>
</html>
