<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutDetalle.xhtml">
        <ui:param name="tituloVentana" value="Detalle Usuario Externo"/>
        <ui:param name="actionVolver" value="usuarioExternoConf"/>
        <ui:param name="miBean" value="#{usuarioExternoManagedBean}"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:define name="elDetalle">
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.id}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioExternoManagedBean.usuarioExterno.id}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.apellido}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioExternoManagedBean.usuarioExterno.apellido}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.nombre}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioExternoManagedBean.usuarioExterno.nombre}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.dni}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioExternoManagedBean.usuarioExterno.dni}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.usuario}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuario.nombreUsuario}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.contrasenia}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuario.claveAcceso}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.fechaAlta}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuario.fechaAlta}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputLabel>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.fechaModif}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuario.fechaModificacion}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputLabel>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.ultimoLogin}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuario.ultimoLogin}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputLabel>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.habilitado}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{usuarioManagedBean.usuario.estado?'S�':'NO'}"/>
                </td>
            </tr>
        </ui:define>
        <ui:define name="masInfo">
            <h:outputLabel value="#{msg.confGrupo}"/>
            <p:dataTable id="list" value="#{usuarioManagedBean.usuario.grupos}" var="item" style="width: 50%">
                <p:column headerText="#{msg.nombre}">
                    <div align="left">
                        <h:outputText value="#{item.nombre}"/>
                    </div>
                </p:column>
                <p:column headerText="#{msg.descripcion}">                   
                    <div align="left">
                        <h:outputText value="#{item.descripcion}"/>
                    </div>
                </p:column>   
            </p:dataTable>            
        </ui:define>
    </ui:composition>
