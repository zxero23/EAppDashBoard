<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="#{msg.editExpte} #{expedienteManagedBean.nroExpedienteAux}"/>
        <ui:param name="miBean" value="#{expedienteManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="expedienteConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.fechaCreacion}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="fecCreacion"
                        value="#{expedienteManagedBean.fechaCreacion}"
                        label="#{msg.fechaCreacion}"
                        required="true"
                        styleClass="muyancho">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                        <f:ajax render="@this fecCreacionError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="fecCreacionError" for="fecCreacion" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.cuerpo}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="cuerpo"
                        value="#{expedienteManagedBean.cuerpo}"
                        label="#{msg.cuerpo}"
                        required="true"
                        type="number"
                        styleClass="muyancho">
                        <f:ajax render="@this cuerpoError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="cuerpoError" for="cuerpo" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.fojas}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="fojas"
                        value="#{expedienteManagedBean.fojas}"
                        label="#{msg.fojas}"
                        required="true"
                        type="number"
                        styleClass="muyancho">
                        <f:ajax render="@this fojasError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="fojasError" for="fojas" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.tipoIniciador}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="tipoIniciador"
                        value="#{expedienteManagedBean.idTipoIniciador}"
                        valueChangeListener="#{expedienteManagedBean.cargarIniciadores}"
                        label="#{msg.tipoIniciador}"
                        required="true" 
                        style="width: 560px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{expedienteManagedBean.selectItemsTipoIniciador}" />
                        <f:ajax />
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="tipoIniciadorError" for="tipoIniciador" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.iniciador}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu 
                        id="iniciador"
                        value="#{expedienteManagedBean.idIniciador}"
                        label="#{msg.iniciador}"
                        disabled="#{expedienteManagedBean.deshabilitarIniciador}"
                        required="true"
                        width="560" 
                        placeholder="Nombre o c�digo del iniciador" 
                        showListOnInput="true"                                      
                        filterMatchMode="contains" >
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{expedienteManagedBean.selectItemsIniciador}" />
                        <f:ajax render="@this iniciadorError" event="valueChange"/>
                    </p:selectOneMenu>                    
                </td>
                <td align="left">
                    <p:message id="iniciadorError" for="iniciador" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.tipoAsunto}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="tipoAsunto"
                        value="#{expedienteManagedBean.idTipoAsunto}"
                        required="true"
                        label="#{msg.tipoAsunto}"
                        style="width: 560px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{expedienteManagedBean.selectItemsTipoAsunto}" />
                        <f:ajax render="@this tipoAsuntoError" event="valueChange"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="tipoAsuntoError" for="tipoAsunto" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.asunto}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="asunto"
                        value="#{expedienteManagedBean.asunto}"
                        required="true"
                        label="#{msg.asunto}"
                        styleClass="muyancho">
                        <f:ajax render="@this asuntoError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="asuntoError" for="asunto" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.ordenPago}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="orden"
                        value="#{expedienteManagedBean.ordenPago}"
                        styleClass="muyancho">
                        <f:ajax render="@this ordenError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="ordenError" for="orden" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.pedidoFondo}:" />
                </td>
                <td align="left">
                    <h:panelGrid columns="3">
                        <p:inputText
                            id="pedidoFondo"
                            value="#{expedienteManagedBean.pedidoFondo}"
                            type="number"
                            valueChangeListener="#{expedienteManagedBean.agregarAnio}">
                            <f:ajax render="@this pedidoFondoAnio pedidoFondoError" event="valueChange"/>
                        </p:inputText>
                        <h:outputLabel value="/" />
                        <p:inputText
                            id="pedidoFondoAnio"
                            value="#{expedienteManagedBean.pedidoFondoAnio}"                                                        
                            type="number"
                            validator="#{expedienteManagedBean.validadorAnio}">
                            <f:ajax render="@this pedidoFondoAnioError" event="valueChange"/>
                        </p:inputText>
                    </h:panelGrid>
                </td>
                <td align="left">
                    <p:message id="pedidoFondoError" for="pedidoFondo" initEffect="slide" changeEffect="fade"></p:message>
                    <p:message id="pedidoFondoAnioError" for="pedidoFondoAnio" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.ordenEntrega}:" />
                </td>
                <td align="left">
                    <h:panelGrid columns="3">
                        <p:inputText
                            id="ordenEntrega"
                            value="#{expedienteManagedBean.ordenEntrega}"
                            type="number"
                            valueChangeListener="#{expedienteManagedBean.agregarAnio}">
                            <f:ajax render="@this ordenEntregaAnio ordenEntregaError" event="valueChange"/>
                        </p:inputText>
                        <h:outputLabel value="/" />
                        <p:inputText
                            id="ordenEntregaAnio"
                            value="#{expedienteManagedBean.ordenEntregaAnio}"
                            type="number"
                            validator="#{expedienteManagedBean.validadorAnio}">
                            <f:ajax render="@this ordenEntregaAnioError" event="valueChange"/>
                        </p:inputText>                        
                    </h:panelGrid>
                </td>
                <td align="left">
                    <p:message id="ordenEntregaError" for="ordenEntrega" initEffect="slide" changeEffect="fade"></p:message>
                    <p:message id="ordenEntregaAnioError" for="ordenEntregaAnio" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.expteSuperior}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="expMadre"
                        value="#{expedienteManagedBean.expMadre}"
                        styleClass="muyancho">
                        <f:ajax render="@this expMadreError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="expMadreError" for="expMadre" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.destino}:" rendered="#{expedienteManagedBean.flagBandeja != 3}" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="destino"
                        value="#{expedienteManagedBean.idMesa}"
                        label="#{msg.destino}"
                        rendered="#{expedienteManagedBean.flagBandeja != 3}"
                        required="true" 
                        style="width: 560px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{expedienteManagedBean.selectItemsDestino}" />
                        <f:ajax render="@this destinoError" event="valueChange"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="destinoError" for="destino" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.observacion}:" />
                </td>
                <td align="left">
                    <p:inputTextarea
                        id="observacion"
                        value="#{expedienteManagedBean.observacion}"
                        styleClass="muyancho"/>
                </td>
            </tr>
            <h:inputHidden value="#{expedienteManagedBean.codOrganismo}"/>
            <h:inputHidden value="#{expedienteManagedBean.nroCorrel}"/>
            <h:inputHidden value="#{expedienteManagedBean.annio}"/>
        </ui:define>
    </ui:composition>
</html>
