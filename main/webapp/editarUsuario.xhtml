<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="#{msg.editUsuario}"/>
        <ui:param name="miBean" value="#{usuarioManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="usuarioConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.apellido}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="apellidoUsuario"
                        value="#{usuarioManagedBean.apellido}"
                        label="#{msg.apellido}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this apellidoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="apellidoUsuarioError" for="apellidoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.nombre}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombreUsuario"
                        value="#{usuarioManagedBean.nombre}"
                        label="#{msg.nombre}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this nombreUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreUsuarioError" for="nombreUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) DNI:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="dniUsuario"
                        value="#{usuarioManagedBean.dni}"
                        label="DNI"
                        required="true" 
                        min="0"
                        max="99999999"
                        size="8"
                        type="number"
                        styleClass="muyancho"
                        maxlength="8">
                        <f:ajax render="@this dniUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="dniUsuarioError" for="dniUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.usuario}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="usuarioUsuario"
                        value="#{usuarioManagedBean.nombreUsuario}"
                        label="#{msg.usuario}"
                        required="true" 
                        styleClass="muyancho"
                        validator="#{usuarioManagedBean.coincidenciaNombre}">
                        <f:ajax render="@this usuarioUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="usuarioUsuarioError" for="usuarioUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.correo}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="correoUsuario"
                        value="#{usuarioManagedBean.correo}"
                        label="#{msg.correo}"
                        validator="#{usuarioManagedBean.validarEmail}"
                        required="true"
                        type="email"
                        styleClass="muyancho">
                        <f:ajax render="@this correoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="correoUsuarioError" for="correoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">                                
                    <h:outputLabel value="(*) #{msg.organismo}: " />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="orgUsuario"
                        style="width: 560px;"
                        label="#{msg.organismo}" 
                        value="#{usuarioManagedBean.idOrganismo}" >
                        <f:selectItem itemLabel="#{msg.elegir}" noSelectionOption="true"  itemValue="0"/>
                        <f:selectItems value="#{usuarioManagedBean.selectItemsOrganismo}" />
                        <f:ajax execute="@this" render="@this mesaUsuario" />
                    </p:selectOneMenu>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.mesa}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="mesaUsuario"
                        value="#{usuarioManagedBean.idMesa}"
                        label="#{msg.mesa}"
                        required="true"
                        style="width: 560px ">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{usuarioManagedBean.selectItemsMesa}" />
                        <f:ajax render="@this mesaUsuarioError" event="valueChange"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="mesaUsuarioError" for="mesaUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>

            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.confGrupo}" />
                </td>
                <td align="left">
                    <h:panelGroup id="Grupos">
                        <h:outputLabel value="#{msg.grupoD}" style="margin-right: 100px;"/>
                        <h:selectManyListbox id="firstList" value="#{usuarioManagedBean.selectedItemsIzquierda}" styleClass="subList" size="8">
                            <f:selectItems value="#{usuarioManagedBean.itemsIzquierda}" var="item" itemValue="#{item.value}" itemLabel="#{item.label}"/>
                        </h:selectManyListbox>
                        <p:commandButton value="&gt;&gt;" actionListener="#{usuarioManagedBean.agregar()}" update="Grupos"/>
                        <p:commandButton value="&lt;&lt;" actionListener="#{usuarioManagedBean.borrar()}" update="Grupos"/>
                        <h:outputLabel value="#{msg.grupoS}" style="margin-left: 100px;"/>
                        <h:selectManyListbox id="secondList" value="#{usuarioManagedBean.selectedItemsDerecha}" styleClass="subList" size="8">
                            <f:selectItems value="#{usuarioManagedBean.itemsDerecha}" var="item" itemValue="#{item.value}" itemLabel="#{item.label}"/>
                        </h:selectManyListbox>
                    </h:panelGroup>
                </td>
            </tr> 
            <ui:fragment rendered="#{usuarioManagedBean.asignarMesasDisponibles}" >
                <tr>
                    <td align="right">
                        <h:outputLabel value="(*) #{msg.mesasDisponibles}" />
                    </td>
                    <td align="left">
                        <h:selectManyListbox id="mesasDisponibles" value="#{usuarioManagedBean.idMesasDisponibles}" size="8">
                            <f:selectItems value="#{usuarioManagedBean.selectItemsMesasDisponibles}" />
                        </h:selectManyListbox>
                    </td>
                </tr>
            </ui:fragment>
            <h:inputHidden value="#{usuarioManagedBean.id}"/>
        </ui:define>
    </ui:composition>
</html>
