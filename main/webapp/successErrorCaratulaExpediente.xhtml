<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="./layoutSuccessError.xhtml">
        <ui:param name="imagen" value="#{expedienteManagedBean.images}"/>
        <ui:param name="tituloVentana" value="#{expedienteManagedBean.title}"/>
        <ui:param name="mensaje" value="#{expedienteManagedBean.msgSuccessError}"/>
        <ui:param name="actionVolver" value="expedienteConf"/>
        <ui:param name="miBean" value="#{expedienteManagedBean}"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>

        <ui:define name="imprimir">
            <p:graphicImage  resource="#{expedienteManagedBean.imprimirCaratula}"
                                  label="Imprimir"
                                  mimeType="application/pdf"
                                  attachment="true"
                                  fileName="#{expedienteManagedBean.nombrar('caratula','pdf')}"
                                  icon="pi pi-print"
                                  type="button"/>
        </ui:define>
    </ui:composition>
</html>
