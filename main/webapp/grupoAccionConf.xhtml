<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formGrupoAccion" title=" ">
                <p:panel id="grupoAccion" header="#{msg.editarAccionesGrupo}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.grupo}:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="slmGrupos" value="#{permisoManagedBean.idGrupo}" valueChangeListener="#{permisoManagedBean.updateListAcctions}" immediate="true" required="true" >                                                         
                                    <f:selectItem itemLabel="#{msg.ninguno}" itemValue=""/>
                                    <f:selectItems value="#{permisoManagedBean.selectItemsGrupo}" />
                                    <f:ajax execute="@this" render="@this slmGruposMsg dualListControl secondList" event="valueChange" />
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="slmGruposMsg" for="slmGrupos" initEffect="slide" changeEffect="shake"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.confAction}:" />
                            </td>
                            <td align="left">
                                <h:panelGroup id="dualListControl">
                                    <h:outputLabel value="#{msg.accionesDisponibles}:" />
                                    <h:selectManyListbox id="firstList" value="#{permisoManagedBean.selectedItemsIzquierda}"
                                        styleClass="subList" style="height:300px" size="12">
                                        <f:selectItems value="#{permisoManagedBean.itemsIzquierda}" var="item" itemValue="#{item.value}" itemLabel="#{item.label}"/>
                                    </h:selectManyListbox>
                                    <p:commandButton value="&gt;&gt;" actionListener="#{permisoManagedBean.agregar()}" update="dualListControl"/>
                                    <p:commandButton value="&lt;&lt;" actionListener="#{permisoManagedBean.borrar()}" update="dualListControl"/>
                                    <h:outputLabel value="#{msg.accionesSeleccionadas}" />
                                    <h:selectManyListbox id="secondList" value="#{permisoManagedBean.selectedItemsDerecha}"
                                        styleClass="subList" style="height:300px" size="12">
                                        <f:selectItems value="#{permisoManagedBean.itemsDerecha}" var="item" itemValue="#{item.value}" itemLabel="#{item.label}"/>
                                    </h:selectManyListbox>
                                </h:panelGroup>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                            </td>
                            <td align="left">
                                <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                                    <p:commandButton id="save" action="#{permisoManagedBean.editarGrupoAccion()}" >
                                        <i class="pi pi-pencil" aria-hidden="true"></i>
                                        #{msg.saveEdit}
                                    </p:commandButton>                     
                                    <p:commandButton id="cancel"  action="administracion" immediate="true" actionListener="#{permisoManagedBean.limpiar()}" >
                                        <i class="pi pi-ban" aria-hidden="true"></i>
                                        #{msg.cancel}
                                    </p:commandButton>
                                </h:panelGrid>
                            </td>
                            <td align="left">
                            </td>                            
                        </tr>
                    </table>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
