<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formOrganismo" title=" ">
                <div id="titulo" class="principal">
                    <h1>
                        <i class="pi pi-building" style="margin-right: 8px; vertical-align: middle; color: #08446c;" aria-hidden="true"/>
                        <h:outputLabel value="Organismos"/>
                    </h1>
                </div>    
                <h:panelGrid  columns="2" class="panel-buttons">
                    <h:panelGroup>
                        <span class="pi pi-refresh" aria-hidden="true" style="margin-right: 5px;"/>
                        <p:commandLink action="organismoConf" actionListener="#{organismoManagedBean.actualizar}" value="Organismos"/>
                        |
                    </h:panelGroup>

                    <h:panelGroup rendered="#{organismoManagedBean.alta}">
                        <span class="pi pi-plus" aria-hidden="true" style="margin-right: 5px;"/>
                        <p:commandLink action="nuevoOrganismo" value="#{msg.newOrganismo}"/>
                    </h:panelGroup>
                </h:panelGrid>

                <h:panelGroup id="panelbusqueda" layout="block" styleClass="panelbusqueda">
                <p:panel id="expPanelBusqueda" toggleable="true" toggleSpeed="500" collapsed="true" styleClass="panel-buttons">
                    <f:facet name="header">
                        <h:outputText value="#{msg.busqueda}"/>
                    </f:facet>
                    <h:panelGrid columns="3" cellspacing="8" cellpadding="0" styleClass="panel-busqueda-campos">
                        <h:panelGroup>
                            <h:outputLabel value="#{msg.id}:"/>
                            <p:inputText value="#{organismoManagedBean.idBuscar}" type="number" style="width: 80px;"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:outputLabel value="#{msg.codOrganismo}:"/>
                            <p:inputText value="#{organismoManagedBean.codOrganigramaBsq}" size="30" style="width: 100%; min-width: 120px;"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:outputLabel value="#{msg.nombre}:"/>
                            <p:inputText value="#{organismoManagedBean.nombreBuscar}" size="30" style="width: 100%; min-width: 120px;"/>
                        </h:panelGroup>
                    </h:panelGrid>
                    <div class="panel-busqueda-botones">
                        <p:commandButton id="btnBuscar" value="#{msg.find}" actionListener="#{organismoManagedBean.aplicarFiltro}" update="@form" process="@form"/>
                        <p:defaultCommand target="btnBuscar"/>
                        <p:commandButton value="#{msg.actualizar}" actionListener="#{organismoManagedBean.actualizar}" update="@form" process="@form"/>
                    </div>
                </p:panel>
                </h:panelGroup>

                <p:dataTable id="SituacionPanelDataTable" value="#{organismoManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">

                    <p:column id="cod" headerText="CÓD. ORGANISMO">
                        <center>
                            <h:outputText id="cellCod" value="#{item.codOrganigrama}"/>
                        </center>
                    </p:column>

                    <p:column id="nombre" headerText="NOMBRE">
                        <h:outputText id="cellNombre" value="#{item.nombre}"/>                         
                    </p:column>

                    <p:column id="accion" headerText="ACCIONES" style="width: 15%"  >
                        <h:panelGroup layout="block" styleClass="acciones-tabla">

                            <p:commandButton id="detalle" p:title="#{msg.detalle}" action="detalleOrganismo" actionListener="#{organismoManagedBean.verDetalle}" rendered="#{organismoManagedBean.detalle}" ajax="false"
                                icon="pi pi-search" value="">
                                <f:param name="id" value="#{item.id}"/>
                            </p:commandButton>

                            <p:commandButton id="editar" p:title="Editar" action="editarOrganismo" actionListener="#{organismoManagedBean.prepararParaEditar()}" rendered="#{organismoManagedBean.modificacion}" ajax="false"
                                icon="pi pi-pencil" value="">
                                <f:param name="id" value="#{item.id}"/>
                            </p:commandButton>

                            <p:commandButton id="eliminar" p:title="Eliminar" rendered="#{organismoManagedBean.baja}" p:onclick="PF('confirmDialogOrganismo').show();return false;"
                                icon="pi pi-trash" value="">
                            </p:commandButton>

                            <p:dialog id="confirmDialogOrganismo" widgetVar="confirmDialogOrganismo" binding="#{confirmDialogOrganismo}"
                                                    header="${msg.confirm}"
                                                    modal="true"
                                                    width="300"
                                                    height="155"
                                                    position="center">
                                <p:outputLabel value="${msg.msgDelete}"/>
                                <h:panelGrid columns="2" class="panel-confirm-buttons">
                                    <p:commandButton id="yes" value="${msg.acep}" p:onclick="PF('confirmDialogOrganismo').hide();" actionListener="#{organismoManagedBean.guardarBorrado()}">
                                        <f:param name="id" value="#{item.id}" />
                                        <f:ajax execute="@this" render="@all"/>
                                    </p:commandButton>
                                    <p:commandButton id="no" value="${msg.cancel}" p:onclick="PF('confirmDialogOrganismo').hide();">
                                        <f:ajax execute="@this" render="@all"/>
                                    </p:commandButton>
                                </h:panelGrid>
                            </p:dialog>

                        </h:panelGroup>
                    </p:column>                    
                </p:dataTable>          

            </h:form>
        </ui:define>
    </ui:composition>
</html>
