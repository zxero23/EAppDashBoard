<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="./layoutConf.xhtml">
        <ui:param name="tituloVentana" value="${msg.confAction}"/>
        <ui:param name="miBean" value="#{accionManagedBean}"/>
        <ui:param name="actionRefresh" value="accionConf"/>
        <ui:param name="actionListenerRefresh" value="actualizar"/>
        <ui:param name="valueRefresh" value="#{msg.confAction}"/>
        <ui:param name="renderedAlta" value="#{accionManagedBean.alta}"/>
        <ui:param name="actionAlta" value="nuevaAccion"/>
        <ui:param name="valueAlta" value="#{msg.newAction}"/>
        <ui:param name="actionListenerBuscar" value="aplicarFiltro"/>
        <ui:param name="actionListenerActualizar" value="actualizar"/>
        <ui:param name="tablaValue" value="listElements"/>
        <ui:param name="actionDetalle" value="detalleAccion"/>
        <ui:param name="actionListenerDetalle" value="verDetalle"/>
        <ui:param name="renderedDetalle" value="#{accionManagedBean.detalle}"/>
        <ui:param name="actionEditar" value="editarAccion"/>
        <ui:param name="actionListenerEditar" value="prepararParaEditar"/>
        <ui:param name="renderedEditar" value="#{accionManagedBean.modificacion}"/>
        <ui:param name="renderedBorrar" value="#{accionManagedBean.baja}"/>
        <ui:param name="actionListenerBorrar" value="guardarBorrado"/>
        
        <ui:param name="eldialog" value="accionBorrarDialog"/>

        <ui:define name="busqueda">
            <h:panelGroup>
                <h:outputLabel value="#{msg.nombre}"/>
                <p:inputText id="nombreBuscar" value="#{accionManagedBean.nombreBuscar}"/>
            </h:panelGroup>
        </ui:define>        
    </ui:composition> 
</html>
