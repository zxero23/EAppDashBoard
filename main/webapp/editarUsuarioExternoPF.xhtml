<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="Editar Persona F�sica"/>
        <ui:param name="miBean" value="#{usuarioExternoManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="usuarioExternoConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.apellido}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="apellidoUsuario"
                        value="#{usuarioExternoManagedBean.apellido}"
                        label="#{msg.apellido}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this apellidoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="apellidoUsuarioError" for="apellidoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.nombre}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombreUsuario"
                        value="#{usuarioExternoManagedBean.nombre}"
                        label="#{msg.nombre}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this nombreUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreUsuarioError" for="nombreUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.dni}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="dniUsuario"
                        value="#{usuarioExternoManagedBean.documento}"
                        label="#{msg.dni}"
                        type="number"
                        required="true" 
                        styleClass="muyancho"
                        validator="#{usuarioExternoManagedBean.validarDocumento}">
                        <f:ajax render="@this dniUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="dniUsuarioError" for="dniUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.correo}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="correoUsuario"
                        value="#{usuarioExternoManagedBean.email}"
                        label="#{msg.correo}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this correoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="correoUsuarioError" for="correoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.usuario}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="usuarioUsuario"
                        value="#{usuarioExternoManagedBean.uss}"
                        label="#{msg.usuario}"
                        required="true" 
                        styleClass="muyancho"
                        validator="#{usuarioExternoManagedBean.coincidenciaNombre}">
                        <f:ajax render="@this usuarioUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="usuarioUsuarioError" for="usuarioUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.contrasenia}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="passUsuario"
                        value="#{usuarioExternoManagedBean.pass}"
                        label="#{msg.contrasenia}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this passUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="passUsuarioError" for="passUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <h:inputHidden value="#{usuarioExternoManagedBean.id}"/>

        </ui:define>
        <ui:define name="masInfo">
            <h:outputLabel value="Ingrese el DNI sin puntos." style="background: #FFEBE8; color: #DD3C10; border: 1px solid #DD3C10; font-size: 0.9em; margin-bottom: 15px; margin-top: 15px;"/>  <br/>           
        </ui:define>
    </ui:composition>
</html>
