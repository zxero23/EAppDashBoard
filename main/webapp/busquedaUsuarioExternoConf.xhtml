<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">
                <div id="titulo" class="principal">
                    <h1>
                        <i class="pi pi-search" style="margin-right: 8px; vertical-align: middle; color: #08446c;" aria-hidden="true"/>
                        <h:outputLabel value="#{msg.confBusquedaExpteIniciados}"/>
                    </h1>
                </div>
                <h:panelGroup id="panelbusqueda" layout="block" styleClass="panelbusqueda">
                    <p:panel id="expPanelBusqueda" toggleable="true" toggleSpeed="500" collapsed="true" styleClass="panel-buttons">
                        <f:facet name="header">
                            <h:outputText value="#{msg.busqueda}"/>
                        </f:facet>
                        <h:panelGrid columns="3">
                            <p:inputText value="#{busquedaUsExManagedBean.codOrganismo}"
                                           label="#{msg.codOrganismo}:" labelPosition="top"/>
                            <p:inputText value="#{busquedaUsExManagedBean.nroCorrel}"
                                           label="#{msg.correlativo}:" labelPosition="top"/>
                            <p:inputText value="#{busquedaUsExManagedBean.anio}"
                                           label="#{msg.anio}:" labelPosition="top"/>
                        </h:panelGrid>
                        <h:panelGrid columns="2">
                            <p:datePicker id="fechaDesde"
                                               value="#{busquedaUsExManagedBean.fechaDesde}"
                                               label="#{msg.fechaDesde}:"  labelPosition="top" 
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false" renderAsPopup="true" 
                                               showButtonPanel="false" >
                                <f:ajax />
                            </p:datePicker>
                            <p:datePicker id="fechaHasta"
                                               value="#{busquedaUsExManagedBean.fechaHasta}"
                                               label="#{msg.fechaHasta}:"  labelPosition="top"
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false"
                                               renderAsPopup="true"
                                               showButtonPanel="false" >
                                <f:ajax />
                            </p:datePicker>
                        </h:panelGrid>
                        <div class="panel-busqueda-botones">
                            <p:commandButton id="btnBuscar" value="#{msg.find}" actionListener="#{busquedaUsExManagedBean.aplicarFiltro}" update="@form" process="@form"/>
                            <p:defaultCommand target="btnBuscar"/>
                            <p:commandButton value="#{msg.actualizar}" actionListener="#{busquedaUsExManagedBean.actualizar}" update="@form" process="@form"/>
                        </div>
                    </p:panel>
                </h:panelGroup>

                <div>
                    <p:dataTable id="tablita"
                                   value="#{busquedaUsExManagedBean.listElements}"
                                   var="item"
                                   rows="10"
                                   style="width:100%; margin-top: 10px;"
                                   paginator="true"
                                   paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
                                   rowsPerPageTemplate="10,20,30,50,100"
                                   paginatorPosition="bottom">

                        <p:column style="width: 90px;"
                                    headerText="#{msg.fechaCreacion}">
                            <center>
                                <h:outputText value="#{item.fechaCreacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputText>    
                            </center>                            
                        </p:column> 
                        <p:column style="width: 81px;"
                                    headerText="#{msg.num}">
                            <center>
                                <h:outputText value="#{item.nroExp}"/>
                            </center>                            
                        </p:column> 
                        <p:column style="width: 180px;"
                                    headerText="#{msg.iniciador}">                    
                            <h:outputText value="#{expedienteManagedBean.arreglarIniciador(item.iniciador.nombre)}"/>                                                          
                        </p:column>
                        <p:column headerText="#{msg.asunto}">
                            <h:outputText value="#{item.asunto}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.origen}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaOrigen)}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.destino}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaDestino)}"/>                                                          
                        </p:column> 
                        <p:column style="width: 32px;" headerText="#{msg.fojas}">
                            <center>
                                <h:outputText value="#{item.fojas}"/>
                            </center>                                                                                      
                        </p:column>
                        <p:column>
                            <h:panelGroup layout="block" styleClass="acciones-tabla">
                                <p:commandButton action="detalleExpedienteUsEx" actionListener="#{busquedaUsExManagedBean.verDetalle}" ajax="false"
                                    icon="pi pi-search" value="" title="#{msg.detalle}">
                                    <f:param name="cod" value="#{item.codOrganismo}" />
                                    <f:param name="nro" value="#{item.numCorrelativo}" />
                                    <f:param name="anio" value="#{item.anio}" />
                                </p:commandButton>
                            </h:panelGroup>
                        </p:column>  
                    </p:dataTable>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
