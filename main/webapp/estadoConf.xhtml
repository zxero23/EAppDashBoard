<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="./layoutConf.xhtml">
        <ui:param name="tituloVentana" value="#{msg.confEstado}"/>
        <ui:param name="miBean" value="#{estadoManagedBean}"/>
        <ui:param name="actionRefresh" value="estadoConf"/>
        <ui:param name="actionListenerRefresh" value="actualizar"/>
        <ui:param name="valueRefresh" value="#{msg.confAction}"/>
        <ui:param name="renderedAlta" value="#{estadoManagedBean.alta}"/>
        <ui:param name="actionAlta" value="nuevoEstado"/>
        <ui:param name="valueAlta" value="#{msg.newEstado}"/>
        <ui:param name="actionListenerBuscar" value="aplicarFiltro"/>
        <ui:param name="actionListenerActualizar" value="actualizar"/>
        <ui:param name="tablaValue" value="listElements"/>
        <ui:param name="actionDetalle" value="detalleEstado"/>
        <ui:param name="actionListenerDetalle" value="verDetalle"/>
        <ui:param name="renderedDetalle" value="#{estadoManagedBean.detalle}"/>
        <ui:param name="actionEditar" value="editarEstado"/>
        <ui:param name="actionListenerEditar" value="prepararParaEditar"/>
        <ui:param name="renderedEditar" value="#{estadoManagedBean.modificacion}"/>
        <ui:param name="renderedBorrar" value="#{estadoManagedBean.baja}"/>
        <ui:param name="actionListenerBorrar" value="guardarBorrado"/>

        <ui:define name="busqueda">
            <h:panelGroup>
                <h:outputLabel value="#{msg.nombre}"/>
                <p:inputText id="nombreBuscar" value="#{estadoManagedBean.nombreBuscar}"/>
            </h:panelGroup>
        </ui:define>                       
    </ui:composition> 
</html>
