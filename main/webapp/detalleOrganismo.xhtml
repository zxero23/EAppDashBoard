<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:composition template="./layoutDetalle.xhtml">
        <ui:param name="tituloVentana" value="#{msg.detailsOrganismo}"/>
        <ui:param name="actionVolver" value="organismoConf"/>
        <ui:param name="miBean" value="#{organismoManagedBean}"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:define name="elDetalle">
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.id}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{organismoManagedBean.id}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.codOrganismo}" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{organismoManagedBean.codOrganigrama}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.nombre}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{organismoManagedBean.nombre}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.descripcion}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{organismoManagedBean.descripcion}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.organismoPadre}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{organismoManagedBean.organismoPadre}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.implementa}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{organismoManagedBean.implementa? 'S�' :'No'}"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.fechaImplementacion}:" />
                </td>
                <td align="left">
                    <h:outputLabel value="#{organismoManagedBean.fechaImple}">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                    </h:outputLabel>
                </td>
            </tr>  
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.organismo}s:" />
                </td>
                <td align="left">
                    <ul>
                        <c:forEach items="#{organismoManagedBean.lstOrganismos}" var="organismo">
                            <li>#{organismo.codOrganigrama} - #{organismo.nombre}</li>
                        </c:forEach>
                    </ul>
                </td>
            </tr>
        </ui:define>
    </ui:composition>
</html>
