<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">
                <div id="titulo" class="principal">
                    <h1>
                        <h:outputLabel value="#{msg.confBusquedaNotasIniciadas}"/>
                    </h1>
                </div>
                <h:panelGroup id="panelbusqueda" layout="block" styleClass="panelbusqueda">
                    <p:panel id="expPanelBusqueda" toggleable="true" toggleSpeed="500" collapsed="true" styleClass="panel-buttons">
                        <f:facet name="header">
                            <h:outputText value="#{msg.busqueda}"/>
                        </f:facet>
                        <h:panelGrid columns="2">
                            <p:inputText value="#{notaManagedBean.idNotaBsq}"
                                           label="#{msg.id}:" labelPosition="top"/>
                            <p:inputText value="#{notaManagedBean.nroNotaBsq}"
                                           label="#{msg.num}:" labelPosition="top"/>
                            <p:datePicker id="fechaDesde"
                                               value="#{notaManagedBean.fechaDesdeBsq}"
                                               label="#{msg.fechaDesde}:"  labelPosition="top" 
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false" renderAsPopup="true" 
                                               showButtonPanel="false" >
                                <f:ajax />
                            </p:datePicker>
                            <p:datePicker id="fechaHasta"
                                               value="#{notaManagedBean.fechaHastaBsq}"
                                               label="#{msg.fechaHasta}:"  labelPosition="top"
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false"
                                               renderAsPopup="true"
                                               showButtonPanel="false" >
                                <f:ajax />
                            </p:datePicker>
                        </h:panelGrid>
                        <h:panelGrid columns="1" cellspacing="2" style="width: 350px !important;">
                            <p:inputText value="#{notaManagedBean.referenciaBsq}"
                                           label="#{msg.referencia}:" labelPosition="top"
                                           style="width: 350px !important;"/>
                        </h:panelGrid>
                        <div class="panel-busqueda-botones">
                            <p:commandButton id="btnBuscar" value="#{msg.find}" actionListener="#{notaManagedBean.buscarNotasEx()}" update="@form" process="@form"/>
                            <p:defaultCommand target="btnBuscar"/>
                            <p:commandButton value="#{msg.actualizar}" actionListener="#{notaManagedBean.limpiarBusqueda()}" update="@form" process="@form"/>
                        </div>
                    </p:panel>
                </h:panelGroup>

                <div>
                    <p:dataTable id="tablita"
                                   value="#{notaManagedBean.notasEx}"
                                   var="item"
                                   rows="10"
                                   style="width:100%; margin-top: 10px;"
                                   paginator="true"
                                   paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
                                   rowsPerPageTemplate="10,20,30,50,100"
                                   paginatorPosition="bottom">

                        <p:column style="width: 90px;"
                                    headerText="#{msg.fechaCreacion}">
                            <center>
                                <h:outputText value="#{item.fechaCreacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputText>    
                            </center>                            
                        </p:column> 
                        <p:column headerText="#{msg.id}">
                            <center>
                                <h:outputText value="#{item.id}"/>
                            </center>                            
                        </p:column> 
                        <p:column headerText="#{msg.num}">
                            <center>
                                <h:outputText value="#{item.nroNota}"/>
                            </center>                            
                        </p:column> 
                        <p:column headerText="#{msg.referencia}">
                            <h:outputText value="#{item.referencia}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.origen}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaOrigen)}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.destino}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaDestino)}"/>                                                          
                        </p:column>                         
                        <p:column>
                            <h:panelGroup layout="block" styleClass="acciones-tabla">
                                <p:commandButton action="detalleNotaUsEx" actionListener="#{notaManagedBean.verDetalle}" ajax="false"
                                    icon="pi pi-search" value="" title="#{msg.detalle}">
                                    <f:param name="id" value="#{item.id}" />
                                </p:commandButton>
                            </h:panelGroup>
                        </p:column>  
                    </p:dataTable>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
