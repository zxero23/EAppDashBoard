<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html">
    <ui:composition template="./layoutNuevo.xhtml">
        <ui:param name="tituloVentana" value="#{msg.newTipoIniciador}"/>
        <ui:param name="miBean" value="#{tipoIniciadorManagedBean}"/>
        <ui:param name="actionListenerCrear" value="crear"/>
        <ui:param name="actionListenerCrearOtro" value="crearOtro"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="tipoIniciadorConf"/>
        <ui:define name="loNuevo">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.nombre}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombre"
                        value="#{tipoIniciadorManagedBean.nombre}"
                        required="true" 
                        styleClass="ancho">
                        <f:ajax render="@this nombreError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreError" for="nombre" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.isExterno}" />
                </td>
                <td align="left">
                    <p:selectBooleanCheckbox
                        id="externo"
                        value="#{tipoIniciadorManagedBean.externo}">               
                    </p:selectBooleanCheckbox>
                </td>
                <td align="left">
                    <p:message id="externoError" for="externo" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
        </ui:define>
    </ui:composition>
</html>
