<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutEdicion.xhtml">
        <ui:param name="tituloVentana" value="#{msg.editNota}"/>
        <ui:param name="miBean" value="#{notaManagedBean}"/>
        <ui:param name="actionListenerEditar" value="guardarEdicion"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="notaConf"/>
        <ui:define name="laEdicion">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.num}:" />
                </td>
                <td align="left">
                    <p:inputText 
                        id="nronota"
                        value="#{notaManagedBean.nroNota}"
                        label="#{msg.num}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this nronotaError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nronotaError" for="nronota" initEffect="slide" changeEffect="fade"></p:message>           
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.fechaCreacion}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="fecha"
                        value="#{notaManagedBean.fechaCreacion}"
                        label="#{msg.fechaCreacion}"
                        required="true" 
                        styleClass="muyancho">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                        <f:ajax render="@this fechaError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="fechaError" for="fecha" initEffect="slide" changeEffect="fade"></p:message>  
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.referencia}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="referencia"
                        value="#{notaManagedBean.referencia}"
                        label="#{msg.referencia}"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this referenciaError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="referenciaError" for="referencia" initEffect="slide" changeEffect="fade"></p:message>  
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.fojas}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="fojas"
                        value="#{notaManagedBean.fojas}"
                        label="#{msg.referencia}"
                        type="number"
                        required="true" 
                        styleClass="muyancho">
                        <f:ajax render="@this fojasError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="fojasError" for="fojas" initEffect="slide" changeEffect="fade"></p:message>  
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.tipoIniciador}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="tipoIniciador"
                        value="#{notaManagedBean.idTipoIniciador}"
                        label="#{msg.tipoIniciador}"
                        required="true"
                        style="width: 560px !important;">
                        <f:selectItem noSelectionOption="true" itemValue="#{null}" itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{notaManagedBean.selectItemsTipoIniciador}" />
                        <p:ajax event="change" listener="#{notaManagedBean.cargarIniciadoresSeleccionados}" process="@this" update="tipoIniciadorError iniciadorContainer iniciadorError"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="tipoIniciadorError" for="tipoIniciador" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>            
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.iniciador}:" />
                </td>
                <td align="left">
                    <h:panelGroup id="iniciadorContainer">
                        <p:selectOneMenu 
                            id="iniciador"
                            value="#{notaManagedBean.idIniciador}"
                            label="#{msg.iniciador}"
                            required="true"
                            disabled="#{notaManagedBean.deshabilitarIniciador}"
                            width="560" 
                            placeholder="Nombre o código del iniciador" 
                            showListOnInput="true"                                      
                            filterMatchMode="contains" >
                            <f:selectItem noSelectionOption="true" itemValue="#{null}" itemLabel="#{msg.ninguno}"/>
                            <f:selectItems value="#{notaManagedBean.selectItemsIniciador}" />
                            <f:ajax render="@this iniciadorError" event="valueChange"/>
                        </p:selectOneMenu>                    
                    </h:panelGroup>
                </td>
                <td align="left">
                    <p:message id="iniciadorError" for="iniciador" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.tipoAsunto}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="tipoAsunto"
                        value="#{notaManagedBean.idTipoAsunto}"
                        label="#{msg.tipoAsunto}"
                        required="true" 
                        style="width: 560px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{notaManagedBean.selectItemsTipoAsunto}" />
                        <f:ajax render="@this tipoAsuntoError" event="valueChange"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="tipoAsuntoError" for="tipoAsunto" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.destino}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="mesa"
                        value="#{notaManagedBean.idMesa}"
                        label="#{msg.destino}"
                        required="true" 
                        style="width: 560px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{notaManagedBean.selectItemsDestino}" />
                        <f:ajax render="@this mesaError" event="valueChange"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="mesaError" for="mesa" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.observacion}:" />
                </td>
                <td align="left">
                    <p:inputTextarea 
                        value="#{notaManagedBean.observacion}"
                        styleClass="muyancho"/>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="#{msg.archivoAdjunto}:"/>
                </td>
                <td>
                    <p:fileUpload id="archivo"
                                     label="#{msg.archivoAdjunto}"
                                     fileUploadListener="#{notaManagedBean.cargarArchivo}"
                                     mode="advanced"
                                     multiple="false"
                                     auto="true"
                                     update="msgArchivo"
                                     allowTypes="/(\.|\/)(pdf|jpg|jpeg|bmp|png)$/"/>
                </td>
                <td>
                    <p:message  id="msgArchivo"
                                  for="archivo" initEffect="slide" changeEffect="clip"/>
                </td>
            </tr>
            <h:inputHidden value="#{notaManagedBean.id}"/>
        </ui:define>
    </ui:composition>
</html>
