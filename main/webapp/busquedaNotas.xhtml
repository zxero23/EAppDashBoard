<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="jakarta.faces.passthrough">
    <ui:composition template="/layout.xhtml">
        <ui:define name="content">
            <h:form title=" " id="formu">
                <div id="titulo" class="principal">
                    <h1>
                        <i class="pi pi-file-edit" style="margin-right: 8px; vertical-align: middle; color: #08446c;" aria-hidden="true"/>
                        <h:outputLabel value="#{msg.confBusquedaNota}"/>
                    </h1>
                </div>
                <h:panelGroup id="panelbusqueda" layout="block" styleClass="panelbusqueda">
                    <p:panel id="expPanelBusqueda" toggleable="true" toggleSpeed="500" collapsed="true" styleClass="panel-buttons">
                        <f:facet name="header">
                            <h:outputText value="#{msg.busqueda}"/>
                        </f:facet>
                        <h:panelGrid columns="2" cellspacing="4">
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.id}:"/>
                                <p:inputText id="idNotaBsq" value="#{busquedaNotaManagedBean.idNotaBsq}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.num}:"/>
                                <p:inputText id="nroNotaBsq" value="#{busquedaNotaManagedBean.nroNotaBsq}"/>
                            </h:panelGroup>
                        </h:panelGrid>
                        <h:panelGrid columns="2" cellspacing="4">
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.fechaDesde}:"/>
                                <p:datePicker id="fechaDesde"
                                               value="#{busquedaNotaManagedBean.fechaDesdeBsq}"
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false" renderAsPopup="true" 
                                               showButtonPanel="false" >
                                    <f:ajax />
                                </p:datePicker>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.fechaHasta}:"/>
                                <p:datePicker id="fechaHasta"
                                               value="#{busquedaNotaManagedBean.fechaHastaBsq}"
                                               timeZone="America/Argentina/Buenos_Aires"
                                               pattern="dd/MM/yyyy HH:mm" locale="es_AR"
                                               timeOnly="false"
                                               renderAsPopup="true"
                                               showButtonPanel="false" >
                                    <f:ajax />
                                </p:datePicker>
                            </h:panelGroup>
                        </h:panelGrid>
                        <h:panelGrid columns="1" cellspacing="2" style="width: 575px !important;">
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.referencia}:"/>
                                <p:inputText id="referenciaBsq" value="#{busquedaNotaManagedBean.referenciaBsq}"
                                           style="width: 565px !important;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.tipoAsunto}:"/>
                                <p:selectOneMenu id="tipoAsuntoBsq"
                                    value="#{busquedaNotaManagedBean.idTipoAsuntoBsq}"
                                    style="width: 575px !important;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{busquedaNotaManagedBean.selectItemsTipoAsunto}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.tipoIniciador}:"/>
                                <p:selectOneMenu id="tipoIniciadorBsq"
                                    value="#{busquedaNotaManagedBean.idTipoIniciadorBsq}"
                                    style="width: 575px !important;">
                                    <f:selectItem itemLabel="#{msg.elegir}" noSelectionOption="true" itemValue="#{null}"/>
                                    <f:selectItems value="#{busquedaNotaManagedBean.selectItemsTipoIniciador}" />
                                    <p:ajax process="@this"
                                            listener="#{busquedaNotaManagedBean.cargarIniciadoresSeleccionados}"
                                            update="iniciadorContainer" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.iniciador}:"/>
                                <h:panelGroup id="iniciadorContainer">
                                <p:selectOneMenu id="iniciadorBsq"
                                    value="#{busquedaNotaManagedBean.idIniciadorBsq}"
                                    disabled="#{busquedaNotaManagedBean.deshabilitarIniciador}"
                                    style="width: 575px !important;"
                                    placeholder="Nombre o código del iniciador"
                                    filter="true" filterMatchMode="contains">
                                    <f:selectItem itemLabel="#{msg.elegir}" noSelectionOption="true" itemValue="#{null}"/>
                                    <f:selectItems value="#{busquedaNotaManagedBean.selectItemsIniciador}" />
                                </p:selectOneMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.origen}:"/>
                                <p:selectOneMenu id="mesaOrigenBsq"
                                    value="#{busquedaNotaManagedBean.idMesaOrigen}"
                                    style="width: 575px !important;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{busquedaManagedBean.selectItemsMesa}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.destino}:"/>
                                <p:selectOneMenu id="mesaDestinoBsq"
                                    value="#{busquedaNotaManagedBean.idMesaDestino}"
                                    style="width: 575px !important;">
                                    <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                                    <f:selectItems value="#{busquedaManagedBean.selectItemsMesa}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGrid columns="2" cellspacing="2" cellpadding="2" >
                                <h:outputText id="textCheck" value="Consultar mesa origen/destino en historiales: " />
                                <p:selectBooleanCheckbox id="checkedHistorial" value="#{busquedaNotaManagedBean.consultarHistorial}">
                                    <f:ajax execute="@this" render="@this" />
                                </p:selectBooleanCheckbox>
                            </h:panelGrid>
                            <h:panelGroup>
                                <h:outputLabel value="#{msg.observacion}:"/>
                                <p:inputTextarea id="observacionBsq"
                                               value="#{busquedaNotaManagedBean.observacionBsq}"
                                               style="width:565px;"/>
                            </h:panelGroup>
                        </h:panelGrid>
                        <div class="panel-busqueda-botones">
                            <p:commandButton id="btnBuscar" value="#{msg.find}" actionListener="#{busquedaNotaManagedBean.aplicarFiltro()}" update="@form" process="@form"/>
                            <p:defaultCommand target="btnBuscar"/>
                            <p:commandButton value="#{msg.actualizar}" actionListener="#{busquedaNotaManagedBean.actualizar()}" update="@form" process="@form"/>
                        </div>
                    </p:panel>
                </h:panelGroup>
                <div style="display:inline-block;width:100%;"> 
                    <div style="float:right; width:50%; text-align:right">
                        <p:commandButton value="Imprimir Tabla" style="margin-right: 10px">
                            <p:dataExporter target="tablita" type="pdf" fileName="resultados"/>
                        </p:commandButton>
                    </div>                        
                </div>
                <div>
                    <p:dataTable id="tablita" value="#{busquedaNotaManagedBean.notas}" var="item" page="#{busquedaNotaManagedBean.page}" 
                                   lazy="true"
                                   rows="10"
                                   paginator="true"
                                   paginatorAlwaysVisible="true"
                                   paginatorPosition="bottom"
                                   paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
                                   rowsPerPageTemplate="10,20,30,50,100"
                                   emptyMessage="#{msg.emptyMessage}"
                                   currentPageReportTemplate="#{msg.pageReportTemplate}"
                                   rowIndexVar="row"
                                   >
                        <p:column style="width: 50px;"
                                    headerText="#{msg.id}">
                            <center>
                                <h:outputText value="#{item.id}"/>                                        
                            </center>                            
                        </p:column>
                        <p:column headerText="#{msg.num}">
                            <center>
                                <h:outputText value="#{item.nroNota}"/>
                            </center>                            
                        </p:column>
                        <p:column style="width: 90px;"
                                    headerText="#{msg.fechaCreacion}">
                            <center>
                                <h:outputText value="#{item.fechaCreacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputText>    
                            </center>                            
                        </p:column> 
                        <p:column style="width: 180px;"
                                    headerText="#{msg.iniciador}">                    
                            <h:outputText value="#{expedienteManagedBean.arreglarIniciador(item.iniciador.nombre)}"/>                                                          
                        </p:column>
                        <p:column headerText="#{msg.referencia}">
                            <h:outputText value="#{item.referencia}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.origen}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaOrigen)}"/>                                                          
                        </p:column>
                        <p:column style="width: 180px;" headerText="#{msg.destino}">
                            <h:outputText value="#{expedienteManagedBean.filtrarMesa(item.mesaDestino)}"/>                                                          
                        </p:column> 
                        <p:column headerText="Adjunto">
                            <h:panelGroup rendered="#{item.archivo==null}">
                                <center>
                                    <span class="pi pi-times" aria-hidden="true"/>
                                </center>
                            </h:panelGroup> 
                            <h:panelGroup rendered="#{item.archivo!=null}">
                                <center>
                                    <span class="pi pi-check" aria-hidden="true"/>
                                </center>
                            </h:panelGroup> 
                        </p:column>
                        <p:column id="acciones" headerText="#{msg.action}" style="width: 10%">
                            <!-- p:column exportable="false" -->
                            <h:panelGroup layout="block" styleClass="acciones-tabla">
                                <p:commandButton id="detalle"
                                                action="detalleNotaAvanzada"
                                                rendered="true"
                                                immediate="true"
                                                ajax="false"
                                                icon="pi pi-search"
                                                value=""
                                                title="#{msg.detalle}">
                                    <f:setPropertyActionListener target="#{busquedaNotaManagedBean.nota}" value="#{item}" />
                                </p:commandButton>
                                <p:commandButton id="borrarDialogbtn" rendered="#{busquedaNotaManagedBean.baja}"
                                                p:onclick="PF('borrarDialog').show();return false;"
                                                icon="pi pi-trash"
                                                value=""
                                                title="#{msg.eliminar}">
                                </p:commandButton>
                                <p:dialog id="borrarDialog"
                                                        widgetVar="borrarDialog"
                                                        binding="#{borrarDialog}"
                                                        header="#{msg.confirm}"
                                                        draggable="false">
                                    <p:outputLabel value="#{msg.msgDelete}"/>
                                    <h:panelGrid id="panelGridBusquedaAvanzadaNotas" columns="2" styleClass="panel-confirm-buttons">
                                        <p:commandButton id="yes_nota"
                                                        value="#{msg.acep}"
                                                        p:onclick="PF('borrarDialog').hide();"
                                                        action="#{busquedaNotaManagedBean.borrarNota()}">
                                            <f:setPropertyActionListener target="#{busquedaNotaManagedBean.nota}" value="#{item}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no_nota"
                                                        value="#{msg.cancel}"
                                                        p:onclick="PF('borrarDialog').hide();">
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </p:dialog>
                            </h:panelGroup>

                        </p:column>
                    </p:dataTable>
                </div>
                <p:ajaxStatus id="submitMonitorPage"/> 
            </h:form>
        </ui:define>
    </ui:composition>
</html>
