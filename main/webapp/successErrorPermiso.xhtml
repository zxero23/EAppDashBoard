<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formSuccessErrorPermisos" title=" ">
                <p:panel header="#{permisoManagedBean.title}">
                    <table border="0" cellspacing="5" class="panel-message">
                        <tr>
                            <td align="right">
                                <span class="#{permisoManagedBean.images}"></span>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{permisoManagedBean.msgSuccessError}" />
                            </td>                            
                        </tr> 
                    </table>                    
                    <div align="center"> 
                        <p:commandButton id="volver" action="administracion" actionListener="#{permisoManagedBean.limpiar()}" ajax="false">
                            <i class="pi pi-arrow-left" aria-hidden="true"></i>
                            #{msg.volver}
                        </p:commandButton> 
                    </div>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
