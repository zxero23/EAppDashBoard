<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="./layoutNuevo.xhtml">
        <ui:param name="tituloVentana" value="#{msg.newUsuario}"/>
        <ui:param name="miBean" value="#{usuarioManagedBean}"/>
        <ui:param name="actionListenerCrear" value="crear"/>
        <ui:param name="actionListenerCrearOtro" value="crearOtro"/>
        <ui:param name="actionListenerRefresh" value="limpiar"/>
        <ui:param name="actionVolver" value="usuarioConf"/>
        <ui:define name="loNuevo">
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.apellido}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="apellidoUsuario"
                        value="#{usuarioManagedBean.apellido}"
                        required="true" 
                        styleClass="ancho">
                        <f:ajax render="@this apellidoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="apellidoUsuarioError" for="apellidoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.nombre}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="nombreUsuario"
                        value="#{usuarioManagedBean.nombre}"
                        required="true" 
                        styleClass="ancho">
                        <f:ajax render="@this nombreUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="nombreUsuarioError" for="nombreUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) DNI:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="dniUsuario"
                        value="#{usuarioManagedBean.dni}"
                        required="true" 
                        min="0"
                        max="99999999"
                        size="8"
                        type="number"
                        styleClass="ancho"
                        maxlength="8">
                        <f:ajax render="@this dniUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="dniUsuarioError" for="dniUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.usuario}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="usuarioUsuario"
                        value="#{usuarioManagedBean.nombreUsuario}"
                        required="true"
                        validator="#{usuarioManagedBean.coincidenciaNombre}"
                        styleClass="ancho">
                        <f:ajax render="@this usuarioUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="usuarioUsuarioError" for="usuarioUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.correo}:" />
                </td>
                <td align="left">
                    <p:inputText
                        id="correoUsuario"
                        value="#{usuarioManagedBean.correo}"
                        required="true" 
                        validator="#{usuarioManagedBean.validarEmail}"
                        type="email"
                        styleClass="ancho">
                        <f:ajax render="@this correoUsuarioError" event="valueChange"/>
                    </p:inputText>
                </td>
                <td align="left">
                    <p:message id="correoUsuarioError" for="correoUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">                                
                    <h:outputLabel value="(*) #{msg.organismo}: " />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="orgUsuario"
                        style="width: 360px;"
                        value="#{usuarioManagedBean.idOrganismo}" >
                        <f:selectItem itemLabel="#{msg.elegir}" noSelectionOption="true"  itemValue="0"/>
                        <f:selectItems value="#{usuarioManagedBean.selectItemsOrganismo}" />
                        <f:ajax execute="@this" render="@this mesaUsuario" />
                    </p:selectOneMenu>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.mesa}:" />
                </td>
                <td align="left">
                    <p:selectOneMenu
                        id="mesaUsuario"
                        value="#{usuarioManagedBean.idMesa}"
                        required="true"
                        style="width: 360px !important;">
                        <f:selectItem  noSelectionOption="true"  itemValue="0"  itemLabel="#{msg.ninguno}"/>
                        <f:selectItems value="#{usuarioManagedBean.selectItemsMesa}" />
                        <f:ajax render="@this mesaUsuarioError" event="valueChange"/>
                    </p:selectOneMenu>
                </td>
                <td align="left">
                    <p:message id="mesaUsuarioError" for="mesaUsuario" initEffect="slide" changeEffect="fade"></p:message>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <h:outputLabel value="(*) #{msg.confGrupo}" />
                </td>
                <td align="left">
                    <h:selectManyListbox id="list" value="#{usuarioManagedBean.idItems}" size="10">
                        <f:selectItems value="#{usuarioManagedBean.selectItems}" />
                    </h:selectManyListbox>
                </td>
            </tr>   
            <ui:fragment rendered="#{usuarioManagedBean.asignarMesasDisponibles}" >
                <tr>
                    <td align="right">
                        <h:outputLabel value="(*) #{msg.mesasDisponibles}" />
                    </td>
                    <td align="left">
                        <h:selectManyListbox id="mesasDisponibles" value="#{usuarioManagedBean.idMesasDisponibles}" size="10">
                            <f:selectItems value="#{usuarioManagedBean.selectItemsMesasDisponibles}" />
                        </h:selectManyListbox>
                    </td>
                </tr>
            </ui:fragment>            
        </ui:define>
    </ui:composition>
</html>
