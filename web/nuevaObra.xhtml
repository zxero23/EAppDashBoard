<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevaObra" title=" ">
                <p:panel id="nuevaObra" header="#{msg.newObra}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Organismo:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltOrganismoObra" value="#{obrasManagedBean.idOrganismo}" label="organismo"  required="true" >
                                    <f:selectItems value="#{obrasManagedBean.selectItemsOrg}" /> 
                                    <p:ajax render="@this sltOrganismoObra sltOrganismoObraMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltOrganismoObraMsg" for="sltOrganismoObra" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>         
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Situacion:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltSituacion" value="#{obrasManagedBean.idSituacion}" label="situacion"  required="true">
                                    <f:selectItems value="#{obrasManagedBean.selectItems}" /> 
                                    <p:ajax render="@this sltSituacion sltSituacionMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltSituacionMsg" for="sltSituacion" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Localidad" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltLocalidad" value="#{obrasManagedBean.idLocalidad}" label="localidad"  required="true">
                                    <f:selectItems value="#{obrasManagedBean.selectItemsLocalidad}" /> 
                                    <p:ajax render="@this sltLocalidad sltLocalidadMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltLocalidadMsg" for="sltLocalidad" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Leyenda" />
                            </td>
                            <td align="left">
                                <p:inputText id="leyenda" label="leyenda" value="#{obrasManagedBean.leyenda}" required="true" size="53">
                                                                    
                                </p:inputText>
                            </td>
                        </tr>
                           
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Latitud" />
                            </td>
                            <td align="left">
                                <p:inputText id="latitud" label="#{msg.name}" value="#{obrasManagedBean.latitud}" required="true" size="53">
                                                                  
                                </p:inputText>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Longitud" />
                            </td>
                            <td align="left">
                                <p:inputText id="longitud" label="longitud" value="#{obrasManagedBean.longitud}" required="true" size="53">
                                                                  
                                </p:inputText>
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) FechaInicio" />
                            </td>
                            <td align="left">
                                <p:inputMask id="fechainicioObra" value="#{obrasManagedBean.fechaInicio}" mask="99/99/9999" required="true" size="45">
                                    <p:ajax render="@this fechainicioObra fechainicioObraMsg" event="blur"/>
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/> 
                                </p:inputMask>
                            </td>
                            <td align="left">
                                <p:message id="fechainicioObraMsg" for="fechainicioObra" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) FechaFinal" />
                            </td>
                            <td align="left">
                                <p:inputMask id="fechafinalObra" value="#{obrasManagedBean.fechaFinal}" mask="99/99/9999" required="true" size="45">
                                    <p:ajax render="@this fechafinalObra fechafinalObraMsg" event="blur"/>
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/> 
                                </p:inputMask>
                            </td>
                            <td align="left">
                                <p:message id="fechafinalObraMsg" for="fechafinalObra" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Archivo PDF Adjunto" />
                            </td>
                            <td align="left">
                                <p:fileUpload  id="adjunto" absolutePath="/home/DatosTablero" label="Archivo"
                                    fileEntryListener="#{obrasManagedBean.customValidator}"  
                                    useOriginalFilename="true"
                                    useSessionSubdir="false"
                                    autoUpload="false"
                                    multiple="false"
                                    class="inferior">
                                    <p:commandButton id="submitBtn" type="submit" value="Enviar Archivo" actionListener="#{obrasManagedBean.setearAdjunto(obrasManagedBean.adjunto)}"/>
                                </p:fileUpload>
                                    <p:inputText value="#{obrasManagedBean.adjunto}"/> <!-- Esto para que guarde el nombre del adjunto en la bd -->
                            </td>
                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Fotos" />
                            </td>
                            <td align="left">
                                
                                <p:fileUpload  id="adjuntoFotos" absolutePath="C:/home/DatosTablero" label="Archivo"
                                    fileEntryListener="#{obrasManagedBean.customValidatorFotos}"  
                                    useOriginalFilename="true"
                                    useSessionSubdir="false"
                                    autoUpload="false"
                                    multiple="true"
                                    class="inferior">
                                   
                                        
                                   
                                </p:fileUpload>
                                <p:panel rendered="#{obrasManagedBean.verBoton}">
                                    <p:commandButton value="cargar" rendered="#{obrasManagedBean.verBoton}">
                                
                                        <c:forEach var="i" begin="0" end="4">
                                             <p:inputText value="#{obrasManagedBean.fotos[i]}"/>
                                        </c:forEach>
                                    </p:commandButton>
                                </p:panel>
                                
                                     <!-- Esto para que guarde el nombre del adjunto en la bd -->
                            </td>
                            
                        </tr>
                        
                     </table>
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.save}" action="#{obrasManagedBean.crear()}"/>
                        <p:commandButton id="saveCreate" value="#{msg.saveCreate}" action="#{obrasManagedBean.crearOtro()}"/>
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="obrasConf" immediate="true" actionListener="#{obrasManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
