<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>.: CCPM :.</title>
        <link rel="stylesheet" href="css/cssCCPM.css" type="text/css"/>
        <link rel="shortcut icon" href="images/favicon.png"/>
        <link rel="stylesheet" type="text/css" href="css/style.css" />
        
       
    </h:head>
    <h:body>
        
       
        <f:loadBundle basename="org.ccpm.bienes.ui.labelsCCPM" var="msg"/>        
        <div id="top" class="banner-top" title=" ">

            <div align="right">
                <h:form id="loginForm"> 
                    <table cellspacing="5">
                        <tr>
                            <td>
                                <p:inputText id="user"
                                             placeholder="#{msg.ussT}"
                                             value="#{webManagedBean.nombreUsuario}"
                                             required="true"
                                             requiredMessage="Usuario requerido"/>
                            </td>
                            <td>
                                <p:password id="pass"
                                            placeholder="#{msg.passT}"
                                            value="#{webManagedBean.claveAcceso}"
                                            required="true"
                                            requiredMessage="Contraseña requerida"
                                            feedback="false"
                                            toggleMask="true"/>
                            </td>
                            <td>
                                <p:commandButton id="login"
                                                 value="#{msg.login}"
                                                 action="#{webManagedBean.login}"
                                                 ajax="false"/>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <p:message id="userMsg" for="user"/>
                            </td>
                            <td>
                                <p:message id="passMsg" for="pass"/>
                            </td>
                        </tr>                        
                    </table>
                    <p:defaultCommand target="login"/>
                </h:form>
            </div>

        </div>
     <div id="wowslider-container1">
	<div class="">
		<img src="images/yaguarete.JPEG" alt="8" title="8" id="wows1_0"/>
		
	</div>
	
	</div>			
        
        
        <div id="footer" class="footer-top" title=" ">
            <ui:include src="footer.xhtml"/>
        </div>  
        
    </h:body>
    
</html>
