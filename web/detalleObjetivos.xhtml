<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formDetalleObjetivo" title=" ">
                <ace:panel id="detalleObjetivo" header="#{msg.detailsObjetivo}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="#{msg.id}"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{objetivosManagedBean.objetivo.id}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <strong> <h:outputLabel value="#{msg.name}"/> </strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{objetivosManagedBean.objetivo.leyenda}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <strong> <h:outputLabel value="Organismo:"/> </strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{objetivosManagedBean.objetivo.organismo.leyenda}"/>
                            </td>                            
                        </tr>
                         <tr>
                            <td align="right">
                                <strong> <h:outputLabel value="Situación"/> </strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{objetivosManagedBean.objetivo.situacion.leyenda}"/>
                            </td>                            
                        </tr>
                         <tr>
                            <td align="right">
                                <strong> <h:outputLabel value="Descripción"/></strong>
                            </td>
                            <td align="left">
                                <h:outputText value="#{objetivosManagedBean.objetivo.descripcion}"/>
                            </td>                            
                        </tr>
                     </table>   
                    
                    <div align="center">                        
                        <ace:linkButton action="objetivosConf" value="- Volver -"/>
                    </div>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
