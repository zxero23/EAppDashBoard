<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevaIndicador" title=" ">
                <p:panel id="nuevaIndicador" header="#{msg.newIndicador}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                          
                         
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Metas" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltMetas" value="#{indicadorManagedBean.idMeta}" label="Metas"  required="true" style="width: 430px">
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{indicadorManagedBean.selectItemsMetas}" /> 
                                    <p:ajax render="@this sltMetas sltMetasMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltMetasMsg" for="sltMetas" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Leyenda" />
                            </td>
                            <td align="left">
                                <p:inputText id="leyenda" label="leyenda" value="#{indicadorManagedBean.leyenda}" required="true" size="53">
                                                                    
                                </p:inputText>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripción" />
                            </td>
                            <td align="left">
                                <p:inputText id="descripcion" label="#{msg.name}" value="#{indicadorManagedBean.descripcion}" required="true" size="53">
                                                                  
                                </p:inputText>
                            </td>
                        </tr>   
                       
                        
                     </table>
                    
                    <h:outputText value="Tamaño de Serie"   />
                    <p:inputText id="serieSize" value="#{indicadorManagedBean.serieSize}">
                            <p:ajax event="valueChange" render="@this serieSizeOutput panelSerie panelValores"/>
                        </p:inputText>
                    <p:panel id="panelSerie" header="SERIE">
                        <h:panelGrid  columns="5">
                            <c:forEach var="i" begin="0" end="#{indicadorManagedBean.serieSize-1}">  
                                <p:inputText id="serieSizeOutput" value="#{indicadorManagedBean.serie[i]}"/>
                            </c:forEach>
                        </h:panelGrid>
                    </p:panel>
                     <p:panel header="VARIABLE">
                        <h:panelGrid columns="3">
                                <p:inputText value="#{indicadorManagedBean.variableIndicador[0]}"/>
                                <p:inputText value="#{indicadorManagedBean.variableIndicador[1]}"/>
                                <p:inputText value="#{indicadorManagedBean.variableIndicador[2]}"/>
                        </h:panelGrid>
                    </p:panel>
                    <p:panel id="panelValores" header="VALORES">
                        <h:panelGrid columns="3">
                            <c:forEach var="i" begin="0" end="#{indicadorManagedBean.serieSize*3-1}">
                                <p:inputText value="#{indicadorManagedBean.valores[i]}"/>
                            </c:forEach>
                        </h:panelGrid>
                    </p:panel>
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.save}" action="#{indicadorManagedBean.crear()}"/>
                        <p:commandButton id="saveCreate" value="#{msg.saveCreate}" action="#{indicadorManagedBean.crearOtro()}"/>
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="indicadorConf" immediate="true" actionListener="#{indicadorManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
