<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formSituacion" title=" ">
                <p:panel id="SituacionPanelActualizar" header="#{msg.confSituacion}">
                      <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="situacionConf" actionListener="#{situacionManagedBean.actualizar}" value="#{msg.confSituacion}"/>
                            |
                        </h:panelGroup>

                        <h:panelGroup rendered="#{situacionManagedBean.alta}">
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevaSituacion" value="Nueva Situación"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:panel id="situacionPanelBusqueda" header="#{msg.busqueda}" toggleable="true" closeSpeed="200" class="panel-buttons">
                        <h:panelGrid  columns="3">
                            <p:inputText id="nombre" value="#{situacionManagedBean.leyendaBuscar}" label="#{msg.findley}" labelPosition="left"/>
                            <p:commandButton id="find" value="${msg.find}" actionListener="#{situacionManagedBean.aplicarFiltro}"/>
                            <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{situacionManagedBean.actualizar}"/>
                        </h:panelGrid>                     
                    </p:panel>

                    <p:dataTable id="SituacionDataTable" value="#{situacionManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                        <p:column id="id" headerText="#{msg.idT}" style="width: 7%">
                            <h:outputText id="cellId" value="#{item.id}"/>
                        </p:column>

                        <p:column id="nombre" headerText="#{msg.findley}">
                            <h:outputText id="cellNombre" value="#{item.leyenda}"/>
                        </p:column>

                        

                        <p:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <h:panelGrid  columns="3"> 
                                
                                <p:commandButton id="detalle"  action="detalleSituacion" actionListener="#{situacionManagedBean.verDetalle}" rendered="#{situacionManagedBean.detalle}">
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="editar"  action="editarSituacion" actionListener="#{situacionManagedBean.prepararParaEditar()}" rendered="#{situacionManagedBean.modificacion}">
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>
                                
                                <p:commandButton id="eliminar" rendered="#{situacionManagedBean.baja}" >
                                    <img src="images/symbolDeleteWhite.png" />                          
                                </p:commandButton>
                                <h:panelGroup id="confirmDialogSituacion" binding="#{confirmDialogSituacion}"
                                                        message="${msg.msgDelete}"
                                                        header="${msg.confirm}"
                                                        modal="true"
                                                        width="300"
                                                        height="155"
                                                        position="center">
                                    <h:panelGrid columns="2" class="panel-confirm-buttons">
                                        <p:commandButton id="yes" value="${msg.acep}"  actionListener="#{situacionManagedBean.guardarBorrado()}">
                                            <f:param name="id" value="#{item.id}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no" value="${msg.cancel}" >
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </h:panelGroup>

                            </h:panelGrid>
                        </p:column>                      
                    </p:dataTable>
                </p:panel>           
                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
