<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarUsuario" title=" ">
                <p:panel id="editarUsuario" header="Editar contraseña" class="panel-buttons">
                    <table>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Clave Actual:" />
                            </td>
                            <td align="left">
                                <p:inputText id="claveActual"  label="Clave Actual" value="#{usuarioManagedBean.passActual}" required="true" size="">
                                    <p:ajax render="@this claveActual claveActualMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="claveActualMsg" for="claveActual" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Clave nueva:" />
                            </td>
                            <td align="left">
                                <p:inputText id="claveNueva"  label="Clave Nueva" value="#{usuarioManagedBean.claveAcceso}" required="true" size="55">
                                    <p:ajax render="@this claveNueva claveNuevaMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="claveNuevaMsg" for="claveNueva" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Confirmar clave nueva:" />
                            </td>
                            <td align="left">
                                <p:inputText id="claveNuevaConfirmar"  label="Confirmar Clave Nueva" value="#{usuarioManagedBean.passConfirmar}" required="true" size="55">
                                    <p:ajax render="@this claveNuevaConfirmar claveNuevaConfirmarMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="claveNuevaConfirmarMsg" for="claveNuevaConfirmar" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{usuarioManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{usuarioManagedBean.guardarConfiguracion()}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="administracion" immediate="true" actionListener="#{usuarioManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
