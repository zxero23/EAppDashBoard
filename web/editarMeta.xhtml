<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarMeta" title=" ">
                <ace:panel id="editarMeta" header="#{msg.editMeta}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Objetivo:" />
                            </td>
                            <td align="left">
                                <ace:simpleSelectOneMenu id="sltObjetivo" value="#{metasManagedBean.idObjetivos}" label="organismo"  required="true">
                                    
                                    <f:selectItems value="#{metasManagedBean.selectItems}" /> 
                                    <ace:ajax render="@this sltObjetivo sltObjetivoMsg" event="blur"/> 
                                </ace:simpleSelectOneMenu>
                            </td>
                            <td align="left">
                                <ace:message id="sltObjetivoMsg" for="sltObjetivo" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Situacion:" />
                            </td>
                            <td align="left">
                                <ace:simpleSelectOneMenu id="sltSituacion" value="#{metasManagedBean.idSituacion}" label="situacion"  required="true">
                                    
                                    <f:selectItems value="#{metasManagedBean.selectItemsSituacion}" /> 
                                    <ace:ajax render="@this sltSituacion sltSituacionMsg" event="blur"/> 
                                </ace:simpleSelectOneMenu>
                            </td>
                            <td align="left">
                                <ace:message id="sltSituacionMsg" for="sltSituacion" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="leyenda" label="#{msg.name}" value="#{metasManagedBean.leyenda}" required="true" size="55">
                                    <ace:ajax render="@this leyenda leyendaMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="leyendaMsg" for="leyenda" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr> 
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripción" />
                            </td>
                            <td align="left">
                                <ace:textAreaEntry id="descripcionEditarMeta" label="#{msg.name}" value="#{metasManagedBean.descripcion}" required="true">
                                    <ace:ajax render="@this descripcionEditarMeta descripcionEditarMetaMsg" event="blur"/>                                
                                </ace:textAreaEntry>
                            </td>
                            <td align="left">
                                <ace:message id="descripcionEditarMetaMsg" for="descripcionEditarMeta" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Cantidad" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="cantidad" label="cantidad" value="#{metasManagedBean.cantidad}" required="true" size="53">
                                    <ace:ajax render="@this cantidad cantidadMsg" event="blur"/>                                
                                </ace:textEntry>
                                <h:outputLabel value="%" />
                                <ace:checkboxButton id="Reducir"  label="Reducir" value="#{metasManagedBean.reduccion}">
                                    <ace:ajax execute="@this" render="@this"/>
                                </ace:checkboxButton>
                                
                                <ace:checkboxButton id="Aumentar" label="Aumentar" value="#{metasManagedBean.aumentar}">
                                    <ace:ajax execute="@this" render="@this"/>
                                </ace:checkboxButton>    
                            </td>
                            <td align="left">
                                <ace:message id="cantidadMsg" for="cantidad" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) FechaInicio" />
                            </td>
                            <td align="left">
                                <ace:maskedEntry id="fechainicio" value="#{metasManagedBean.fechaInicio}" mask="99/99/9999">
                                    <ace:ajax render="@this fechainicio fechainicioMsg" event="blur"/> 
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/> 
                                </ace:maskedEntry>
                            </td>
                            <td align="left">
                                <ace:message id="fechainicioMsg" for="fechainicio" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) FechaFinal" />
                            </td>
                            <td align="left">
                                <ace:maskedEntry id="fechafinal" value="#{metasManagedBean.fechaFinal}" mask="99/99/9999">
                                    <ace:ajax render="@this fechafinal fechafinalMsg" event="blur"/>
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/> 
                                </ace:maskedEntry>
                            </td>
                            <td align="left">
                                <ace:message id="fechafinalMsg" for="fechafinal" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{metasManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <ace:pushButton id="save" value="#{msg.saveEdit}" action="#{metasManagedBean.guardarEdicion}"/>                        
                        <ace:pushButton id="cancel" value="#{msg.cancel}" action="metasConf" immediate="true" actionListener="#{metasManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
