        <link rel="shortcut icon" href="images/favicon.png"/>
        <script type="text/javascript">
            (function () {
                if (!window.console) {
                    return;
                }
                var originalError = window.console.error;
                if (typeof originalError !== "function") {
                    return;
                }
                window.console.error = function () {
                    var firstArg = arguments.length > 0 ? String(arguments[0]) : "";
                    if (firstArg.indexOf("During update: javax.faces.ViewState not found") !== -1) {
                        return;
                    }
                    return originalError.apply(window.console, arguments);
                };
            })();
        </script>
    </h:head>
    <h:body>       
        <f:loadBundle basename="org.ccpm.bienes.ui.labelsCCPM" var="msg"/>

         </div>
        <div id="footer" class="footer-top" title=" ">
