<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarMenu" title=" ">
                <p:panel id="editarMenu" header="#{msg.editMenu}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.nameMenuPadre}" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="selectMenuEdit" value="#{menuManagedBean.idMenuPadre}" label="#{msg.nameMenuPadre}" required="true">
                                    <f:selectItems value="#{menuManagedBean.selectItems}" />
                                    <p:ajax render="@this selectMenuEdit selectMenuEditMsg" event="blur"/>  
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="selectMenuEditMsg" for="selectMenuEdit" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="nombre" label=" #{msg.name}" value="#{menuManagedBean.nombre}" required="true" size="55">
                                    <p:ajax render="@this nombre nombreMsg" event="blur"/>                                
                                </p:inputText>   
                            </td>
                            <td align="left">
                                <p:message id="nombreMsg" for="nombre" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                    </table>
                    
                    <h:inputHidden value="#{menuManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{menuManagedBean.guardarEdicion}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="menuConf" immediate="true" actionListener="#{menuManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
