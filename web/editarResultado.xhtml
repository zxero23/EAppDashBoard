<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarResultado" title=" ">
                <p:panel id="editarResultado" header="#{msg.editResultado}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="anio" label="#{msg.name}" value="#{resultadoManagedBean.anio}" required="true" size="55">
                                    <p:ajax render="@this anio anioMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="anioMsg" for="anio" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Trimestre" />
                            </td>
                            <td align="left">
                                <p:inputText id="cuatrimestre" label="Trimestre" value="#{resultadoManagedBean.cuatrimestre}" required="true" size="55">
                                    <p:ajax render="@this cuatrimestre cuatrimestreMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="cuatrimestreMsg" for="cuatrimestre" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                       
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Porcentaje " />
                            </td>
                            <td align="left">
                                <p:inputText id="porcentaje" label="porcentaje" value="#{resultadoManagedBean.porcentaje}" required="true" size="55">
                                    <p:ajax render="@this porcentaje porcentajeMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="porcentajeMsg" for="porcentaje" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{resultadoManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{resultadoManagedBean.guardarEdicion}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="resultadoConf" immediate="true" actionListener="#{resultadoManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
