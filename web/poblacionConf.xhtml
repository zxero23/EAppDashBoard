<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formPoblacion" title=" ">
                <p:panel id="PoblacionPanelActualizar" header="Población Info">
                      <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="poblacionConf" actionListener="#{poblacionManagedBean.actualizar}" value="Población Info"/>
                            |
                        </h:panelGroup>

                          <h:panelGroup rendered="#{poblacionManagedBean.alta}" >
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevaPoblacion" value="Nueva Poblacion"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:panel id="poblacionPanelBusqueda" header="#{msg.busqueda}" toggleable="true" closeSpeed="200" class="panel-buttons">
                        <h:panelGrid  columns="3">
                            <p:inputText id="nombre" value="#{poblacionManagedBean.anioBuscar}" label="Año" labelPosition="left"/>
                            <p:commandButton id="find" value="${msg.find}" actionListener="#{poblacionManagedBean.aplicarFiltro()}"/>
                            <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{poblacionManagedBean.actualizar}"/>
                        </h:panelGrid>                     
                    </p:panel>

                    <p:dataTable id="PoblacionDataTable" value="#{poblacionManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                        <p:column id="id" headerText="#{msg.idT}" style="width: 7%">
                            <center>
                                <h:outputText id="cellId" value="#{item.id}"/>
                            </center>
                        </p:column>

                        <p:column id="anio" headerText="Año">
                            <center>
                                <h:outputText id="cellAnio" value="#{item.anio}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="cuatrimestre" headerText="Trimestre Nº">
                            <center>
                                <h:outputText id="cellCuatrimestre" value="#{item.cuatrimestre}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="totalDeHogares" headerText="Total de Hogares por Debajo de La Canasta Básica">
                            <center>
                                <h:outputText id="celltotalDeHogares" value="#{item.totalDeHogares}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="total" headerText="Total de Hogares">
                            <center>
                                <h:outputText id="celltotal" value="#{item.total}"/>
                            </center>
                        </p:column>
                        
                        
                        
                        


                                              
                        

                        <p:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <h:panelGrid  columns="3"> 
                                
                                <p:commandButton id="detalle" action="detallePoblacion" actionListener="#{poblacionManagedBean.verDetalle}" rendered="#{poblacionManagedBean.detalle}">
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="editar" action="editarPoblacion" actionListener="#{poblacionManagedBean.prepararParaEditar()}" rendered="#{poblacionManagedBean.modificacion}">
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>
                                
                                <p:commandButton id="eliminar"  rendered="#{poblacionManagedBean.baja}" >
                                    <img src="images/symbolDeleteWhite.png" /> 
                                </p:commandButton>
                                <h:panelGroup id="confirmDialogPoblacion" binding="#{confirmDialogPoblacion}"
                                                        message="${msg.msgDelete}"
                                                        header="${msg.confirm}"
                                                        modal="true"
                                                        width="300"
                                                        height="155"
                                                        position="center">
                                    <h:panelGrid columns="2" class="panel-confirm-buttons">
                                        <p:commandButton id="yes" value="${msg.acep}"  actionListener="#{poblacionManagedBean.guardarBorrado()}">
                                            <f:param name="id" value="#{item.id}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no" value="${msg.cancel}" >
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </h:panelGroup>

                            </h:panelGrid>
                        </p:column> 
                        
                        
                            
                        
                        
                    </p:dataTable>
                </p:panel>
               
                
                </h:form>
            
           
            
            
        </ui:define>
    </ui:composition>
</html>
