<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarOrganismo" title=" ">
                <p:panel id="editarOrganismo" header="#{msg.editOrganismo}">
                    <table border="0" cellspacing="5" class="panel-buttons">                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Cod. Organismo:" />
                            </td>
                            <td align="left">
                                <p:inputText id="codigo" label="código" value="#{organismoManagedBean.codOrganigrama}" required="true" size="53">
                                    <p:ajax render="@this codigo codigoMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="codigoMsg" for="codigo" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="nombre" label="#{msg.name}" value="#{organismoManagedBean.leyenda}" required="true" size="53">
                                    <p:ajax render="@this nombre nombreMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="nombreMsg" for="nombre" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.descri}" />
                            </td>
                            <td align="left">
                                <p:inputText id="descripcion"  label="#{msg.descri}" value="#{organismoManagedBean.descripcion}" required="true" size="53">
                                    <p:ajax render="@this descripcion descripcionMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="descripcionMsg" for="descripcion" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) ¿Realiza Obras?" />
                            </td>
                            <td align="left">
                                <p:selectBooleanButton id="descentralizado"  value="#{organismoManagedBean.descentralizado}"/>
                            </td>
                            <td align="left">
                                <p:message id="descentralizadoMsg" for="descentralizado" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                     </table>
                    
                    <h:inputHidden value="#{organismoManagedBean.id}" />
                     
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{organismoManagedBean.guardarEdicion}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="organismoConf" immediate="true" actionListener="#{organismoManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
