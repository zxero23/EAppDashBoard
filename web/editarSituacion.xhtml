<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarSituacion" title=" ">
                <p:panel id="editarSituacion" header="#{msg.editSituacion}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        
                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="leyenda" label="#{msg.name}" value="#{situacionManagedBean.leyenda}" required="true" size="53">
                                    <p:ajax render="@this leyenda leyendaMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="leyendaMsg" for="leyenda" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        
                     </table>                   
                    
                    <h:inputHidden value="#{situacionManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{situacionManagedBean.guardarEdicion}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="situacionConf" immediate="true" actionListener="#{situacionManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
