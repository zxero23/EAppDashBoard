<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formActividades" title=" ">
                <p:panel id="ActividadesPanelActualizar" header="#{msg.confActividades}">
                    <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="actividadesConf" actionListener="#{actividadesManagedBean.actualizar}" value="#{msg.confActividades}"/>
                            |
                        </h:panelGroup>

                        <h:panelGroup rendered="#{actividadesManagedBean.alta}">
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevaActividades" value="#{msg.newActividades}"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:panel id="actividadesPanelBusqueda" header="#{msg.busqueda}" toggleable="true" closeSpeed="200" class="panel-buttons">
                        <h:panelGrid  columns="3">
                            <p:inputText id="nombre" value="#{actividadesManagedBean.leyenda}" label="#{msg.msjO}" labelPosition="left"/>
                            <p:commandButton id="find" value="${msg.find}" actionListener="#{actividadesManagedBean.aplicarFiltro}"/>
                            <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{actividadesManagedBean.actualizar}"/>
                        </h:panelGrid>                     
                    </p:panel>

                    <p:dataTable id="ActividadesDataTable" value="#{actividadesManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                        <p:column id="id" headerText="#{msg.idT}" style="width: 7%">
                            <h:outputText id="cellId" value="#{item.id}"/>
                        </p:column>

                        <p:column id="nombre" headerText="#Actividad">
                            <h:outputText id="cellNombre" value="#{item.leyenda}"/>
                        </p:column>

                        <p:column id="descripcion" headerText="Meta">
                            <h:outputText id="cellDescripcion" value="#{item.metas.leyenda}"/>
                        </p:column>
                        
                        <p:column id="cantidad" headerText="cantidad">
                            <h:outputText id="cellCantidad" value="#{item.cantidad}"/>
                        </p:column>
                        
                                                
                        

                        <p:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <h:panelGrid  columns="3"> 
                                                       
                                
                                <p:commandButton  id="detalle"  action="detalleObjetivo" actionListener="#{actividadesManagedBean.verDetalle}" rendered="#{actividadesManagedBean.detalle}" >
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:pushButton >

                                <p:commandButton id="editar"  action="editarObjetivo" actionListener="#{actividadesManagedBean.prepararParaEditar()}" rendered="#{actividadesManagedBean.modificacion}" immediate="true"  >
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>
                                
                                <p:commandButton id="eliminar"  rendered="#{actividadesManagedBean.baja}"  >
                                <img src="images/symbolDeleteWhite.png" />
                                </p:commandButton>
                                                               
                                <h:panelGroup id="confirmDialogActividades" binding="#{confirmDialogActividades}"
                                                        message="${msg.msgDelete}"
                                                        header="${msg.confirm}"
                                                        modal="true"
                                                        width="300"
                                                        height="155"
                                                        position="center">
                                    <h:panelGrid columns="2" class="panel-confirm-buttons">
                                        <p:commandButton id="yes" value="${msg.acep}"  actionListener="#{actividadesManagedBean.guardarBorrado()}">
                                            <f:param name="id" value="#{item.id}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no" value="${msg.cancel}" >
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </h:panelGroup>

                            </h:panelGrid>
                        </p:column> 
                        
                        <p:column id="graficoActividades" headerText="estado" style="width: 15%">
                             <p:chart id="chart" animated="true" value="#{chartGaugeBean.gaugeData}" />
                        </p:column>
                        
                        
                    </p:dataTable>
                </p:panel>           
                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
