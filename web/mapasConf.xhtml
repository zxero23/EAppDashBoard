<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevaMapas" title=" ">
                <ace:panel id="nuevaMapas" header="Mapas">
                    <table border="0" cellspacing="5" class="panel-buttons" width="800">
                        <tr style="width: 800px">
                            <td align="right" width="800" style="width: 800px">
                                <ace:gMap id="gMapLayer" rendered="false" style="width: 1024px; height: 720px" zoomLevel="8" latitude="-27.39" longitude="-55.98">
                                    <ace:gMapLayer id="KMLLayer" layerType="KML" visible="TRUE" url="${gMapLayerBean.kmlURL}"/>
                                </ace:gMap>
                            </td>                            
                        </tr>                        
                     </table>
                    <ace:panel id="kmlinputs" header="KML layer inputs" closable="false" toggleable="false" collapsed="false" visible="TRUE">
                        <h:outputLabel for="kmlLayer" value="Options for KML"/>
                        <h:inputText id="kmlLayer" value="${gMapLayerBean.kmlURL}" size="60">
                            <f:ajax render="@all"/>
                        </h:inputText>
                        
                        <h:commandButton value="Submit" type="submit"/>
                    </ace:panel>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
