<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formDetalleMetas" title=" ">
                <p:panel id="detalleMetas" header="Detalle Meta">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="#{msg.id}"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.id}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="#{msg.name}"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.leyenda}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                               <strong> <h:outputLabel value="Descripción"/></strong>
                            </td>
                            <td align="left">
                                <h:outputText value="#{metasManagedBean.metas.descripcion}"/>
                            </td>                            
                        </tr>
                         <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Situacion:"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.situacion.leyenda}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Objetivo:"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.objetivos.leyenda}"/>
                            </td>                            
                        </tr>
                          <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Organismo:"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.objetivos.organismo.leyenda}"/>
                            </td>                            
                        </tr>
                        
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Porcentaje de #{metasManagedBean.metas.reduccion?'reducción':'aumento'}"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.cantidad} %"/>
                                    
                            </td>                            
                        </tr>
                        
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Fecha de Inicio:"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.fechaInicio}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>    
                                </h:outputLabel>
                            </td>                            
                        </tr>
                         <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Fecha Final:"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{metasManagedBean.metas.fechaFinal}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>    
                                </h:outputLabel>
                            </td>                            
                        </tr>
                     </table>   
                    
                    <div align="center">                        
                        <p:commandLink action="metasConf" value="- Volver -"/>
                    </div>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
