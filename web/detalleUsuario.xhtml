<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formDetalleUs" title=" ">
                <ace:panel id="detalleTipoBien" header="#{msg.detailsUsuario}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.id}"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.id}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Apellido:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.apellido}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.name}"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.nombre}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Usuario:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.uss}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Contraseña:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.pass}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Correo Electrónico:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.email}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Fecha Alta:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.fechaAlta}">
                                 <f:convertDateTime pattern="dd/mm/yyyy"/>
                                </h:outputLabel>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Fecha Modificación:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.fechaModif}">
                                    <f:convertDateTime pattern="dd/mm/yyyy"/>
                                </h:outputLabel>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Último Login:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{usuarioManagedBean.ultimoLogin}">
                                    <f:convertDateTime pattern="dd/mm/yyyy"/>
                                </h:outputLabel>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Grupos:"/>
                            </td>
                            <td align="left">
                                <ace:dataTable id="GrupoPanelDataTable" value="#{usuarioManagedBean.lstGrupos}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">

                                    <ace:column id="id" headerText="#{msg.idT}" style="width: 7%">
                                        <h:outputText id="cellId" value="#{item.id}"/>
                                    </ace:column>

                                    <ace:column id="nombre" headerText="#{msg.nameT}">
                                        <h:outputText id="cellNombre" value="#{item.nombre}"/>
                                    </ace:column>
                                                  
                                </ace:dataTable>
                            </td>                            
                        </tr>
                     </table>   
                    
                    <div align="center">                        
                        <ace:linkButton action="usuarioConf" value="- Volver -"/>
                    </div>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
