<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">    
    <ui:composition>
        <div align="right">
            <h:form title=" ">
                
                     
                        <img src="#{webManagedBean.usuario.foto}" align="absmiddle" alt="" width="30px" hspace="5" class="img-circle"/>
                        <h:outputText value="#{webManagedBean.usuario.nombre}" style="margin-right:0.5%"/>
                        <h:outputText value="#{webManagedBean.usuario.apellido}" style="margin-right:0.5%"/>
                        <h:outputText value="#{webManagedBean.nombreGrupo}" style="margin-right:0.5%"/>
                        <h:outputText value="|"/>
                    
                <img src="images/symbolHome.png" align="absmiddle" alt="" width="20px" hspace="5" class="img-circle"/>
                <h:commandLink action="administracion" immediate="true" value="Home" style="margin-right:0.5%"/>
                <img src="images/configTool.png" align="absmiddle" alt="" hspace="5"/>
                <h:commandLink action="configuracionConf" actionListener="#{usuarioManagedBean.prepararParaEditarContrasena}"  immediate="true" value="Usuario/Contraseña" style="margin-right:0.5%"/>
                <h:outputText value="|"/>
                <img src="images/logout.png" align="absmiddle" alt="" hspace="5"/>
                <h:commandLink action="index" immediate="true" value="Salir" actionListener="#{webManagedBean.logout}" style="margin-right:0.9%"/>
                 
                
            </h:form>
        </div>
    </ui:composition>
</html>
