<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarIndicador" title=" ">
                <ace:panel id="editarIndicador" header="#{msg.editIndicador}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="leyenda" label="#{msg.name}" value="#{indicadorManagedBean.leyenda}" required="true" size="55">
                                    <ace:ajax render="@this leyenda leyendaMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="leyendaMsg" for="leyenda" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripción" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="descripcion" label="descripcion" value="#{indicadorManagedBean.descripcion}" required="true" size="55">
                                    <ace:ajax render="@this descripcion descripcionMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="descripcionMsg" for="descripcion" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                      
                        
                    
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Tamaño de Serie" />
                            </td>
                            <td align="left">
                                 <ace:textEntry id="serieSize" value="#{indicadorManagedBean.serieSize}">
                                    <ace:ajax event="valueChange" render="@this serieSizeOutput panelSerie panelValores"/>
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="serieSizeMsg" for="serieSize" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                    
                    </table> 
                     
                    <ace:panel id="panelSerie" header="SERIE">
                        <h:panelGrid  columns="5">
                            <c:forEach var="i" begin="0" end="#{indicadorManagedBean.serieSize-1}">  
                                <ace:textEntry id="serieSizeOutput" value="#{indicadorManagedBean.serie[i]}"/>
                            </c:forEach>
                        </h:panelGrid>
                    </ace:panel>
                     <ace:panel header="VARIABLE">
                        <h:panelGrid columns="3">
                                <ace:textEntry value="#{indicadorManagedBean.variableIndicador[0]}"/>
                                <ace:textEntry value="#{indicadorManagedBean.variableIndicador[1]}"/>
                                <ace:textEntry value="#{indicadorManagedBean.variableIndicador[2]}"/>
                        </h:panelGrid>
                    </ace:panel>
                    <ace:panel id="panelValores" header="VALORES">
                        <h:panelGrid columns="3">
                            <c:forEach var="i" begin="0" end="#{indicadorManagedBean.serieSize*3-1}">
                                <h:inputText value="#{indicadorManagedBean.valores[i]}"/>
                            </c:forEach>
                        </h:panelGrid>
                    </ace:panel>
                    
                    <h:inputHidden value="#{indicadorManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <ace:pushButton id="save" value="#{msg.saveEdit}" action="#{indicadorManagedBean.guardarEdicion}"/>                        
                        <ace:pushButton id="cancel" value="#{msg.cancel}" action="indicadorConf" immediate="true" actionListener="#{indicadorManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
