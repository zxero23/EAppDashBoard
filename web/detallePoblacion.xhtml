<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formDetallePoblacion" title=" ">
                <p:panel id="detallePoblacion" header="Detalle Población">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="#{msg.id}"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{poblacionManagedBean.id}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Año:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{poblacionManagedBean.anio}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Trimestre:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{poblacionManagedBean.cuatrimestre}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Total de Hogares Por debajo de la Canasta Basica:"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{poblacionManagedBean.totalDeHogares}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="Total de Hogares :"/>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{poblacionManagedBean.total}"/>
                            </td>                            
                        </tr>
                        
                     </table>   
                    
                    <div align="center">                        
                        <p:commandLink action="poblacionConf" value="- Volver -"/>
                    </div>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
