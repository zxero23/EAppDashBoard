<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">      
    <h:head>
        <title>.: CCPM :.</title>
        <link rel="stylesheet" href="css/cssCCPM.css" type="text/css"/>
        <link rel="shortcut icon" href="images/favicon.png"/>
    </h:head>
    <h:body>       
        <f:loadBundle basename="org.ccpm.bienes.ui.labelsCCPM" var="msg"/> 
        <div id="top" class="banner-top" title=" ">
            
        </div>
        <div id="globalNav" class="globalNav" title=" ">
            
        </div>  
        <div id="content" class="content" title=" ">
            <p:panel id="nuevaEmpresa" header="ENTRAR EN TABLERO-CCPM">
                <p>
                    <h:outputLabel value="Vuelve a ingresar tu contraseña." />
                </p>
                <h:outputLabel value="#{webManagedBean.msgSuccessError}"/>
                <br/>
                <h:outputLabel value="¿Olvidaste tu contraseña? Solicita una nueva."/>
                <h:form id="formSuccessErrorLogin" title=" ">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.uss}" />
                            </td>
                            <td align="left">
                                <p:inputText id="uss"
                                             value="#{webManagedBean.nombreUsuario}"
                                             required="true"
                                             requiredMessage="Usuario requerido"/>
                            </td>
                            <td align="left">
                                <p:message id="usMsg" for="uss"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.pass}" />
                            </td>
                            <td align="left">
                                <p:password id="pass"
                                            value="#{webManagedBean.claveAcceso}"
                                            required="true"
                                            requiredMessage="Contraseña requerida"
                                            feedback="false"
                                            toggleMask="true"/>
                            </td>
                            <td align="left">
                                <p:message id="passMsg" for="pass"/>
                            </td>
                        </tr>
                    </table>
                    <table border="0" cellspacing="5">
                        <tr>                            
                            <td>
                                <p:commandButton id="save" action="#{webManagedBean.login}" value="Iniciar sesión" ajax="false"/>
                            </td>                            
                        </tr>
                    </table>
                </h:form>
            </p:panel>                
        </div>
        <div id="footer" class="footer-top" title=" ">
            <ui:include src="footer.xhtml"/>
        </div>        
    </h:body>
</html>
