<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formUsuarioMenu" title=" ">
                <p:panel id="usuarioMenu" header="Editar Menú de Usuarios">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Usuarios:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="slmGrupos" value="#{permisoManagedBean.idUsuario}" valueChangeListener="#{permisoManagedBean.updateListMenuUsuario}" immediate="true" required="true">                                                         
                                    <f:selectItem itemLabel="ELEGIR" itemValue=""/>
                                    <f:selectItems value="#{permisoManagedBean.selectItemsUsuario}" />
                                    <p:ajax execute="@this" />
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="slmGruposMsg" for="slmGrupos" initEffect="slide" changeEffect="shake"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Menú:" />
                            </td>
                            <td align="left">
                                <h:panelGroup id="dualListControl" position="MIDDLE">
                                    <f:facet name="header">
                                        <h:outputLabel value="Menú Disponibles" style="margin-right: 20px; margin-left: 20px;"/>
                                    </f:facet>
                                    <f:facet name="header">
                                        <h:outputLabel value="Menú Seleccionadas" style="margin-right: 20px; margin-left: 20px;"/>
                                    </f:facet>
                                    
                                    <h:panelGroup id="firstList" value="#{permisoManagedBean.itemsDerecha}"
                                              styleClass="subList"
                                              dropGroup="textGroup"
                                              selectionMode="multiple"
                                              />

                                    <h:panelGroup id="secondList" value="#{permisoManagedBean.itemsIzquierda}"
                                              styleClass="subList"
                                              dropGroup="textGroup"
                                              selectionMode="multiple"
                                              />
                                </h:panelGroup>
                            </td>
                        </tr>
                    </table>
                    
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{permisoManagedBean.editarUsuarioMenu()}"/>
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="administracion" immediate="true" actionListener="#{permisoManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
