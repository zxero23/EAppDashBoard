<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:ui="jakarta.faces.facelets">
    <ui:composition>
        <div style="width:99.5%;padding:6px 8px;background:#f4f6f8;border:1px solid #d7dde5;">
            <c:forEach items="#{webManagedBean.menu}" var="item">
                <h:outputLink value="#{request.contextPath}/faces/#{item.link}.xhtml" style="margin-right:14px;font-weight:bold;text-decoration:none;color:#2c3e50;">
                    #{item.nombre}
                </h:outputLink>
                <c:forEach items="#{item.menus}" var="subItem">
                    <h:outputLink value="#{request.contextPath}/faces/#{subItem.link}.xhtml" style="margin-right:12px;text-decoration:none;color:#2c3e50;">
                        #{subItem.nombre}
                    </h:outputLink>
                </c:forEach>
            </c:forEach>
        </div>
    </ui:composition>
</html>
