<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarUsuario" title=" ">
                <p:panel id="editarUsuario" header="#{msg.editUsuario}">
                    <table border="1" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Organismo:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltOrganismoUsuario" value="#{usuarioManagedBean.idOrganismo}" label="organismo"  required="true">
                                    <f:selectItems value="#{usuarioManagedBean.selectItemsOrg}" /> 
                                    <p:ajax render="@this sltOrganismoUsuario sltOrganismoUsuarioMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltOrganismoMsgUsuario" for="sltOrganismoUsuario" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Apellido:" />
                            </td>
                            <td align="left">
                                <p:inputText id="apellido" label="apellido" value="#{usuarioManagedBean.apellido}" required="true" size="55">
                                    <p:ajax render="@this apellido apellidoMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="apellidoMsg" for="apellido" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="nombre"  label="#{msg.name}" value="#{usuarioManagedBean.nombre}" required="true" size="55">
                                    <p:ajax render="@this nombre nombreMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="nombreMsg" for="nombre" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Usuario:" />
                            </td>
                            <td align="left">
                                <p:inputText id="uss"  label="usuario" value="#{usuarioManagedBean.uss}" required="true" size="55">
                                    <p:ajax render="@this uss ussMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="ussMsg" for="uss" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Contraseña:" />
                            </td>
                            <td align="left">
                                <p:inputText id="pass"  label="contraseña" value="#{usuarioManagedBean.pass}" required="true" size="55">
                                    <p:ajax render="@this pass passMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="passMsg" for="pass" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Correo Electrónico:" />
                            </td>
                            <td align="left">
                                <p:inputText id="email" label="email" value="#{usuarioManagedBean.email}" required="true" size="55">
                                    <p:ajax render="@this email emailMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="emailMsg" for="email" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Grupos:" />
                            </td>
                            <td align="left">
                                <h:panelGroup id="dualListControl" position="MIDDLE">                   

                            <h:panelGroup id="firstList" value="#{usuarioManagedBean.selecteditemsDerecha}"
                                      styleClass="subList"
                                      dropGroup="textGroup"
                                      selectionMode="multiple"
                                      />

                            <h:panelGroup id="secondList" value="#{usuarioManagedBean.selecteditemsIzquierda}"
                                      styleClass="subList"
                                      dropGroup="textGroup"
                                      selectionMode="multiple"
                                      />
                        </h:panelGroup>
                            </td>
                            <td align="left">
                               
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{usuarioManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{usuarioManagedBean.guardarEdicion}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="usuarioConf" immediate="true" actionListener="#{usuarioManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
