<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formDetalleObra" title=" ">
                <p:panel id="detalleObra" header="#{msg.detailsObra}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="#{msg.name}"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{obrasManagedBean.obras.leyenda}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Situación"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{obrasManagedBean.obras.situacion.leyenda}"/>
                            </td>                            
                        </tr>
                         <tr>
                            <td align="right">
                                <strong><h:outputLabel value="latitud"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{obrasManagedBean.obras.latitud}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="longitud"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{obrasManagedBean.obras.longitud}"/>
                            </td>                            
                        </tr>
                        <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Fecha de Inicio:"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{obrasManagedBean.obras.fechaInicio}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>    
                                </h:outputLabel>
                            </td>                            
                        </tr>
                         <tr>
                            <td align="right">
                                <strong><h:outputLabel value="Fecha Final:"/></strong>
                            </td>
                            <td align="left">
                                <h:outputLabel value="#{obrasManagedBean.obras.fechaFinal}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>    
                                </h:outputLabel>
                            </td>                            
                        </tr>
                        
                    
                        
                     </table>
                    
                    <p:panel id="panelAdjunto" header="Archivo Adjunto">
                        <h:outputText value="" />
                    </p:panel>
                    
                    
                    
                </p:panel>
                <h:panelGroup id="stack1" selectedId="stackPane1">
                <h:panelGroup id="stackPane1" client="true" > <!-- Siempre se pone el mapa en un container con propiedad client-->
                    <p:panel id="panel1" header="Mapa">
                        <h:panelGroup id="gMapLayer"  style="width: 475px; height: 400px" zoomLevel="7" latitude="-26.8250059" 
                                  longitude="-55.970294" >
                            <h:panelGroupMarker latitude="#{obrasManagedBean.obras.latitud}" 
                                            longitude="#{obrasManagedBean.obras.longitud}">
                                        </h:panelGroup>
                        </h:panelGroup>
                    </p:panel>
                </h:panelGroup>
              </h:panelGroup>
                
              <h:panelGrid id="buttonGrid" columns="1" class="panel-buttons">                     
                        <p:commandButton id="VolverObra" value="Volver" action="obrasConf" immediate="true" />
              </h:panelGrid>
                 </h:form>  
          
                                  
                        
                    
                
           
        </ui:define>
    </ui:composition>
</html>
