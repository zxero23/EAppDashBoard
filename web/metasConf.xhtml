<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formMetas" title=" ">
                <p:panel id="MetasPanelActualizar" header="#{msg.confMeta}">
                    <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="metasConf" actionListener="#{metasManagedBean.actualizar}" value="#{msg.confMeta}"/>
                            |
                        </h:panelGroup>

                        <h:panelGroup rendered="#{metasManagedBean.alta}">
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevaMeta" value="Nueva Meta"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:panel id="metasPanelBusqueda" header="#{msg.busqueda}"  collapsed="TRUE" toggleable="true" toggleSpeed="200" class="panel-buttons">
                        <h:panelGrid  columns="2" cellspacing="5" cellpadding="5">
                            <!--<p:inputText id="nombre" value="#{metasManagedBean.leyendaBuscar}" label="#{msg.findley}" labelPosition="left"/>-->
                            <h:outputLabel value="Organismo:" />                          
                            <p:selectOneMenu id="sltOrganismoBusqMeta" value="#{metasManagedBean.idOrganismo}" label="organismo"  required="true" style="width: 100%">
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{objetivosManagedBean.selectItems}" /> 
                                    <p:ajax render="@this sltOrganismoBusqMeta sltOrganismoMsgMeta" event="blur"/> 
                            </p:selectOneMenu>
                            
                            <h:outputLabel value="Objetivo" />
                            <p:selectOneMenu id="sltObjetivoMeta" value="#{metasManagedBean.idObjetivos}" label="objetivo"  required="true" style="width: 550px">
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{metasManagedBean.selectItems}" /> 
                                    <p:ajax render="@this sltObjetivoMeta sltObjetivoMsgMeta" event="blur"/> 
                            </p:selectOneMenu>
                            <h:outputLabel value="Leyenda:" />
                            <p:inputText id="nombre" value="#{metasManagedBean.leyendaBuscar}" labelPosition="left" style="width: 98%"/>
                            
                        </h:panelGrid> 
                        <div align="right">
                            <h:panelGrid columns="2">
                                <p:commandButton id="find" value="${msg.find}" actionListener="#{metasManagedBean.aplicarFiltro}"/>
                                <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{metasManagedBean.actualizar}"/>
                            </h:panelGrid>
                        </div>
                    </p:panel>

                    <p:dataTable id="MetasDataTable" value="#{metasManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                       

                        <p:column id="Organismo" headerText="Organismo">
                            <center>
                                <h:outputText id="cellOrganismo" value="#{item.objetivos.organismo.leyenda}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="descripcion" headerText="Objetivo" >
                            <center>
                                <h:outputText id="cellDescripcion" value="#{item.objetivos.leyenda}" />
                            </center>
                            
                        </p:column>
                        
                        <p:column id="leyendaMeta" headerText="Meta" style="max-width: 200px">
                            <center>
                                <h:outputText id="cellleyendaMeta" value="#{item.leyenda}" />
                                <p:tooltip style="line-height: 20px " id="tooltipMeta" for="cellleyendaMeta" value="Descripción: #{item.descripcion}" showEffect="slide"/>
                            </center>
                        </p:column>

                        <p:column id="situacion" headerText="Situación" >
                            <center>
                                <h:outputText id="cellSituacion" value="#{item.situacion.leyenda}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="cantidad" headerText="Porcentaje">
                            <center>
                                <h:outputText id="cellCantidad" value="#{item.cantidad}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="fechaInicio" headerText="Fecha Inicio." >
                            <center>
                                <h:outputText id="cellfechaInicio" value="#{item.fechaInicio}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>   
                                </h:outputText>
                            </center>
                        </p:column>
                        
                        <p:column id="fechaFinal" headerText="Fecha Final." >
                            <center>
                                <h:outputText id="cellfechaFinal" value="#{item.fechaFinal}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputText>
                            </center>
                        </p:column>
                        
                        <p:column id="IndicadorColumn" headerText="Indicador" >
                            <p:commandButton id="CrearIndicador" actionListener="#{indicadorManagedBean.setIdMeta(item.id)}" action="nuevoIndicador">
                                <img src="images/indicadorIcono.png" />
                                <f:param name="id" value="#{item.id}"/>
                            </p:commandButton>
                            <p:tooltip style="line-height: 20px " id="tooltipInd" for="CrearIndicador" value="NUEVO INDICADOR" showEffect="slide"/>
                        </p:column>

                        <p:column id="accion" headerText="#{msg.actionT}" >
                            <h:panelGrid  columns="3"> 
                                                       
                                <p:commandButton  id="detalle"  action="detalleMeta" actionListener="#{metasManagedBean.verDetalle}" rendered="#{metasManagedBean.detalle}" >
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="editar"  action="editarMeta" actionListener="#{metasManagedBean.prepararParaEditar()}" rendered="#{metasManagedBean.modificacion}" immediate="true"  >
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>
                                
                                <p:commandButton id="eliminar"  rendered="#{metasManagedBean.baja}"  >
                                <img src="images/symbolDeleteWhite.png" />
                                </p:commandButton>
                                                               
                                <h:panelGroup id="confirmDialogMetas" binding="#{confirmDialogMetas}"
                                                        message="${msg.msgDelete}"
                                                        header="${msg.confirm}"
                                                        modal="true"
                                                        width="300"
                                                        height="155"
                                                        position="center">
                                    <h:panelGrid columns="2" class="panel-confirm-buttons">
                                        <p:commandButton id="yes" value="${msg.acep}"  actionListener="#{metasManagedBean.guardarBorrado()}">
                                            <f:param name="id" value="#{item.id}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no" value="${msg.cancel}" >
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </h:panelGroup>

                            </h:panelGrid>
                        </p:column>
                        
                        
                        
                    </p:dataTable>
                </p:panel>           
                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
