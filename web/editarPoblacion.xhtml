<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarPoblacion" title=" ">
                <p:panel id="editarPoblacion" header="Editar Población">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="anio" label="#{msg.name}" value="#{poblacionManagedBean.anio}" required="true" size="55">
                                    <p:ajax render="@this anio anioMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="anioMsg" for="anio" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Trimestre" />
                            </td>
                            <td align="left">
                                <p:inputText id="cuatrimestre" label="Trimestre" value="#{poblacionManagedBean.cuatrimestre}" required="true" size="55">
                                    <p:ajax render="@this cuatrimestre cuatrimestreMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="cuatrimestreMsg" for="cuatrimestre" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Total De Hogares" />
                            </td>
                            <td align="left">
                                <p:inputText id="totaldehogares" label="totaldehogares" value="#{poblacionManagedBean.totalDeHogares}" required="true" size="55">
                                    <p:ajax render="@this totaldehogares totaldehogaresMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="totaldehogaresMsg" for="totaldehogares" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Total " />
                            </td>
                            <td align="left">
                                <p:inputText id="total" label="total" value="#{poblacionManagedBean.total}" required="true" size="55">
                                    <p:ajax render="@this total totalMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="totalMsg" for="total" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{poblacionManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{poblacionManagedBean.guardarEdicion}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="poblacionConf" immediate="true" actionListener="#{poblacionManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
