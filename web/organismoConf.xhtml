<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formOrganismo" title=" ">
                <p:panel id="OrganismoPanelActualizar" header="#{msg.confOrganismo}">
                    <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="organismoConf" actionListener="#{organismoManagedBean.actualizar}" value="#{msg.confOrganismo}"/>
                            |
                        </h:panelGroup>

                        <h:panelGroup rendered="#{organismoManagedBean.alta}">
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevoOrganismo" value="#{msg.newOrganismo}"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:panel id="OrganismoPanelBusqueda" header="#{msg.busqueda}" collapsed="true" toggleable="true" toggleSpeed="200" class="panel-buttons"  >
                        <h:panelGrid  columns="3"  style="margin:10px;">
                            <p:inputText  id="nombre" value="#{organismoManagedBean.leyendaBuscar}" label="#{msg.name}" labelPosition="left"/>
                            <p:commandButton id="find" value="${msg.find}" actionListener="#{organismoManagedBean.aplicarFiltro}"/>
                            <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{organismoManagedBean.actualizar}"/>
                        </h:panelGrid>                     
                    </p:panel>

                    <p:dataTable id="OrganismoPanelDataTable" value="#{organismoManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                        
                        
                        <p:column id="cod" headerText="Cod. Organismo">
                            <center>
                                <h:outputText id="cellCod" value="#{item.codOrganigrama}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="nombre" headerText="#{msg.nameT}">
                            <center>
                                <h:outputText id="cellNombre" value="#{item.leyenda}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="descentralizado" headerText="¿REALIZA OBRAS?">
                            <center>
                                <h:outputLabel value="#{item.descentralizado? 'SI' : 'NO'}"/>
                            </center>
                        </p:column>

                        <p:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <h:panelGrid  columns="3"> 
                                
                                <p:commandButton id="detalle"  action="detalleOrganismo" actionListener="#{organismoManagedBean.verDetalle}" rendered="#{organismoManagedBean.detalle}">
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="editar"  action="editarOrganismo" actionListener="#{organismoManagedBean.prepararParaEditar()}" rendered="#{organismoManagedBean.modificacion}">
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>
                                
                                <p:commandButton id="eliminar"  rendered="#{organismoManagedBean.baja}" >
                                    <img src="images/symbolDeleteWhite.png" /> 
                                </p:commandButton>
                                <h:panelGroup id="confirmDialogOrganismo" binding="#{confirmDialogOrganismo}"
                                                        message="${msg.msgDelete}"
                                                        header="${msg.confirm}"
                                                        modal="true"
                                                        width="300"
                                                        height="155"
                                                        position="center">
                                    <h:panelGrid columns="2" class="panel-confirm-buttons">
                                        <p:commandButton id="yes" value="${msg.acep}"  actionListener="#{organismoManagedBean.guardarBorrado()}">
                                            <f:param name="id" value="#{item.id}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no" value="${msg.cancel}" >
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </h:panelGroup>

                            </h:panelGrid>
                        </p:column>                    
                    </p:dataTable>
                </p:panel>           
                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
