<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                template="./layout.xhtml"
                xmlns:pt="jakarta.faces.passthrough">
        <ui:define name="content">
            <h:form id="formObras" title=" ">
                <p:panel id="ObrasPanelActualizar" header="#{msg.confObra}">
                    <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="obrasConf" actionListener="#{obrasManagedBean.actualizar}" value="#{msg.confObra}"/>
                            |
                        </h:panelGroup>

                        <h:panelGroup rendered="#{obrasManagedBean.alta}">
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevaObra" value="Nueva Obra"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:panel id="obrasPanelBusqueda" header="#{msg.busqueda}" collapsed="TRUE" toggleable="true" toggleSpeed="200" class="panel-buttons">
                        <h:panelGrid  columns="2" cellspacing="5" cellpadding="5">
                            <h:outputLabel value="Organismo" /> 
                            <p:selectOneMenu id="sltOrganismoBusq" value="#{obrasManagedBean.idOrganismo}" label="organismo"  required="true" style="width: 100%" >
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{obrasManagedBean.selectItemsOrg}" /> 
                                    <p:ajax render="@this sltOrganismoBusq sltOrganismoMsgBusq" event="blur"/> 
                            </p:selectOneMenu>
                            <h:outputLabel value="Situación" />                          
                            <p:selectOneMenu id="sltSituacion" value="#{obrasManagedBean.situacionBuscar}" label="situacion"  required="true" style="width: 100%" >
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{obrasManagedBean.selectItems}" /> 
                                    <p:ajax render="@this sltSituacion sltSituacionMsg" event="blur"/> 
                            </p:selectOneMenu>
                            
                            <h:outputLabel value="Leyenda:" />
                            <p:inputText id="nombre" value="#{obrasManagedBean.leyendaBuscar}" labelPosition="left" style="width: 98%"/>
                            
                        </h:panelGrid> 
                        <div align="right">
                            <h:panelGrid columns="2">
                                <p:commandButton id="find" value="${msg.find}" actionListener="#{obrasManagedBean.aplicarFiltro}"/>
                                <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{obrasManagedBean.actualizar}"/>
                            </h:panelGrid>
                        </div>
                    </p:panel>

                    <p:dataTable id="ObrasDataTable" value="#{obrasManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                         <p:column id="descripcionOrg" headerText="Organismo">
                            <center>
                                <h:outputText id="cellDescripcionOrg" value="#{item.organismo.leyenda}"/>
                            </center>
                        </p:column>
                       

                        <p:column id="nombre" headerText="#{msg.findley}">
                            <center>
                                <h:outputText id="cellNombre" value="#{item.leyenda}"/>
                            </center>
                        </p:column>

                       
                        
                        <p:column id="situacion" headerText="Situación">
                            <center>
                                <h:outputText id="cellSituacion" value="#{item.situacion.leyenda}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="Latitud" headerText="Latitud">
                            <center>
                                <h:outputText id="cellLatitud" value="#{item.latitud}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="Longitud" headerText="Longitud">
                            <center>
                                <h:outputText id="cellLongitud" value="#{item.longitud}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="Localidad" headerText="Localidad">
                            <center>
                                <h:outputText id="cellLocalidad" value="#{item.localidad.leyenda}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="ubicacion" headerText="Ubicación" style="width: 530px">
                            <h:panelGrid columns="2" cellpadding="2">
                                <h:outputText value="Lat:" />
                                <h:outputText value="#{item.latitud}" />
                                <h:outputText value="Lng:" />
                                <h:outputText value="#{item.longitud}" />
                            </h:panelGrid>
                         </p:column>
                        <p:column id="fechaInicioObra1" headerText="Fecha Inicio.">
                            <center>
                                <h:outputText id="cellfechaInicioObra1" value="#{item.fechaInicio}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>   
                                </h:outputText>
                            </center>
                        </p:column>
                        
                        <p:column id="fechaFinalObra1" headerText="Fecha Final.">
                            <center>
                                <h:outputText id="cellfechaFinalObra1" value="#{item.fechaFinal}">
                                    <f:convertDateTime pattern="dd/MM/yyyy" locale="es_AR" timeZone="America/Argentina/Buenos_Aires"/>
                                </h:outputText>
                            </center>
                        </p:column>
                        
                        
                        
                        
                        
                        <p:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <h:panelGrid  columns="4"> 
                                                       
                                
                                <p:commandButton  id="detalle"  action="detalleObras" actionListener="#{obrasManagedBean.verDetalle}" rendered="#{obrasManagedBean.detalle}" >
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="editar"  action="editarObras" actionListener="#{obrasManagedBean.prepararParaEditar()}" rendered="#{obrasManagedBean.modificacion}" immediate="true"  >
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>
                                
                                <p:commandButton id="eliminar" rendered="#{obrasManagedBean.baja}" actionListener="#{obrasManagedBean.guardarBorrado()}">
                                    <img src="images/symbolDeleteWhite.png" />
                                    <f:param name="id" value="#{item.id}" />
                                </p:commandButton>

                            </h:panelGrid>
                        </p:column>
                        
                       
                        
                    </p:dataTable>
                </p:panel>           
                
                
             
        
            </h:form>
        </ui:define>
    </ui:composition>
</html>
