<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formEditarOperaciones" title=" ">
                <p:panel id="editarOperaciones" header="#{msg.editVariable}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="leyenda" label="(*) Leyenda:" value="#{variablesManagedBean.leyenda}" required="true" size="55">
                                    <p:ajax render="@this leyenda leyendaMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="leyendaMsg" for="leyenda" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripcion:" />
                            </td>
                            <td align="left">
                                <p:inputText id="descripcion" label="Formula" value="#{variablesManagedBean.descripcion}" required="true" size="55">
                                    <p:ajax render="@this descripcion descripcionMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="descripcionMsg" for="descripcion" initEffect="slide" changeEffect="shake"/>  
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Indicador" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltIndicador" value="#{variablesManagedBean.idIndicador}" label="indicador"  required="true" width="400">
                                    <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{variablesManagedBean.selectItems}" /> 
                                    <p:ajax render="@this sltIndicador sltIndicadorMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltIndicadorMsg" for="sltIndicador" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                    </table>                    
                    
                    <h:inputHidden value="#{variablesManagedBean.id}" />
                    
                    <h:panelGrid id="buttonGrid" columns="2" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.saveEdit}" action="#{variablesManagedBean.guardarEdicion}"/>                        
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="variablesConf" immediate="true" actionListener="#{variablesManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
