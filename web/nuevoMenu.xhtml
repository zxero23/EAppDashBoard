<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevoMenu" title=" ">
                <p:panel id="nuevoMenu" header="#{msg.newMenu}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.nameMenuPadre}" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="selectMenuNew" value="#{menuManagedBean.idMenuPadre}" label="menú"  required="true">
                                    <f:selectItem  itemValue="0"  itemLabel="NINGUNO"/>
                                    <f:selectItems value="#{menuManagedBean.selectItems}" /> 
                                    <p:ajax render="@this selectMenuNew selectMenuNewMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="selectMenuNewMsg" for="selectMenuNew" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>  
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="nombre" label="nombre" value="#{menuManagedBean.nombre}" required="true">
                                    <p:ajax render="@this nombre nombreMsg" event="blur"/>                                
                                </p:inputText> 
                            </td>
                            <td align="left">
                                <p:message id="nombreMsg" for="nombre" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr> 
                    </table>
                    
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.save}" action="#{menuManagedBean.crear()}"/>
                        <p:commandButton id="saveCreate" value="#{msg.saveCreate}" action="#{menuManagedBean.crearOtro()}"/>
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="menuConf" immediate="true" actionListener="#{menuManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
