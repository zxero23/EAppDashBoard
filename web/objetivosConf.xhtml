<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formObjetivos" title=" ">
                <p:panel id="ObjetivosPanelActualizar" header="#{msg.confObjetivo}">
                    <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="objetivosConf" actionListener="#{objetivosManagedBean.actualizar}" value="#{msg.confObjetivo}"/>
                            |
                        </h:panelGroup>

                        <h:panelGroup rendered="#{objetivosManagedBean.alta}" >
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevoObjetivos" value="#{msg.newObjetivo}"/>
                        </h:panelGroup>
                    </h:panelGrid>
                   
                    <p:panel id="objetivosPanelBusqueda" collapsed="TRUE" header="#{msg.busqueda}" toggleable="true" toggleSpeed="200" class="panel-buttons" >
                            <h:panelGrid  columns="2" cellpadding="5" cellspacing="5">
                                <!--<p:inputText id="nombre" value="#{objetivosManagedBean.leyendaBuscar}" label="#{msg.findley}:" labelPosition="left"/>-->
                                <h:outputLabel value="Organismo:" />                          
                                <p:selectOneMenu id="sltOrganismoBusq" value="#{objetivosManagedBean.idOrganismo}" label="organismo"  required="true" style="width: 100%" >
                                        <f:selectItem  itemValue="0" itemLabel="NINGUNO"/>
                                        <f:selectItems value="#{objetivosManagedBean.listaOrganismo}" /> 
                                        <p:ajax render="@this sltOrganismoBusq sltOrganismoMsg" event="blur"/> 
                                </p:selectOneMenu>

                                <h:outputLabel value="Leyenda:" />
                                <p:inputText id="nombre" value="#{objetivosManagedBean.leyendaBuscar}" labelPosition="left" style="width: 98%"/>

                                
                            </h:panelGrid> 
                            <div align="right">    
                                    <h:panelGrid columns="2">
                                        <p:commandButton id="find" value="${msg.find}" actionListener="#{objetivosManagedBean.aplicarFiltro()}" style="float: right"/>
                                        <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{objetivosManagedBean.actualizar}"/>
                                    </h:panelGrid>
                            </div>
                        </p:panel>
                    

                    <p:dataTable id="ObjetivoDataTable"  value="#{objetivosManagedBean.listElements}"  var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">



                        <p:column id="org" headerText="Organismo" >
                            <center>
                                <h:outputText id="cellorg" value="#{item.organismo.leyenda}"/>
                            </center>
                        </p:column>
                        
                        <p:column id="nombre" headerText="#{msg.findley}">
                            <center>
                                <h:outputText id="cellNombre" value="#{item.leyenda}"/>
                                <p:tooltip style="line-height: 20px" id="tooltipNombre" for="cellNombre" value="Descripción: #{item.descripcion}" showEffect="slide"/>
                            </center>
                        </p:column>
                        
                         

                        <p:column id="leyendaObj" headerText="#{msg.sit}"  >
                            <center>
                                <h:outputText id="cellleyendaObj" value="#{item.situacion.leyenda}" style="max-width: 200px"/>
                            </center>    
                        </p:column>



                        <p:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <h:panelGrid  columns="3"> 

                                <p:commandButton id="detalle"  action="detalleObjetivos" actionListener="#{objetivosManagedBean.verDetalle}" rendered="#{objetivosManagedBean.detalle}">
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="editar" action="editarObjetivos" actionListener="#{objetivosManagedBean.prepararParaEditar()}" rendered="#{objetivosManagedBean.modificacion}">
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="eliminar"  rendered="#{objetivosManagedBean.baja}" >
                                    <img src="images/symbolDeleteWhite.png" /> 
                                </p:commandButton>
                                <h:panelGroup id="confirmDialogObjetivos" binding="#{confirmDialogObjetivos}"
                                                        message="${msg.msgDelete}"
                                                        header="${msg.confirm}"
                                                        modal="true"
                                                        width="300"
                                                        height="155"
                                                        position="center">
                                    <h:panelGrid columns="2" class="panel-confirm-buttons">
                                        <p:commandButton id="yes" value="${msg.acep}"  actionListener="#{objetivosManagedBean.guardarBorrado()}">
                                            <f:param name="id" value="#{item.id}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no" value="${msg.cancel}" >
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </h:panelGroup>

                            </h:panelGrid>
                        </p:column> 





                    </p:dataTable>
                </p:panel>



            </h:form>
        </ui:define>
    </ui:composition>
</html>
