<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:ace="http://www.icefaces.org/icefaces/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevaObjetivo" title=" ">
                <ace:panel id="nuevaObjetivo" header="#{msg.newObjetivo}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Organismo:" />
                            </td>
                            <td align="left">
                                <ace:simpleSelectOneMenu id="sltOrganismo" value="#{objetivosManagedBean.idOrganismo}" label="organismo"  required="true">
                                    <f:selectItems value="#{objetivosManagedBean.selectItems}" /> 
                                    <ace:ajax render="@this sltOrganismo sltOrganismoMsg" event="blur"/> 
                                </ace:simpleSelectOneMenu>
                            </td>
                            <td align="left">
                                <ace:message id="sltOrganismoMsg" for="sltOrganismo" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                          <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Situacion:" />
                            </td>
                            <td align="left">
                                <ace:simpleSelectOneMenu id="sltSituacion" value="#{objetivosManagedBean.idSituacion}" label="situacion"  required="true">
                                    
                                    <f:selectItems value="#{objetivosManagedBean.selectItemsSituacion}" /> 
                                    <ace:ajax render="@this sltSituacion sltSituacionMsg" event="blur"/> 
                                </ace:simpleSelectOneMenu>
                            </td>
                            <td align="left">
                                <ace:message id="sltSituacionMsg" for="sltSituacion" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <ace:textEntry id="nombre" label="#{msg.name}" value="#{objetivosManagedBean.leyenda}" required="true" size="53">
                                    <ace:ajax render="@this nombre nombreMsg" event="blur"/>                                
                                </ace:textEntry>
                            </td>
                            <td align="left">
                                <ace:message id="nombreMsg" for="nombre" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripción" />
                            </td>
                            <td align="left">
                                <ace:textAreaEntry id="descripcion" style="width: 200px" label="#{msg.name}" value="#{objetivosManagedBean.descripcion}" required="true">
                                    <ace:ajax render="@this descripcion descripcionMsg" event="blur"/>                                
                                </ace:textAreaEntry>
                            </td>
                            <td align="left">
                                <ace:message id="descripcionMsg" for="descripcion" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        
                     </table>
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <ace:pushButton id="save" value="#{msg.save}" action="#{objetivosManagedBean.crear()}"/>
                        <ace:pushButton id="saveCreate" value="#{msg.saveCreate}" action="#{objetivosManagedBean.crearOtro()}"/>
                        <ace:pushButton id="cancel" value="#{msg.cancel}" action="objetivosConf" immediate="true" actionListener="#{objetivosManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </ace:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
