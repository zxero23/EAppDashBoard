<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formNuevaObjetivo" title=" ">
                <p:panel id="nuevaObjetivo" header="#{msg.newObjetivo}">
                    <table border="0" cellspacing="5" class="panel-buttons">
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Organismo:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltOrganismo" value="#{objetivosManagedBean.idOrganismo}" label="organismo"  required="true">
                                    <f:selectItems value="#{objetivosManagedBean.selectItems}" /> 
                                    <p:ajax render="@this sltOrganismo sltOrganismoMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltOrganismoMsg" for="sltOrganismo" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                          <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Situacion:" />
                            </td>
                            <td align="left">
                                <p:selectOneMenu id="sltSituacion" value="#{objetivosManagedBean.idSituacion}" label="situacion"  required="true">
                                    
                                    <f:selectItems value="#{objetivosManagedBean.selectItemsSituacion}" /> 
                                    <p:ajax render="@this sltSituacion sltSituacionMsg" event="blur"/> 
                                </p:selectOneMenu>
                            </td>
                            <td align="left">
                                <p:message id="sltSituacionMsg" for="sltSituacion" initEffect="slide" changeEffect="shake"/>
                            </td>
                        </tr>
                        
                        <tr>
                            <td align="right">
                                <h:outputLabel value="(*) #{msg.name}" />
                            </td>
                            <td align="left">
                                <p:inputText id="nombre" label="#{msg.name}" value="#{objetivosManagedBean.leyenda}" required="true" size="53">
                                    <p:ajax render="@this nombre nombreMsg" event="blur"/>                                
                                </p:inputText>
                            </td>
                            <td align="left">
                                <p:message id="nombreMsg" for="nombre" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                         <tr>
                            <td align="right">
                                <h:outputLabel value="(*) Descripción" />
                            </td>
                            <td align="left">
                                <p:inputTextarea id="descripcion" style="width: 200px" label="#{msg.name}" value="#{objetivosManagedBean.descripcion}" required="true">
                                    <p:ajax render="@this descripcion descripcionMsg" event="blur"/>                                
                                </p:inputTextarea>
                            </td>
                            <td align="left">
                                <p:message id="descripcionMsg" for="descripcion" initEffect="slide" changeEffect="shake"/> 
                            </td>
                        </tr>
                        
                     </table>
                    <h:panelGrid id="buttonGrid" columns="3" class="panel-buttons">
                        <p:commandButton id="save" value="#{msg.save}" action="#{objetivosManagedBean.crear()}"/>
                        <p:commandButton id="saveCreate" value="#{msg.saveCreate}" action="#{objetivosManagedBean.crearOtro()}"/>
                        <p:commandButton id="cancel" value="#{msg.cancel}" action="objetivosConf" immediate="true" actionListener="#{objetivosManagedBean.limpiar()}"/>
                    </h:panelGrid>
                </p:panel>                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
