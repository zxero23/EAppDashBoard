<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">      
    <ui:composition template="./layout.xhtml">
        <ui:define name="content">
            <h:form id="formUsuario" title=" ">
                <p:panel id="UsuarioPanelActualizar" header="#{msg.confUsuario}">
                    <h:panelGrid  columns="2" class="panel-buttons">
                        <h:panelGroup>
                            <img src="images/symbolRefresh.png" align="absmiddle" border="0" alt="" title="Refrescar" style="margin-right: 5px;"/>
                            <p:commandLink action="usuarioConf" actionListener="#{usuarioManagedBean.actualizar}" value="#{msg.confUsuario}"/>
                            |
                        </h:panelGroup>

                        <h:panelGroup rendered="#{usuarioManagedBean.alta}">
                            <img src="images/symbolAdd.png" align="absmiddle" border="0" alt="" title="Nuevo" style="margin-right: 5px;"/>
                            <p:commandLink action="nuevoUsuario" value="#{msg.newUsuario}"/>
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:panel id="UsuarioPanelBusqueda" header="#{msg.busqueda}" toggleable="true" closeSpeed="200" class="panel-buttons">
                        <h:panelGrid  columns="3">
                            <p:inputText id="nombre" value="#{usuarioManagedBean.nombreBuscar}" label="#{msg.name}" labelPosition="left"/>
                            <p:commandButton id="find" value="${msg.find}" actionListener="#{usuarioManagedBean.aplicarFiltro}"/>
                            <p:commandButton id="actualizar" value="#{msg.actualizar}" actionListener="#{usuarioManagedBean.actualizar}"/>
                        </h:panelGrid>                     
                    </p:panel>

                    <p:dataTable id="UsuarioPanelDataTable" value="#{usuarioManagedBean.listElements}" var="item" paginator="true" paginatorPosition="bottom" rows="10" class="panel-buttons">
                        
                        <p:column id="id" headerText="#{msg.idT}" style="width: 7%">
                            <h:outputText id="cellId" value="#{item.id}"/>
                        </p:column>

                        <p:column id="Nombre" headerText="Nombre">
                            <h:outputText id="cellNombre" value="#{item.nombre}"/>
                        </p:column>
                        
                        <p:column id="Apellido" headerText="Apellido">
                            <h:outputText id="cellApellido" value="#{item.apellido}"/>
                        </p:column>

                        <p:column id="uss" headerText="Usuario">
                            <h:outputText id="cellUss" value="#{item.nombreUsuario}"/>
                        </p:column>
                        
                        <p:column id="pass" headerText="Contraseña">
                            <h:outputText id="cellPass" value="#{item.claveAcceso}"/>
                        </p:column>
                        
                        <p:column id="nombreOrganismo" headerText="Organismo">
                            <h:outputText value="#{item.organismo.leyenda}"/>
                        </p:column>

                        <p:column id="accion" headerText="#{msg.actionT}" style="width: 15%">
                            <h:panelGrid  columns="3"> 
                                
                                <p:commandButton id="detalle"  action="detalleUsuario" actionListener="#{usuarioManagedBean.verDetalle}" rendered="#{usuarioManagedBean.detalle}">
                                    <img src="images/symbolZoomInWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>

                                <p:commandButton id="editar"  action="editarUsuario" actionListener="#{usuarioManagedBean.prepararParaEditar()}" rendered="#{usuarioManagedBean.modificacion}">
                                    <img src="images/symbolEditWhite.png" />
                                    <f:param name="id" value="#{item.id}"/>
                                </p:commandButton>
                                
                                <p:commandButton id="eliminar"  rendered="#{usuarioManagedBean.baja}" >
                                     <img src="images/symbolDeleteWhite.png" /> 
                                </p:commandButton>
                                <h:panelGroup id="confirmDialogUsuario" binding="#{confirmDialogUsuario}"
                                                        message="${msg.msgDelete}"
                                                        header="${msg.confirm}"
                                                        modal="true"
                                                        width="300"
                                                        height="155"
                                                        position="center">
                                    <h:panelGrid columns="2" class="panel-confirm-buttons">
                                        <p:commandButton id="yes" value="${msg.acep}"  actionListener="#{usuarioManagedBean.guardarBorrado()}">
                                            <f:param name="id" value="#{item.id}" />
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                        <p:commandButton id="no" value="${msg.cancel}" >
                                            <f:ajax execute="@this" render="@all"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </h:panelGroup>

                            </h:panelGrid>
                        </p:column>                    
                    </p:dataTable>
                </p:panel>           
                
            </h:form>
        </ui:define>
    </ui:composition>
</html>
